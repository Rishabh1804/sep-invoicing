<!DOCTYPE html>
<!-- The office QR's page (split/checkin.js, docs/WORKERS_AND_PLANT.md W5). A worker's phone opens it from the sheet in the
     office. It holds nothing of the shop: the office number, the plant's place, the key and the name arrive in the link's
     fragment, which no server ever sees. It keeps one thing on the phone, the card number, so it is asked once. It writes a
     check-in and opens WhatsApp to the office with it; the app reads the chat and checks each one. Hand-written, not built:
     build.sh does not touch it, and it registers no service worker. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Check in</title>
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f4f3ef, #16181a); --surface: light-dark(#fbfaf7, #1f2225); --text: light-dark(#1a1a1a, #e8e6e1);
  --text-2: light-dark(#55524c, #a9a59d); --border: light-dark(#d9d6cf, #34383c); --accent: light-dark(#0f766e, #2dd4bf);
  --on-accent: light-dark(#f4f3ef, #0b1413); --ok: light-dark(#15803d, #4ade80); --warn: light-dark(#b45309, #fbbf24); --danger: light-dark(#b91c1c, #f87171);
  --sp: 16px; --r: 10px; --touch: 48px; --fs: 17px; --fs-sm: 14px; --fs-lg: 22px; --ff: system-ui, 'Segoe UI', sans-serif; --ff-mono: ui-monospace, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--ff); font-size: var(--fs); line-height: 1.45; }
.inv-ck-page { max-width: 460px; margin: 0 auto; padding: var(--sp); display: flex; flex-direction: column; gap: var(--sp); }
.inv-ck-co { font-size: var(--fs-sm); font-weight: 700; text-transform: uppercase; color: var(--text-2); }
.inv-ck-h { font-size: var(--fs-lg); font-weight: 700; margin: 0; }
.inv-ck-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: var(--sp); display: flex; flex-direction: column; gap: 12px; }
.inv-ck-label { font-size: var(--fs-sm); color: var(--text-2); }
.inv-ck-input { min-height: var(--touch); font: inherit; font-family: var(--ff-mono); padding: 0 12px; border: 1px solid var(--border); border-radius: var(--r); background: var(--bg); color: var(--text); text-transform: uppercase; }
.inv-ck-btn { min-height: var(--touch); font: inherit; font-weight: 600; border: 0; border-radius: var(--r); background: var(--accent); color: var(--on-accent); text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; padding: 0 var(--sp); cursor: pointer; }
.inv-ck-btn[hidden], .inv-ck-hidden { display: none; }
.inv-ck-say { font-size: var(--fs-sm); }
.inv-ck-say[data-tone="ok"] { color: var(--ok); }
.inv-ck-say[data-tone="warning"] { color: var(--warn); }
.inv-ck-say[data-tone="danger"] { color: var(--danger); }
.inv-ck-msg { margin: 0; font-family: var(--ff-mono); font-size: var(--fs-sm); white-space: pre-wrap; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; }
.inv-ck-note { font-size: var(--fs-sm); color: var(--text-2); }
</style>
</head>
<body>
<main class="inv-ck-page">
  <div class="inv-ck-co" id="ckCo"></div>
  <h1 class="inv-ck-h">Mark your attendance</h1>
  <div class="inv-ck-card" id="ckForm">
    <label class="inv-ck-label" for="ckCard">Your card number</label>
    <input class="inv-ck-input" id="ckCard" inputmode="text" autocomplete="off" placeholder="SEP-0007">
    <button class="inv-ck-btn" id="ckGo" type="button">Check in</button>
    <div class="inv-ck-say" id="ckSay" aria-live="polite"></div>
  </div>
  <div class="inv-ck-card inv-ck-hidden" id="ckOut">
    <div class="inv-ck-label">The message WhatsApp will send</div>
    <pre class="inv-ck-msg" id="ckMsg"></pre>
    <a class="inv-ck-btn" id="ckSend" href="#">Send on WhatsApp</a>
    <div class="inv-ck-note">Send it as it is, from your own phone. A message changed by hand, from another phone or from outside the plant is flagged in the office.</div>
  </div>
</main>
<script>
(function () {
  'use strict';
  // A new sheet scanned into the same tab changes only the fragment: read it afresh.
  window.addEventListener('hashchange', function () { location.reload(); });
  // The same code as split/checkin.js's ckCode: FNV-1a over key|card|day|minute|place|the phone's card, four base-36 characters.
  function ckCode(key, card, iso, min, place, phone) {
    var s = String(key) + '|' + String(card) + '|' + String(iso) + '|' + String(min) + '|' + String(place || 'none') + '|' + String(phone || ''), h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return ('0000' + (h % 1679616).toString(36).toUpperCase()).slice(-4);
  }
  function metres(la1, lo1, la2, lo2) {
    var r = Math.PI / 180, a = Math.sin((la2 - la1) * r / 2), b = Math.sin((lo2 - lo1) * r / 2);
    var h = a * a + Math.cos(la1 * r) * Math.cos(la2 * r) * b * b;
    return Math.round(2 * 6371000 * Math.asin(Math.min(1, Math.sqrt(h))));
  }
  var p = {};
  String(location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) {
    var i = kv.indexOf('=');
    if (i > 0) { try { p[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); } catch (e) { /* a broken part is left out */ } }
  });
  var office = String(p.o || '').replace(/\D/g, ''), la = parseFloat(p.la), lo = parseFloat(p.lo), rad = parseInt(p.r, 10) || 150, key = p.k || '';
  var $ = function (id) { return document.getElementById(id); };
  var say = function (t, tone) { var e = $('ckSay'); e.textContent = t; e.setAttribute('data-tone', tone || ''); };
  $('ckCo').textContent = p.n || '';
  if (office.length < 10 || !isFinite(la) || !isFinite(lo) || !key) {
    $('ckGo').hidden = true;
    say('This link is not complete: scan the sheet in the office again.', 'danger');
    return;
  }
  var store = { get: function () { try { return localStorage.getItem('sep_ck_card') || ''; } catch (e) { return ''; } },
    set: function (v) { try { localStorage.setItem('sep_ck_card', v); } catch (e) { /* asked again next time */ } } };
  $('ckCard').value = store.get();
  function cardOf(v) {
    var m = /^\s*(?:SEP-?)?(\d{1,6})\s*$/i.exec(String(v || ''));
    return m ? 'SEP-' + String(+m[1]).padStart(4, '0') : null;
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  // The card this phone was first set up with: another typed on it is written into the check-in, and the office sees it.
  function write(card, pos, why) {
    var own = store.get();
    if (!own) { store.set(card); own = card; }
    var now = new Date(), iso = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()), min = now.getHours() * 60 + now.getMinutes();
    var lines = ['SEP check-in', 'Card ' + card, 'Time ' + pad(now.getDate()) + '/' + pad(now.getMonth() + 1) + '/' + now.getFullYear() + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes())];
    var place = pos ? pos.coords.latitude.toFixed(6) + ',' + pos.coords.longitude.toFixed(6) : '', phone = own !== card ? own : '';
    if (pos) {
      lines.push('Place ' + place + ' ±' + Math.round(pos.coords.accuracy) + ' m');
      var d = metres(la, lo, pos.coords.latitude, pos.coords.longitude);
      if (d > rad) say('Your phone says it is ' + d + ' m from the plant. The office will see this.', 'warning');
      else say('At the plant. Now send it.', 'ok');
    } else {
      lines.push('Place not shared (' + why + ')');
      say('The location was not shared (' + why + '). The office will see this.', 'warning');
    }
    if (phone) {
      lines.push('Phone ' + phone);
      say('This phone is set up for ' + phone + '. The office will see that it sent ' + card + '.', 'warning');
    }
    lines.push('Code ' + ckCode(key, card, iso, min, place, phone));
    var text = lines.join('\n');
    $('ckMsg').textContent = text;
    $('ckSend').href = 'https://wa.me/' + office + '?text=' + encodeURIComponent(text);
    $('ckOut').classList.remove('inv-ck-hidden');
    $('ckGo').disabled = false;
  }
  $('ckGo').addEventListener('click', function () {
    var card = cardOf($('ckCard').value);
    if (!card) { say('Type the number on your card, like SEP-0007.', 'danger'); return; }
    $('ckCard').value = card;
    $('ckGo').disabled = true;
    if (!navigator.geolocation) { write(card, null, 'this phone cannot'); return; }
    say('Finding where the phone is…');
    navigator.geolocation.getCurrentPosition(function (pos) { write(card, pos); },
      function (e) { write(card, null, e && e.code === 1 ? 'refused' : 'not found'); },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
})();
</script>
</body>
</html>
