name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are worth cancelling; commits on main are not — each
  # one should keep its own recorded result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Neither job does anything but read the tree.
permissions:
  contents: read

jobs:
  build-sync:
    name: Build output in sync with split/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # AGENTS.md rule 1: never edit the built output directly, never bypass
      # build.sh. This job is what makes that rule enforceable — it runs the
      # same command a developer runs and fails if anything changes, so the
      # check can't drift from the build it is checking.
      - name: Rebuild from split/ modules
        run: bash split/build.sh

      - name: Committed HTML matches split/ sources
        run: |
          if ! git diff --exit-code -- sep-invoicing.html index.html version.json; then
            echo "::error::Built output is stale. Run 'bash split/build.sh' and commit the result. Enabling the pre-commit hook (git config core.hooksPath .githooks) does this automatically."
            exit 1
          fi

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    # A hang backstop, not a budget: without it a wedged browser would burn the
    # 6h job default. The suite itself takes ~13 min on two workers (1,275 tests,
    # Oct 2026) and the apt step behind Chromium's install has taken 5 min on its
    # own, so 15 cut real runs off mid-suite.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only Chromium — both Playwright projects (mobile-chromium via the Pixel 5
      # descriptor, desktop-chromium) run on it.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e suite
        run: pnpm exec playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
