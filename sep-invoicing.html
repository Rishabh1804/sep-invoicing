/* ===== EXPORT =====
   Its own file rather than rows inside the GSTR1 sheet: credit notes go to
   table 9B (CDNR), whose columns are not the B2B ones, and mixing the two
   shapes into one flat sheet would corrupt both. A cancelled note is declared
   at zero, the same treatment a cancelled invoice already gets. */
function exportCreditNotesCSV() {
  var notes = getCreditNotes().slice().sort(function(a, b) {
    return (parseInt(a.cnNumber, 10) || 0) - (parseInt(b.cnNumber, 10) || 0);
  });
  if (notes.length === 0) { showToast('No credit notes to export', 'warning'); return; }

  var metaRow = ['SOMA ELECTRO PRODUCTS | GSTIN: ' + (S.company.gstin || '') +
    ' | Export Date: ' + formatDateExport(localDateStr())];
  var header = ['GSTIN/UIN of Recipient', 'Receiver Name', 'Note Number', 'Note Date', 'Note Type',
    'Place Of Supply', 'Note Value', 'Rate', 'Taxable Value', 'CGST Amount', 'SGST Amount',
    'IGST Amount', 'Cess Amount', 'Against Invoices', 'Period From', 'Period To', 'Discount %', 'Batch Taxable', 'Status'];
  var rows = [metaRow, header];
  notes.forEach(function(cn) {
    var z = cn.status === 'cancelled';
    var rate = (cn.cgstPer || 0) + (cn.sgstPer || 0) + (cn.igstPer || 0);
    rows.push([
      cn.clientGSTIN || '', cn.clientName, cn.displayNumber, formatDateExport(cn.date), 'C',
      ((cn.clientAddress && cn.clientAddress.stateCode) || '20') + '-' + ((cn.clientAddress && cn.clientAddress.state) || 'Jharkhand'),
      z ? 0 : (cn.grandTotal || 0), z ? 0 : rate, z ? 0 : (cn.taxableValue || 0),
      z ? 0 : (cn.cgstAmt || 0), z ? 0 : (cn.sgstAmt || 0), z ? 0 : (cn.igstAmt || 0), 0,
      (cn.invoiceNumbers || []).join(' '), formatDateExport(cn.periodFrom), formatDateExport(cn.periodTo),
      cn.discountPct, cn.batchTaxable, z ? 'Cancelled' : 'Active'
    ]);
  });
  // Named for what the file holds, not for the register's filters. It borrowed
  // exportScopeLabel(), so a file containing every credit note came out stamped
  // with whatever month the register happened to be showing.
  // From the dates themselves, not from the ends of a list ordered by number:
  // the two orderings usually agree, but a back-dated note would misname the
  // file with no way of noticing.
  var dates = notes.map(function(c) { return c.date; }).filter(Boolean).sort();
  var span = dates.length === 0 ? 'all'
    : dates[0] === dates[dates.length - 1] ? dates[0]
    : dates[0] + '_to_' + dates[dates.length - 1];
  downloadCSV('SEP-Credit-Notes_' + span + '.csv', rows);
  showToast('Credit notes exported (' + notes.length + ')');
}
/* ===== CHARTS =====
 *
 * Reusable SVG chart renderers. Pulled out of stats.js because the trend chart
 * there was one function that could draw exactly one thing: a line, stretched
 * with preserveAspectRatio="none" so circles rendered as ellipses and a wide
 * desktop got the same 400×160 drawing smeared across it. Only the two
 * endpoints were labelled and no point carried its value, so the shape was
 * readable and the numbers were not.
 *
 * Everything here draws into a square-ish viewBox at its natural aspect and is
 * sized by CSS, so the same series is legible on a 393px phone and a 1280px
 * desktop without a second code path.
 */

var CHART_SERIES_MAX = 8;

/* A round number at or above the data's peak, so the gridline labels read
   1.5L rather than 1,47,382.19. */
function chartNiceMax(v) {
  if (!(v > 0)) return 1;
  var mag = Math.pow(10, Math.floor(Math.log10(v)));
  var n = v / mag;
  var step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return step * mag;
}

/* Axis and tooltip formatting per unit. Rupees get lakh/thousand shortening
   because a job-work month runs to seven figures and the axis is 40px wide. */
function chartShort(v, unit) {
  if (unit === 'kg') {
    return Math.abs(v) >= 1000 ? formatNum(v / 1000, 1) + 't' : formatNum(v, 0) + 'kg';
  }
  if (unit === 'count') return formatNum(v, 0);
  if (Math.abs(v) >= 100000) return '₹' + formatNum(v / 100000, 1) + 'L';
  if (Math.abs(v) >= 1000) return '₹' + formatNum(v / 1000, 0) + 'K';
  return '₹' + formatNum(v, 0);
}

function chartFull(v, unit) {
  if (unit === 'kg') return formatNum(v, 0) + ' kg';
  if (unit === 'count') return formatNum(v, 0);
  return formatCurrency(v);
}

/* How many x labels fit without overlapping, given the width the chart gets. */
function _chartLabelStride(n, maxLabels) {
  return Math.max(1, Math.ceil(n / (maxLabels || 6)));
}

function _chartEmpty(msg) {
  return '<div class="inv-chart-empty">' + escHtml(msg) + '</div>';
}

/* ===== TIME SERIES =====
   data: [{label, value}]. Line and bar share the frame — gridlines, axis
   labels, and a <title> on every datum so a tap or hover gives the exact
   figure the shape only approximates. */
function _chartFrame(data, unit, W, H, pad) {
  var maxVal = chartNiceMax(Math.max.apply(null, data.map(function(d) { return d.value; }).concat([0])));
  var chartW = W - pad.l - pad.r;
  var chartH = H - pad.t - pad.b;
  var svg = '';
  for (var g = 0; g <= 4; g++) {
    var gy = pad.t + (g / 4) * chartH;
    var gVal = maxVal - (g / 4) * maxVal;
    svg += '<line x1="' + pad.l + '" y1="' + gy + '" x2="' + (W - pad.r) + '" y2="' + gy + '" class="inv-svg-grid"/>';
    svg += '<text x="' + (pad.l - 4) + '" y="' + (gy + 3) + '" text-anchor="end" class="inv-svg-grid-label">' +
      escHtml(chartShort(gVal, unit)) + '</text>';
  }
  return { svg: svg, maxVal: maxVal, chartW: chartW, chartH: chartH };
}

function chartLine(data, opts) {
  opts = opts || {};
  var unit = opts.unit || 'money';
  if (!data || data.length === 0) return _chartEmpty(opts.emptyText || 'No data in this period');
  if (data.length < 2) return _chartEmpty('Need at least two points to show a trend');

  var W = 480, H = 220, pad = { l: 46, r: 12, t: 14, b: 30 };
  var f = _chartFrame(data, unit, W, H, pad);
  var points = data.map(function(d, i) {
    return {
      x: pad.l + (i / (data.length - 1)) * f.chartW,
      y: pad.t + f.chartH - (f.maxVal > 0 ? (d.value / f.maxVal) : 0) * f.chartH,
      d: d
    };
  });

  var line = points.map(function(p) { return p.x + ',' + p.y; }).join(' ');
  var area = 'M' + points[0].x + ',' + (pad.t + f.chartH) + ' L' + line.split(' ').join(' L') +
    ' L' + points[points.length - 1].x + ',' + (pad.t + f.chartH) + ' Z';

  // Aspect is preserved, so a circle is a circle at any width.
  var svg = '<svg class="inv-chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' +
    escHtml(opts.ariaLabel || 'Trend') + '">' + f.svg;
  svg += '<path d="' + area + '" class="inv-svg-area"/>';
  svg += '<polyline points="' + line + '" class="inv-svg-line"/>';

  var stride = _chartLabelStride(data.length, opts.maxLabels);
  points.forEach(function(p, i) {
    // Every point carries its value; the marker is what the pointer aims at.
    svg += '<circle cx="' + p.x + '" cy="' + p.y + '" r="3" class="inv-svg-dot">' +
      '<title>' + escHtml(p.d.label + ': ' + chartFull(p.d.value, unit)) + '</title></circle>';
    if (i % stride === 0 || i === points.length - 1) {
      svg += '<text x="' + p.x + '" y="' + (pad.t + f.chartH + 14) + '" text-anchor="middle" class="inv-svg-axis-label">' +
        escHtml(p.d.label) + '</text>';
    }
  });
  svg += '</svg>';
  return svg;
}

function chartBars(data, opts) {
  opts = opts || {};
  var unit = opts.unit || 'money';
  if (!data || data.length === 0) return _chartEmpty(opts.emptyText || 'No data in this period');

  var W = 480, H = 220, pad = { l: 46, r: 12, t: 14, b: 30 };
  var f = _chartFrame(data, unit, W, H, pad);
  var slot = f.chartW / data.length;
  var barW = Math.max(slot * 0.62, 1);

  var svg = '<svg class="inv-chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' +
    escHtml(opts.ariaLabel || 'Trend') + '">' + f.svg;

  var stride = _chartLabelStride(data.length, opts.maxLabels);
  data.forEach(function(d, i) {
    var h = f.maxVal > 0 ? (d.value / f.maxVal) * f.chartH : 0;
    var x = pad.l + i * slot + (slot - barW) / 2;
    var y = pad.t + f.chartH - h;
    svg += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + Math.max(h, 0) +
      '" rx="1.5" class="inv-chart-bar">' +
      '<title>' + escHtml(d.label + ': ' + chartFull(d.value, unit)) + '</title></rect>';
    if (i % stride === 0 || i === data.length - 1) {
      svg += '<text x="' + (x + barW / 2) + '" y="' + (pad.t + f.chartH + 14) +
        '" text-anchor="middle" class="inv-svg-axis-label">' + escHtml(d.label) + '</text>';
    }
  });
  svg += '</svg>';
  return svg;
}

/* ===== COMPOSITION =====
   slices: [{label, value, clientId?}]. Anything past the eighth is folded into
   one "Others" wedge rather than drawn as a sliver nobody can read or aim at —
   and the fold is named, so the chart never implies the tail does not exist. */
function chartPie(slices, opts) {
  opts = opts || {};
  var unit = opts.unit || 'money';
  var rows = (slices || []).filter(function(s) { return s.value > 0; })
    .sort(function(a, b) { return b.value - a.value; });
  if (rows.length === 0) return _chartEmpty(opts.emptyText || 'No data in this period');

  var shown = rows.slice(0, CHART_SERIES_MAX);
  var rest = rows.slice(CHART_SERIES_MAX);
  if (rest.length > 0) {
    shown.push({
      label: rest.length + ' others',
      value: rest.reduce(function(s, r) { return s + r.value; }, 0),
      _others: true
    });
  }
  var total = shown.reduce(function(s, r) { return s + r.value; }, 0);
  if (!(total > 0)) return _chartEmpty(opts.emptyText || 'No data in this period');

  var R = 100, CX = 105, CY = 105, inner = opts.donut === false ? 0 : 56;
  var svg = '<svg class="inv-chart-pie-svg" viewBox="0 0 210 210" role="img" aria-label="' +
    escHtml(opts.ariaLabel || 'Composition') + '">';

  var angle = -Math.PI / 2;
  shown.forEach(function(s, i) {
    var frac = s.value / total;
    var sweep = frac * Math.PI * 2;
    var end = angle + sweep;
    var cls = 'inv-chart-c' + (s._others ? 'x' : (i % CHART_SERIES_MAX));
    // A single slice covering everything cannot be drawn as an arc — the start
    // and end points coincide and the path collapses to nothing.
    if (frac >= 0.9999) {
      svg += '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" class="' + cls + '">' +
        '<title>' + escHtml(s.label + ': ' + chartFull(s.value, unit) + ' (100%)') + '</title></circle>';
    } else {
      var x1 = CX + R * Math.cos(angle), y1 = CY + R * Math.sin(angle);
      var x2 = CX + R * Math.cos(end), y2 = CY + R * Math.sin(end);
      var large = sweep > Math.PI ? 1 : 0;
      svg += '<path d="M' + CX + ',' + CY + ' L' + x1 + ',' + y1 +
        ' A' + R + ',' + R + ' 0 ' + large + ' 1 ' + x2 + ',' + y2 + ' Z" class="' + cls + '">' +
        '<title>' + escHtml(s.label + ': ' + chartFull(s.value, unit) +
          ' (' + formatNum(frac * 100, 1) + '%)') + '</title></path>';
    }
    angle = end;
  });
  if (inner > 0) svg += '<circle cx="' + CX + '" cy="' + CY + '" r="' + inner + '" class="inv-chart-hole"/>';
  svg += '</svg>';

  var legend = '<div class="inv-chart-legend">';
  shown.forEach(function(s, i) {
    var cls = 'inv-chart-c' + (s._others ? 'x' : (i % CHART_SERIES_MAX));
    var tap = (!s._others && s.clientId != null)
      ? ' data-action="invStatsClientDrill" data-client-id="' + escHtml(s.clientId) + '"' : '';
    legend += '<div class="inv-chart-legend-row"' + tap + '>' +
      '<span class="inv-chart-swatch ' + cls + '"></span>' +
      '<span class="inv-chart-legend-label">' + escHtml(s.label) + '</span>' +
      '<span class="inv-chart-legend-val inv-mono">' + escHtml(chartShort(s.value, unit)) + '</span>' +
      '<span class="inv-chart-legend-pct inv-mono">' + formatNum(s.value / total * 100, 1) + '%</span></div>';
  });
  legend += '</div>';

  return '<div class="inv-chart-pie-wrap">' + svg + legend + '</div>';
}

/* Horizontal ranked bars — the shape that suits "top N by X", where the labels
   are names rather than dates and reading them matters more than the profile. */
function chartRankedBars(rows, opts) {
  opts = opts || {};
  var unit = opts.unit || 'money';
  if (!rows || rows.length === 0) return _chartEmpty(opts.emptyText || 'No data in this period');
  var max = Math.max.apply(null, rows.map(function(r) { return r.value; }).concat([0]));

  var html = '<div class="inv-chart-ranked">';
  rows.forEach(function(r) {
    var pct = max > 0 ? Math.max((r.value / max) * 100, 0.5) : 0;
    var tap = r.action ? ' data-action="' + escHtml(r.action) + '" data-client-id="' + escHtml(r.clientId != null ? r.clientId : '') + '"' : '';
    html += '<div class="inv-chart-ranked-row"' + tap + '>' +
      '<div class="inv-chart-ranked-head">' +
      '<span class="inv-chart-ranked-label">' + escHtml(r.label) + '</span>' +
      '<span class="inv-chart-ranked-val inv-mono">' + escHtml(r.display || chartFull(r.value, unit)) + '</span></div>' +
      '<div class="inv-chart-ranked-track">' +
      '<svg class="inv-chart-ranked-svg" viewBox="0 0 100 8" preserveAspectRatio="none" aria-hidden="true">' +
      '<rect width="' + pct + '" height="8" rx="2" class="inv-chart-ranked-fill' +
      (r.tone ? ' inv-chart-ranked-fill-' + r.tone : '') + '"/>' +
      // A threshold line turns a bar chart of a narrow range into an answer.
      // Rates run 5.40 to 14.50 here: from a zero baseline every bar is
      // roughly half-length and the differences are invisible, but where each
      // one sits against cost is the entire question.
      (r.markPct != null ? '<rect x="' + Math.max(Math.min(r.markPct, 100), 0) +
        '" y="-1" width="0.6" height="10" class="inv-chart-ranked-mark"/>' : '') +
      '</svg></div>' +
      (r.sub ? '<div class="inv-chart-ranked-sub">' + escHtml(r.sub) + '</div>' : '') +
      '</div>';
  });
  html += '</div>';
  return html;
}
/* ===== STAFF & ATTENDANCE =====

   Labour is the largest line in this business — ₹3.55/kg of an ₹8.55 cost, 42%
   of it — and until now it was one number typed into Settings. This tab is what
   turns it into a measurement: who was on the floor, on which day, in which
   area, and for how many hours beyond the shift.

   Three views over the same store. Day is for entry, Week is for the shape of
   a week and for fixing what the day view got wrong, Roster is the master.

   The roster ships empty on purpose. Names and wages are payroll data and this
   repo is public; the structure (areas, comp classes, the wage arithmetic) is
   code, the people are not. */

var STAFF_AREAS = [
  { id: 'vat-a1',   label: 'VAT A1',   floor: true },
  { id: 'vat-a2',   label: 'VAT A2',   floor: true },
  { id: 'barrel',   label: 'Barrel',   floor: true },
  { id: 'pickling', label: 'Pickling', floor: true },
  { id: 'colour',   label: 'Colour',   floor: true },
  { id: 'flex',     label: 'Flex',     floor: true },
  { id: 'office',   label: 'Office',   floor: false },
  { id: 'gate',     label: 'Gate',     floor: false }
];

/* ===== COMP CLASSES =====

   Three, because the shop pays three different ways and a single "contract"
   class got two of them wrong.

   `monthly` is the salaried tier — but it is not a flat salary. It is
   `₹/day × days worked`, plus the month's rest days scaled by an attendance
   gate, plus overtime at `₹/day ÷ 8 × 1.1`. That is the ratified rule, and a
   flat monthly divided by calendar days (what the first cut of this module
   did) neither matches the payout slips nor moves when somebody is absent.

   `hourly` is the weekly pool, and it has **no day concept at all**: every
   hour is paid at one flat rate, the fourteenth as the first. Charging it a
   day rate and then paying overtime at ×1.1 — again, the first cut — invents
   a day boundary the slip does not have and overpays the overtime by a tenth.

   `daily` is the generic middle: days at a day rate, overtime at a multiplier.
   No SEP tier is on it today; it is kept because it is the shape most job-work
   contracts take, and because it is what the earlier `contract` class was. */
var COMP_CLASSES = [
  { id: 'monthly', label: 'Monthly', short: 'M', tone: 'perm',
    hint: 'day rate × days worked, rest days gated on attendance, OT at rate ÷ 8' },
  { id: 'hourly', label: 'Hourly', short: 'H', tone: 'cw',
    hint: 'every hour at one flat rate — no day rate, no overtime multiplier' },
  { id: 'daily', label: 'Daily', short: 'D', tone: 'cw',
    hint: 'day rate × days worked, OT hours at the multiplier' }
];

function compClass(id) {
  return COMP_CLASSES.find(function(c) { return c.id === id; }) || COMP_CLASSES[2];
}

/* The hourly pool is paid for hours, so hours are what its row captures. Every
   other tier counts days and captures overtime on top. */
function compIsHourly(w) { return w && w.comp === 'hourly'; }

/* Present / Half day / Absent. A worker with no mark on a recorded day is
   *unmarked*, which is a fourth state and not the same as absent: it is the
   state of a row nobody has reached yet, and it costs nothing rather than
   costing a day's wage. Absent has to be said.

   Half a day is meaningless for an hourly worker — the hours already carry that
   granularity — so their row offers Present and Absent only. */
var ATT_STATES = ['P', 'H', 'A'];
var ATT_STATE_LABELS = { P: 'Present', H: 'Half day', A: 'Absent' };
var ATT_DAY_VALUE = { P: 1, H: 0.5, A: 0 };

var _attView = 'day';
var _attDate = null;      // ISO date the Day view is showing
var _attWeekStart = null; // ISO Monday the Week view is showing

/* ===== DATE HELPERS =====
   All local-time. `new Date('2026-08-27')` parses as UTC and lands on the
   previous evening east of Greenwich, which would silently shift every week
   boundary by a day here. */
function attParseIso(iso) {
  var p = String(iso || '').split('-');
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
}

function attIso(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
    '-' + String(d.getDate()).padStart(2, '0');
}

function attAddDays(iso, n) {
  var d = attParseIso(iso);
  d.setDate(d.getDate() + n);
  return attIso(d);
}

/* Monday of the week containing iso. The plant runs Mon–Sat. */
function attWeekStartOf(iso) {
  var d = attParseIso(iso);
  var dow = d.getDay();            // 0 = Sunday
  var back = dow === 0 ? 6 : dow - 1;
  d.setDate(d.getDate() - back);
  return attIso(d);
}

/* ISO-8601 week number, so a week here is the same week soma-internal's
   attendance files are named after (`2026-W33.md`). */
function attWeekNumber(iso) {
  var d = attParseIso(iso);
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));
  var yearStart = new Date(d.getFullYear(), 0, 1);
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function attDayName(iso) {
  return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][attParseIso(iso).getDay()];
}

/* Mon–Sat of a week. Sunday is worked here only as overtime, and an OT Sunday
   is recorded on its own date through the Day view rather than being given a
   permanent column that is empty fifty weeks a year. */
function attWeekDays(weekStartIso) {
  var out = [];
  for (var i = 0; i < 6; i++) out.push(attAddDays(weekStartIso, i));
  return out;
}

/* Every ISO date from `from` to `to` inclusive. */
function attDatesInRange(fromIso, toIso) {
  var out = [], cur = fromIso;
  if (!fromIso || !toIso || fromIso > toIso) return out;
  var guard = 0;
  while (cur <= toIso && guard++ < 4000) { out.push(cur); cur = attAddDays(cur, 1); }
  return out;
}

/* ===== STORE ===== */
function attDay(iso, create) {
  if (!S.attendance) S.attendance = {};
  var rec = S.attendance[iso];
  if (!rec && create) {
    rec = { marks: {}, extra: [], note: '' };
    S.attendance[iso] = rec;
  }
  if (rec && !rec.marks) rec.marks = {};
  if (rec && !rec.extra) rec.extra = [];
  return rec || null;
}

function attMark(iso, staffId) {
  var rec = attDay(iso, false);
  if (!rec) return null;
  return rec.marks[staffId] || null;
}

function staffById(id) {
  return (S.staff || []).find(function(w) { return w.id === id; });
}

/* Active roster, leads and permanents first so the week grid reads the way the
   shop does — the four area leads are the rows an absence matters most on. */
function staffActive() {
  return (S.staff || []).filter(function(w) { return w.active !== false; }).sort(function(a, b) {
    if (a.comp !== b.comp) return a.comp === 'monthly' ? -1 : 1;
    return (a.name || '').localeCompare(b.name || '');
  });
}

function areaLabel(id) {
  var a = STAFF_AREAS.find(function(x) { return x.id === id; });
  return a ? a.label : (id || '—');
}

function attAreaOptions(sel) {
  return STAFF_AREAS.map(function(a) {
    return '<option value="' + a.id + '"' + (a.id === sel ? ' selected' : '') + '>' + escHtml(a.label) + '</option>';
  }).join('');
}

/* ===== FOCUS ACROSS RE-RENDER =====

   Every action here replaces `innerHTML`, and marking a day is a run of twenty
   taps down a list. Without this the focus ring lands back on the body after
   each one and a keyboard user restarts the tab order from the top — the same
   failure that ended the keyboard path mid-challan, in a place it would be hit
   twenty times a day rather than once.

   The controls already carry the attributes that identify them, so the selector
   is rebuilt from those rather than adding a parallel key. Values are ids,
   ISO dates and literal action names — nothing that needs escaping. */
var ATT_FOCUS_ATTRS = ['data-action', 'data-id', 'data-st', 'data-date', 'data-idx'];
var ATT_FOCUS_FLAGS = ['data-att-area', 'data-att-ot', 'data-att-extra-area', 'data-att-extra-hours'];

function _attFocusSelector() {
  var page = document.getElementById('pageStaff');
  var el = document.activeElement;
  if (!page || !el || el === document.body || !page.contains(el)) return null;
  if (el.id) return '#' + el.id;
  var parts = [];
  ATT_FOCUS_ATTRS.forEach(function(a) {
    if (el.getAttribute(a) != null) parts.push('[' + a + '="' + el.getAttribute(a) + '"]');
  });
  ATT_FOCUS_FLAGS.forEach(function(a) {
    if (el.getAttribute(a) != null) parts.push('[' + a + ']');
  });
  return parts.length ? parts.join('') : null;
}

function _attRestoreFocus(sel) {
  if (!sel) return;
  var page = document.getElementById('pageStaff');
  if (!page) return;
  var el;
  try { el = page.querySelector(sel); } catch (e) { return; }
  if (!el) return;
  try { el.focus({ preventScroll: true }); } catch (e) { try { el.focus(); } catch (e2) {} }
}

/* ===== TAB RENDER ===== */
function renderAttendance() {
  if (!_attDate) _attDate = localDateStr();
  if (!_attWeekStart) _attWeekStart = attWeekStartOf(_attDate);

  var focusSel = _attFocusSelector();

  var toolbar = document.getElementById('attToolbar');
  if (toolbar) {
    var views = [['day', 'Day'], ['week', 'Week'], ['roster', 'Roster']];
    toolbar.innerHTML = '<div class="inv-stats-chips">' + views.map(function(v) {
      return '<button class="inv-chip' + (_attView === v[0] ? ' inv-chip-active' : '') +
        '" data-action="invAttView" data-view="' + v[0] + '">' + v[1] + '</button>';
    }).join('') + '</div>';
  }

  var area = document.getElementById('attContent');
  if (!area) return;

  if ((S.staff || []).length === 0 && _attView !== 'roster') {
    area.innerHTML = _attEmptyRoster();
    _attRestoreFocus(focusSel);
    return;
  }

  if (_attView === 'roster') area.innerHTML = _attRosterView();
  else if (_attView === 'week') area.innerHTML = _attWeekView();
  else area.innerHTML = _attDayView();

  _attRestoreFocus(focusSel);
}

function _attEmptyRoster() {
  return '<div class="inv-card"><div class="inv-empty-state">' +
    '<svg class="inv-empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">' +
    '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>' +
    '<polyline points="17 11 19 13 23 9"/></svg>' +
    '<div class="inv-mt-16">No one on the roster yet</div>' +
    '<div class="inv-stats-note">Attendance and the labour breakdown both read the roster. ' +
    'Add each worker once with their comp class and rate; the wage arithmetic follows from there.</div>' +
    '<div class="inv-mt-16"><button class="inv-btn inv-btn-primary" data-action="invAttAddWorker">Add the first worker</button></div>' +
    '</div></div>';
}

/* ===== DAY VIEW ===== */
function _attDayView() {
  var iso = _attDate;
  var rec = attDay(iso, false);
  var roster = staffActive();
  var total = roster.length;

  var present = 0, half = 0, absent = 0, unmarked = 0, otHours = 0, poolHours = 0;
  roster.forEach(function(w) {
    var m = rec ? rec.marks[w.id] : null;
    if (!m) { unmarked++; return; }
    if (m.st === 'P') present++;
    else if (m.st === 'H') half++;
    else absent++;
    if (compIsHourly(w)) poolHours += (m.hours || 0);
    else otHours += (m.ot || 0);
  });
  var extraHours = rec ? rec.extra.reduce(function(s, x) { return s + (x.hours || 0); }, 0) : 0;
  var onSite = present + half;

  var html = '<div class="inv-att-nav">' +
    '<button class="inv-att-nav-btn" data-action="invAttStep" data-step="-1" aria-label="Previous day">' +
    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>' +
    '<div class="inv-att-nav-label"><input type="date" class="inv-form-input inv-mono inv-att-date" id="attDate" value="' + escHtml(iso) + '">' +
    '<span class="inv-att-nav-day">' + attDayName(iso) + '</span></div>' +
    '<button class="inv-att-nav-btn" data-action="invAttStep" data-step="1" aria-label="Next day">' +
    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>' +
    '<button class="inv-btn inv-btn-ghost inv-btn-sm" data-action="invAttToday">Today</button>' +
    '</div>';

  html += '<div class="inv-card inv-card-hero"><div class="inv-card-header">' +
    '<span class="inv-card-title">On site</span>' +
    '<button class="inv-btn inv-btn-ghost inv-btn-sm" data-action="invAttAllPresent">All present</button></div>' +
    '<div class="inv-att-count"><span class="inv-display inv-att-count-value">' + onSite + '</span>' +
    '<span class="inv-att-count-of">/ ' + total + '</span></div>' +
    '<div class="inv-att-summary">' +
    '<span class="inv-att-pill inv-att-pill-p">' + present + ' present</span>' +
    '<span class="inv-att-pill inv-att-pill-h">' + half + ' half</span>' +
    '<span class="inv-att-pill inv-att-pill-a">' + absent + ' absent</span>' +
    (unmarked > 0 ? '<span class="inv-att-pill inv-att-pill-u">' + unmarked + ' unmarked</span>' : '') +
    '</div>' +
    (poolHours > 0 || otHours > 0 || extraHours > 0
      ? '<div class="inv-att-summary">' +
        (poolHours > 0 ? '<span class="inv-att-pill inv-att-pill-hr">' + formatNum(poolHours, 1) + ' h pool</span>' : '') +
        (otHours > 0 ? '<span class="inv-att-pill inv-att-pill-ot">' + formatNum(otHours, 1) + ' h OT named</span>' : '') +
        (extraHours > 0 ? '<span class="inv-att-pill inv-att-pill-x">' + formatNum(extraHours, 1) + ' h extra</span>' : '') +
        '</div>'
      : '') +
    '</div>';

  // The rows. One line per worker: who, where, what state, and OT hours.
  html += '<div class="inv-card"><div class="inv-card-header"><span class="inv-card-title">Mark the day</span></div>';
  roster.forEach(function(w) {
    var m = rec ? rec.marks[w.id] : null;
    var st = m ? m.st : '';
    var wArea = m && m.area ? m.area : (w.area || 'flex');
    var cls = compClass(w.comp);
    var hourly = compIsHourly(w);
    // Half a day is not a state an hourly worker can be in: the hours say it.
    var states = hourly ? ['P', 'A'] : ATT_STATES;
    var live = st && st !== 'A';
    html += '<div class="inv-att-row">' +
      '<div class="inv-att-who"><span class="inv-att-name">' + escHtml(w.name) + '</span>' +
      '<span class="inv-att-badge inv-att-badge-' + cls.tone + '">' + escHtml(cls.label) + '</span></div>' +
      '<div class="inv-att-controls">' +
      '<div class="inv-att-seg" role="group" aria-label="Attendance for ' + escHtml(w.name) + '">' +
      states.map(function(x) {
        return '<button class="inv-att-seg-btn inv-att-seg-' + x.toLowerCase() +
          (st === x ? ' inv-att-seg-on' : '') + '" data-action="invAttSet" data-id="' + w.id +
          '" data-st="' + x + '" aria-pressed="' + (st === x) + '" title="' + ATT_STATE_LABELS[x] + '">' + x + '</button>';
      }).join('') +
      '</div>' +
      '<select class="inv-form-select inv-att-area" data-att-area data-id="' + w.id + '" aria-label="Area for ' + escHtml(w.name) + '"' +
      (live ? '' : ' disabled') + '>' + attAreaOptions(wArea) + '</select>' +
      // Deliberately not inv-mono: in the mono face the placeholders "OT" and
      // "h" sit in a field whose whole content is otherwise numbers, and the
      // mono O is indistinguishable from a zero.
      (hourly
        ? '<input type="number" class="inv-form-input inv-att-ot" data-att-hours data-id="' + w.id +
          '" step="0.5" min="0" placeholder="hrs" value="' + (m && m.hours ? m.hours : '') + '"' +
          (live ? '' : ' disabled') + ' aria-label="Hours worked by ' + escHtml(w.name) + '">'
        : '<input type="number" class="inv-form-input inv-att-ot" data-att-ot data-id="' + w.id +
          '" step="0.5" min="0" placeholder="OT" value="' + (m && m.ot ? m.ot : '') + '"' +
          (live ? '' : ' disabled') + ' aria-label="OT hours for ' + escHtml(w.name) + '">') +
      '</div></div>';
  });
  html += '</div>';

  html += _attExtraCard(iso, rec);
  html += renderLabourCard(iso, iso, 'Day cost');
  return html;
}

/* ===== EXTRA HOURS =====
   What "the extra" is, and why it has no name against it.

   Shyam's daily relay books hours in two different ways. Named men carry their
   own out-time, and those hours are OT on the row above. But every day also
   carries lines like `EXTRA 16 HOURS` written against an *area block* — the
   barrel line, the 6 AM VAT slot — with no person attached. They are real paid
   hours at the contract tier, and the payout sheet settles them.

   So they are recorded as what they are: hours booked to an area, unattributed.
   Spreading them across the men present would produce a per-worker cost that
   reads precise and is invented, and the one question this tab exists to answer
   is which labour is fixed and which scales — a question that spreading would
   silently answer for us. The labour card counts them in the bill and reports
   them separately as unattributed. */
function _attExtraCard(iso, rec) {
  var rows = rec ? rec.extra : [];
  var html = '<div class="inv-card"><div class="inv-card-header">' +
    '<span class="inv-card-title">Extra hours</span>' +
    '<button class="inv-btn inv-btn-ghost inv-btn-sm" data-action="invAttAddExtra">Add</button></div>' +
    '<div class="inv-stats-note">Hours booked to an area block rather than to a named worker &mdash; ' +
    'the <span class="inv-mono">EXTRA n HOURS</span> lines on the daily sheet. Priced at the contract tier ' +
    '(' + formatCurrency((S.labour && S.labour.extraRate) || 0) + '/h) and counted in the bill, but never ' +
    'spread across the men present: they are paid hours nobody is named for, and the labour card says so.</div>';
  if (rows.length === 0) {
    html += '<div class="inv-empty-state inv-empty-state-sm">None booked for this day</div>';
  } else {
    rows.forEach(function(x, i) {
      html += '<div class="inv-att-extra-row">' +
        '<select class="inv-form-select" data-att-extra-area data-idx="' + i + '" aria-label="Area for extra hours">' +
        attAreaOptions(x.area) + '</select>' +
        '<input type="number" class="inv-form-input inv-mono" data-att-extra-hours data-idx="' + i +
        '" step="0.5" min="0" value="' + (x.hours || 0) + '" aria-label="Extra hours">' +
        '<button class="inv-att-extra-del" data-action="invAttRemoveExtra" data-idx="' + i + '" aria-label="Remove">&times;</button>' +
        '</div>';
    });
  }
  return html + '</div>';
}

/* ===== WEEK VIEW ===== */
function _attWeekView() {
  var days = attWeekDays(_attWeekStart);
  var roster = staffActive();
  var last = days[days.length - 1];

  var html = '<div class="inv-att-nav">' +
    '<button class="inv-att-nav-btn" data-action="invAttWeekStep" data-step="-1" aria-label="Previous week">' +
    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>' +
    '<div class="inv-att-nav-label"><span class="inv-att-week-num">Week ' + attWeekNumber(_attWeekStart) + '</span>' +
    '<span class="inv-att-nav-day">' + formatDate(_attWeekStart) + ' &ndash; ' + formatDate(last) + '</span></div>' +
    '<button class="inv-att-nav-btn" data-action="invAttWeekStep" data-step="1" aria-label="Next week">' +
    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>' +
    '<button class="inv-btn inv-btn-ghost inv-btn-sm" data-action="invAttThisWeek">This week</button>' +
    '</div>';

  html += '<div class="inv-card"><div class="inv-card-header"><span class="inv-card-title">Week grid</span></div>' +
    '<div class="inv-stats-note">Tap a cell to cycle it: present, half day, absent, then back to unmarked. ' +
    'An unmarked cell is a day nobody typed &mdash; which is not the same fact as a day nobody worked, ' +
    'and the labour figures below keep the two apart.</div>' +
    '<div class="inv-att-grid-wrap"><table class="inv-att-grid">' +
    '<thead><tr><th class="inv-att-grid-name">Worker</th>' +
    days.map(function(d) {
      return '<th class="inv-att-grid-day' + (d === localDateStr() ? ' inv-att-grid-today' : '') + '">' +
        attDayName(d) + '<span class="inv-att-grid-date">' + attParseIso(d).getDate() + '</span></th>';
    }).join('') + '</tr></thead><tbody>';

  roster.forEach(function(w) {
    var cls = compClass(w.comp);
    var hourly = compIsHourly(w);
    html += '<tr><th class="inv-att-grid-name"><span class="inv-att-grid-worker">' + escHtml(w.name) + '</span>' +
      '<span class="inv-att-grid-comp inv-att-badge-' + cls.tone + '" title="' + escHtml(cls.label) + '">' +
      cls.short + '</span></th>';
    days.forEach(function(d) {
      var m = attMark(d, w.id);
      var st = m ? m.st : '';
      // The corner figure is the hours that decide this worker's pay: the whole
      // day for the hourly pool, the overtime on top for everyone else.
      var badge = m ? (hourly ? (m.hours || 0) : (m.ot || 0)) : 0;
      html += '<td class="inv-att-grid-cell"><button class="inv-att-cell inv-att-cell-' +
        (st ? st.toLowerCase() : 'u') + '" data-action="invAttCycle" data-id="' + w.id + '" data-date="' + d +
        '" aria-label="' + escHtml(w.name) + ' ' + attDayName(d) + ' ' + (st ? ATT_STATE_LABELS[st] : 'unmarked') +
        (badge ? ', ' + formatNum(badge, 1) + ' hours' : '') + '">' +
        (st || '·') + (badge ? '<span class="inv-att-cell-ot">' + formatNum(badge, 0) + '</span>' : '') +
        '</button></td>';
    });
    html += '</tr>';
  });

  html += '</tbody><tfoot><tr><th class="inv-att-grid-name">On site</th>' +
    days.map(function(d) {
      var rec = attDay(d, false);
      if (!rec) return '<td class="inv-att-grid-cell inv-att-grid-foot">&mdash;</td>';
      var n = 0;
      roster.forEach(function(w) {
        var m = rec.marks[w.id];
        if (m && (m.st === 'P' || m.st === 'H')) n++;
      });
      return '<td class="inv-att-grid-cell inv-att-grid-foot">' + n + '<span class="inv-att-grid-of">/' + roster.length + '</span></td>';
    }).join('') + '</tr></tfoot></table></div></div>';

  html += renderLabourCard(_attWeekStart, attAddDays(_attWeekStart, 6), 'Week cost');
  return html;
}

/* ===== ROSTER VIEW ===== */
function _attRosterView() {
  var all = (S.staff || []).slice().sort(function(a, b) {
    if ((a.active !== false) !== (b.active !== false)) return a.active !== false ? -1 : 1;
    if (a.comp !== b.comp) return a.comp === 'permanent' ? -1 : 1;
    return (a.name || '').localeCompare(b.name || '');
  });
  var activeCount = all.filter(function(w) { return w.active !== false; }).length;

  var html = '<div class="inv-card"><div class="inv-card-header">' +
    '<span class="inv-card-title">Roster</span>' +
    '<span class="inv-att-roster-actions">' +
    '<button class="inv-btn inv-btn-ghost inv-btn-sm" data-action="invAttImportRoster">Import</button>' +
    '<button class="inv-btn inv-btn-ghost inv-btn-sm" data-action="invAttAddWorker">Add worker</button></span></div>' +
    '<div class="inv-stats-note">' + activeCount + ' active of ' + all.length + ' on file. ' +
    'The denominator on every headcount above is this number.</div>';

  if (all.length === 0) {
    html += '<div class="inv-empty-state inv-empty-state-sm">Nobody on file yet</div></div>';
    return html;
  }

  all.forEach(function(w) {
    var cls = compClass(w.comp);
    html += '<div class="inv-client-item' + (w.active === false ? ' inv-client-inactive' : '') +
      '" data-action="invAttEditWorker" data-id="' + w.id + '">' +
      '<div class="inv-client-content"><div class="inv-client-name">' + escHtml(w.name) + '</div>' +
      '<div class="inv-client-meta inv-mono">' + escHtml(workerRateLabel(w)) + '</div>' +
      '<div class="inv-client-badges">' +
      '<span class="inv-att-badge inv-att-badge-' + cls.tone + '">' + escHtml(cls.label) + '</span>' +
      '<span class="inv-client-badge inv-badge-mode">' + escHtml(areaLabel(w.area)) + '</span>' +
      (w.onFloor === false ? '<span class="inv-client-badge inv-badge-rate">Off floor</span>' : '') +
      (w.active === false ? '<span class="inv-client-badge inv-badge-inactive">Inactive</span>' : '') +
      '</div></div>' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>';
  });
  return html + '</div>';
}

/* The hourly rate a worker's overtime is paid at.

   For the monthly tier it is derived — `₹/day ÷ 8` — which is what makes the
   rate card's own OT column fall out of the day rate rather than being a second
   number to keep in step with it. An explicit `hourRate` still overrides, for a
   worker whose overtime was negotiated apart from their day. */
function workerOtRate(w) {
  if (!w) return 0;
  if (w.hourRate > 0) return w.hourRate;
  if (w.comp === 'monthly') return (w.dayRate || 0) / 8;
  return 0;
}

function workerRateLabel(w) {
  var cls = compClass(w.comp);
  if (cls.id === 'hourly') return formatCurrency(w.hourRate || 0) + '/h, every hour';
  var ot = workerOtRate(w);
  return formatCurrency(w.dayRate || 0) + '/day · OT ' + formatCurrency(ot) + '/h' +
    (cls.id === 'monthly' && !(w.hourRate > 0) ? ' (derived)' : '');
}

/* ===== ACTIONS ===== */
function attSetView(view) {
  _attView = view;
  renderAttendance();
}

function attStepDay(n) {
  _attDate = attAddDays(_attDate || localDateStr(), n);
  renderAttendance();
}

function attGoToday() {
  _attDate = localDateStr();
  _attWeekStart = attWeekStartOf(_attDate);
  renderAttendance();
}

function attStepWeek(n) {
  _attWeekStart = attAddDays(_attWeekStart || attWeekStartOf(localDateStr()), n * 7);
  renderAttendance();
}

function attThisWeek() {
  _attWeekStart = attWeekStartOf(localDateStr());
  renderAttendance();
}

function attSetDate(iso) {
  if (!iso) return;
  _attDate = iso;
  _attWeekStart = attWeekStartOf(iso);
  renderAttendance();
}

/* Writes one mark. `st` of '' clears the row back to unmarked, and a cleared
   row takes its OT with it — hours nobody was present for are not hours. */
function attSetState(iso, staffId, st) {
  var w = staffById(staffId);
  if (!w) return;
  var rec = attDay(iso, true);
  if (!st) {
    delete rec.marks[staffId];
  } else {
    var m = rec.marks[staffId] || { ot: 0, hours: 0, area: w.area || 'flex' };
    m.st = st;
    // Absent pays nothing and worked nothing: hours that nobody was here for
    // are not hours, in either tier.
    if (st === 'A') { m.ot = 0; m.hours = 0; }
    rec.marks[staffId] = m;
  }
  _attPrune(iso);
  saveState();
}

function setAttState(staffId, st) {
  var cur = attMark(_attDate, staffId);
  attSetState(_attDate, staffId, (cur && cur.st === st) ? '' : st);
  renderAttendance();
}

/* Week grid cycle: unmarked → P → H → A → unmarked. */
function cycleAttState(staffId, iso) {
  var cur = attMark(iso, staffId);
  // No half day in the hourly cycle — the hours field carries that granularity,
  // and a state the pay model cannot price should not be reachable by tapping.
  var order = compIsHourly(staffById(staffId)) ? ['', 'P', 'A'] : ['', 'P', 'H', 'A'];
  var idx = order.indexOf(cur ? cur.st : '');
  attSetState(iso, staffId, order[(idx + 1) % order.length]);
  renderAttendance();
}

function setAttOt(staffId, hours) {
  var m = attMark(_attDate, staffId);
  if (!m) return;                       // OT without a presence mark is not a fact
  m.ot = Math.max(0, Number(hours) || 0);
  saveState();
}

/* Hours worked, for the hourly pool. Same guard as OT: hours without a
   presence mark are not a fact about the day. */
function setAttHours(staffId, hours) {
  var m = attMark(_attDate, staffId);
  if (!m) return;
  m.hours = Math.max(0, Number(hours) || 0);
  saveState();
}

function setAttArea(staffId, areaId) {
  var m = attMark(_attDate, staffId);
  if (!m) return;
  m.area = areaId;
  saveState();
}

/* Marks every unmarked worker present. It never overwrites a mark already
   made — the absences are the part that was typed deliberately. */
function attAllPresent() {
  var rec = attDay(_attDate, true);
  var n = 0;
  staffActive().forEach(function(w) {
    if (!rec.marks[w.id]) {
      rec.marks[w.id] = { st: 'P', ot: 0, hours: 0, area: w.area || 'flex' };
      n++;
    }
  });
  _attPrune(_attDate);
  saveState();
  renderAttendance();
  showToast(n === 0 ? 'Every worker already marked' : n + ' marked present');
}

function attAddExtra() {
  var rec = attDay(_attDate, true);
  rec.extra.push({ area: 'barrel', hours: 0 });
  saveState();
  renderAttendance();
}

function attRemoveExtra(idx) {
  var rec = attDay(_attDate, false);
  if (!rec) return;
  rec.extra.splice(idx, 1);
  _attPrune(_attDate);
  saveState();
  renderAttendance();
}

function setAttExtraArea(idx, areaId) {
  var rec = attDay(_attDate, false);
  if (!rec || !rec.extra[idx]) return;
  rec.extra[idx].area = areaId;
  saveState();
}

function setAttExtraHours(idx, hours) {
  var rec = attDay(_attDate, false);
  if (!rec || !rec.extra[idx]) return;
  rec.extra[idx].hours = Math.max(0, Number(hours) || 0);
  saveState();
}

/* A day emptied of every mark is deleted rather than left as `{}`. The presence
   of a key is what "this day was recorded" means to the coverage figure, and an
   empty husk would claim a recording that never happened. */
function _attPrune(iso) {
  var rec = S.attendance[iso];
  if (!rec) return;
  if (Object.keys(rec.marks).length === 0 && rec.extra.length === 0 && !rec.note) {
    delete S.attendance[iso];
  }
}

/* ===== ROSTER CRUD ===== */
function _blankWorker() {
  return {
    id: 0, name: '', comp: 'hourly', dayRate: 0,
    hourRate: (S.labour && S.labour.extraRate) || 0,
    area: 'flex', onFloor: true, active: true, note: ''
  };
}

function openWorkerAdd() { _showWorkerOverlay(null, true); }

function openWorkerEdit(id) {
  var w = staffById(id);
  if (!w) return;
  _showWorkerOverlay(w, false);
}

function _showWorkerOverlay(worker, isAdd) {
  var w = worker || _blankWorker();
  var marks = worker ? _attMarkCount(w.id) : 0;
  var scrim = document.createElement('div');

    '<div class="inv-form-group"><label class="inv-form-label" for="wedName">Name</label>' +

    '<div class="inv-form-row"><div class="inv-form-group"><label class="inv-form-label" for="wedComp">Comp class</label>' +
    '<select class="inv-form-select" id="wedComp">' +
    COMP_CLASSES.map(function(c) {
      return '<option value="' + c.id + '"' + (w.comp === c.id ? ' selected' : '') + '>' + escHtml(c.label) + '</option>';
    }).join('') + '</select></div>' +
    '<div class="inv-form-group"><label class="inv-form-label" for="wedArea">Area</label>' +
    '<select class="inv-form-select" id="wedArea">' + attAreaOptions(w.area) + '</select></div></div>' +
    '<div class="inv-stats-note">' + COMP_CLASSES.map(function(c) {
      return '<strong>' + escHtml(c.label) + '</strong> &mdash; ' + escHtml(c.hint) + '.';
    }).join(' ') + '</div>' +
    '<div class="inv-form-row"><div class="inv-form-group"><label class="inv-form-label" for="wedDay">Day rate</label>' +
    '<input class="inv-form-input inv-mono" id="wedDay" type="number" step="0.01" min="0" value="' + (w.dayRate || 0) + '"></div>' +
    '<div class="inv-form-group"><label class="inv-form-label" for="wedHour">Hour rate</label>' +

    '<div class="inv-stats-note">The hourly tier uses the hour rate alone. The monthly and daily tiers use the day ' +
    'rate; leave their hour rate at zero and a monthly worker&rsquo;s overtime derives as <span class="inv-mono">day rate ÷ 8</span>, ' +
    'which is how the rate card&rsquo;s own OT column is built. Wages are counted only for days actually recorded, ' +
    'which is why the labour card states its coverage.</div>' +
    '<div class="inv-flex-between inv-mb-8"><label class="inv-checkbox-label">' +
    '<input type="checkbox" id="wedFloor"' + (w.onFloor !== false ? ' checked' : '') + '> On the plant floor</label></div>' +
    '<div class="inv-stats-note">Clear this for the gate and the office. Their wage is still labour and still in the ' +
    'bill; it is simply not plating cost, and the breakdown splits it out.</div>' +
    '<div class="inv-flex-between inv-mb-16"><label class="inv-checkbox-label">' +
    '<input type="checkbox" id="wedActive"' + (w.active !== false ? ' checked' : '') + '> Active</label></div>' +
    (isAdd ? '' : '<button class="inv-btn inv-btn-danger inv-btn-sm inv-mb-16" data-action="invAttDeleteWorker" data-id="' + w.id + '">Delete worker' +
      (marks > 0 ? ' (' + marks + ' day' + (marks === 1 ? '' : 's') + ' recorded)' : '') + '</button>') +
    '<div class="inv-btn-bar"><button class="inv-btn inv-btn-ghost" data-action="invCloseOverlay">Cancel</button>' +
    '<button class="inv-btn inv-btn-primary" data-action="invAttSaveWorker" data-id="' + w.id +
    '" data-mode="' + (isAdd ? 'add' : 'edit') + '">' + (isAdd ? 'Add Worker' : 'Save') + '</button></div></div>';
  scrim.addEventListener('click', function(e) {
    if (e.target === scrim) { scrim.remove(); document.body.style.overflow = ''; popFocus(); }
  });
  pushFocus();
  document.body.appendChild(scrim);

function _attMarkCount(staffId) {
  var n = 0;
  Object.keys(S.attendance || {}).forEach(function(iso) {
    var rec = S.attendance[iso];
    if (rec && rec.marks && rec.marks[staffId]) n++;
  });
  return n;
}

function saveWorker(id, mode) {
  var name = document.getElementById('wedName').value.trim();
  if (!name) { showToast('Worker name is required', 'error'); return; }
  var comp = document.getElementById('wedComp').value;
  var dup = (S.staff || []).find(function(x) {
    return x.id !== id && (x.name || '').trim().toLowerCase() === name.toLowerCase();
  });
  if (dup) { showToast('Already on the roster: ' + dup.name, 'error'); return; }

  var fields = {
    name: name,
    comp: comp,
    dayRate: Math.max(0, parseFloat(document.getElementById('wedDay').value) || 0),
    hourRate: Math.max(0, parseFloat(document.getElementById('wedHour').value) || 0),
    area: document.getElementById('wedArea').value,
    onFloor: document.getElementById('wedFloor').checked,
    active: document.getElementById('wedActive').checked
  };

  // A rate of zero is not refused — a worker can be on the roster before the
  // rate is settled — but the labour card would then be quietly short, so it
  // is said once here rather than discovered as a low ₹/kg later. Which rate
  // has to be present depends on the tier: the hourly pool has no day rate at
  // all, and refusing one for want of it would be a rule about the wrong number.
  var rateMissing = comp === 'hourly' ? fields.hourRate <= 0 : fields.dayRate <= 0;

  if (mode === 'add') {
    var nextId = (S.staff || []).reduce(function(m, x) { return Math.max(m, x.id || 0); }, 0) + 1;
    fields.id = nextId;
    fields.note = '';
    S.staff.push(fields);
  } else {
    var w = staffById(id);
    if (!w) return;
    Object.keys(fields).forEach(function(k) { w[k] = fields[k]; });
  }
  saveState();
  closeOverlay();
  renderAttendance();
  showToast(rateMissing
    ? name + ' saved without a rate — labour cost will read short until it is set'
    : (mode === 'add' ? name + ' added' : name + ' saved'),
    rateMissing ? 'warning' : 'success');
}

/* ===== ROSTER IMPORT =====

   Settings → Import replaces the whole state, which is the right behaviour for
   a backup and the wrong one for a roster: loading a payroll file through it
   would take every invoice with it. So the roster gets its own door.

   It **merges by name** and never touches anything else on `S`. A name already
   on the roster has its rates and area updated in place, which keeps the
   worker's id — and therefore every attendance mark already recorded against
   them — intact. That is the whole reason the merge key is the name rather
   than the id: two devices that typed the same person will have given them
   different ids, and matching on id would silently duplicate the roster.

   Payroll is deliberately not seeded into this repo, which is public and whose
   built page is served to anyone. This is the path that keeps it off both. */
function importRoster() {
  var inp = document.getElementById('rosterFileInput');
  if (!inp) return;
  inp.onchange = function(e) {
    var f = e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      var data;
      try { data = JSON.parse(ev.target.result); }
      catch (err) { showToast('Not valid JSON: ' + err.message, 'error'); return; }
      var res = applyRosterImport(data);
      if (res.error) { showToast(res.error, 'error'); return; }
      saveState();
      renderAttendance();
      showToast(res.added + ' added, ' + res.updated + ' updated' +
        (res.skipped ? ', ' + res.skipped + ' skipped' : ''));
    };
    reader.readAsText(f);
    inp.value = '';
  };
  inp.click();
}

/* The merge itself, split out so it can be tested without a file picker. */
function applyRosterImport(data) {
  var rows = data && Array.isArray(data.staff) ? data.staff
    : (Array.isArray(data) ? data : null);
  if (!rows) return { error: 'No staff array in that file' };

  var added = 0, updated = 0, skipped = 0;
  if (!S.staff) S.staff = [];
  var nextId = S.staff.reduce(function(m, x) { return Math.max(m, x.id || 0); }, 0);

  rows.forEach(function(row) {
    var name = String((row && row.name) || '').trim();
    if (!name) { skipped++; return; }
    var comp = compClass(row.comp).id;
    var fields = {
      comp: comp,
      dayRate: Math.max(0, Number(row.dayRate) || 0),
      hourRate: Math.max(0, Number(row.hourRate) || 0),
      area: STAFF_AREAS.some(function(a) { return a.id === row.area; }) ? row.area : 'flex',
      onFloor: row.onFloor !== false,
      active: row.active !== false
    };
    var existing = S.staff.find(function(x) {
      return (x.name || '').trim().toLowerCase() === name.toLowerCase();
    });
    if (existing) {
      Object.keys(fields).forEach(function(k) { existing[k] = fields[k]; });
      existing.name = name;
      updated++;
    } else {
      fields.id = ++nextId;
      fields.name = name;
      fields.note = '';
      S.staff.push(fields);
      added++;
    }
  });

  // The labour config may travel with the roster — the rates and the rules that
  // price them were settled together and drift apart if they arrive separately.
  if (data && data.labour && typeof data.labour === 'object') {
    if (!S.labour) S.labour = {};
    ['otMult', 'restCreditMinDays', 'extraRate', 'modelPerKg', 'gateFull', 'gateHalf'].forEach(function(k) {
      var v = Number(data.labour[k]);
      if (data.labour[k] != null && !isNaN(v) && v >= 0) S.labour[k] = v;
    });
  }
  return { added: added, updated: updated, skipped: skipped };
}

/* Deletion is refused while attendance names the worker. Removing the row would
   not remove the marks, it would orphan them: every past week's labour would
   silently drop that person's wage and no figure would say why. Deactivating
   keeps the history intact and takes them out of today's denominator, which is
   what "left" actually means here. */
function deleteWorker(id) {
  var w = staffById(id);
  if (!w) return;
  var marks = _attMarkCount(id);
  if (marks > 0) {
    showToast('Cannot delete: ' + w.name + ' is on ' + marks + ' recorded day' +
      (marks === 1 ? '' : 's') + '. Clear Active instead.', 'error');
    return;
  }
  if (!confirm('Delete ' + w.name + ' from the roster?')) return;
  S.staff = S.staff.filter(function(x) { return x.id !== id; });
  saveState();
  closeOverlay();
  renderAttendance();
  showToast(w.name + ' removed');
}
/* ===== LABOUR COST =====

   Labour was one number: ₹3.55/kg, 42% of an ₹8.55 cost, entered by hand and
   never checked against anything. Two questions were left open by the last
   two handoffs — how staff is allocated, and what "the extra" stands for —
   and both are the same question in different clothes: which of this bill is
   fixed and which of it scales with tonnage. Nothing could answer it because
   nothing measured it.

   This does the arithmetic from the attendance store:

     permanent   monthly salary, accrued by calendar day. Fixed. It is owed
                 whether or not anyone typed the day, so it is prorated across
                 the period rather than counted per recorded day.
     contract    days worked × day rate, half a day counting half. Variable.
     rest credit one further paid day for a contract worker whose week is full
                 — the ratified rule, gated rather than automatic.
     OT          named overtime hours × hour rate × multiplier (1.1).
     extra       area-booked hours nobody is named for, at the contract tier.

   Two figures are then kept apart everywhere they appear. **Fixed** is the
   permanent payroll: it does not move when tonnage moves, which is exactly why
   the SSS Mehta question turns on it — at fixed labour that account still
   contributes ₹0.53/kg, at volume-scaling labour it loses ₹1.64/kg. **Variable**
   is contract, OT and extra together. Reporting one labour number would answer
   that question by accident, in whichever direction the blend happened to fall.

   And what is not known is never averaged away. A day nobody typed is not a day
   nobody worked; permanent salary still accrues over it and contract wages do
   not, so a period recorded in part reads *low*, never neutral. The card states
   its coverage and withholds ₹/kg below 90% rather than printing a figure that
   flatters the plant. */

function labourCfg() {
  var c = S.labour || {};
  return {
    otMult: c.otMult != null ? c.otMult : 1.1,
    restCreditMinDays: c.restCreditMinDays != null ? c.restCreditMinDays : 6,
    extraRate: c.extraRate || 0,
    modelPerKg: c.modelPerKg || 0,
    gateFull: c.gateFull != null ? c.gateFull : 0.9,
    gateHalf: c.gateHalf != null ? c.gateHalf : 0.8
  };
}

/* The three-layer rest-day gate on the monthly tier.

   Rest days are paid, but the entitlement is scaled by attendance: at or above
   the full threshold the whole of it, above the half threshold half of it, and
   below that none. It is the one place a monthly worker's pay moves with their
   own attendance, which is why the tier is called monthly and not fixed.

   Exact over a calendar month, which is the period it was written for. Over a
   shorter range it is an approximation of a monthly rule and the card says so —
   a week with one Sunday gets that Sunday judged on that week's attendance. */
function restGate(attendance, cfg) {
  if (attendance >= cfg.gateFull) return 1;
  if (attendance >= cfg.gateHalf) return 0.5;
  return 0;
}

/* Is this area on the plant floor? An unknown area is treated as floor: the
   plating cost reading slightly high is the safe direction of an unknown. */
function _areaIsFloor(areaId) {
  var a = STAFF_AREAS.find(function(x) { return x.id === areaId; });
  return a ? a.floor : true;
}

/* The whole model, over an inclusive ISO date range. Pure: reads S, writes
   nothing, and every figure it returns is traceable to a recorded mark. */
function labourForRange(fromIso, toIso) {
  var cfg = labourCfg();
  var dates = attDatesInRange(fromIso, toIso);
  var roster = (S.staff || []).filter(function(w) { return w.active !== false; });

  var out = {
    from: fromIso, to: toIso, rangeDays: dates.length,
    monthlyDays: 0, monthlyDaysWorked: 0,
    rest: 0, restDaysCredited: 0, restDaysInRange: 0,
    pool: 0, poolHours: 0,
    daily: 0, dailyDays: 0, dailyRest: 0,
    ot: 0, otHours: 0, extra: 0, extraHours: 0,
    floorCost: 0,
    daysRecorded: 0, workingDays: 0, sundaysRecorded: 0,
    rosterSize: roster.length, ratelessWorkers: [], byArea: {}
  };

  // Variable labour, by the area it was worked in. The monthly tier's day pay
  // is deliberately absent: see _labAreaRows.
  function bumpArea(areaId, cost, days, hours) {
    var a = out.byArea[areaId] || (out.byArea[areaId] = { cost: 0, days: 0, hours: 0 });
    a.cost += cost; a.days += days; a.hours += hours;
  }
  function bumpFloor(w, areaId, cost) {
    if (w.onFloor !== false && _areaIsFloor(areaId)) out.floorCost += cost;
  }

  // Per-worker tallies, because both gates below are judged over the range
  // rather than per day: the monthly tier's rest credit needs the attendance
  // percentage, the daily tier's needs a week's day count.
  var monthlyDaysBy = {};
  var weekDaysWorked = {};

  dates.forEach(function(iso) {
    var dow = attParseIso(iso).getDay();
    if (dow === 0) out.restDaysInRange++; else out.workingDays++;

    var rec = (S.attendance || {})[iso];
    if (!rec) return;
    var marks = rec.marks || {};
    var marked = Object.keys(marks).length;
    if (marked === 0 && (rec.extra || []).length === 0) return;
    if (marked > 0) {
      if (dow === 0) out.sundaysRecorded++; else out.daysRecorded++;
    }

    var wk = attWeekStartOf(iso);
    roster.forEach(function(w) {
      var m = marks[w.id];
      if (!m || !m.st) return;
      var dayVal = ATT_DAY_VALUE[m.st] || 0;
      var areaId = m.area || w.area || 'flex';

      if (w.comp === 'hourly') {
        // No day rate exists for this tier and no multiplier applies: the
        // fourteenth hour is paid exactly like the first.
        var hrs = m.hours || 0;
        if (hrs > 0) {
          var pay = hrs * (w.hourRate || 0);
          out.pool += pay;
          out.poolHours += hrs;
          bumpArea(areaId, pay, 0, hrs);
          bumpFloor(w, areaId, pay);
          if (!(w.hourRate > 0) && out.ratelessWorkers.indexOf(w.name) < 0) out.ratelessWorkers.push(w.name);
        }
        return;
      }

      // Monthly and daily both pay by the day; only the rest-day rule differs.
      var wage = dayVal * (w.dayRate || 0);
      if (w.comp === 'monthly') {
        out.monthlyDays += wage;
        out.monthlyDaysWorked += dayVal;
        monthlyDaysBy[w.id] = (monthlyDaysBy[w.id] || 0) + dayVal;
      } else {
        out.daily += wage;
        out.dailyDays += dayVal;
        weekDaysWorked[w.id + '|' + wk] = (weekDaysWorked[w.id + '|' + wk] || 0) + dayVal;
        bumpArea(areaId, wage, dayVal, 0);
      }
      bumpFloor(w, areaId, wage);

      var oth = m.ot || 0;
      if (oth > 0) {
        var rate = workerOtRate(w);
        var otPay = oth * rate * cfg.otMult;
        out.otHours += oth;
        out.ot += otPay;
        bumpArea(areaId, otPay, 0, oth);
        bumpFloor(w, areaId, otPay);
        if (!(rate > 0) && out.ratelessWorkers.indexOf(w.name) < 0) out.ratelessWorkers.push(w.name);
      }
    });

    (rec.extra || []).forEach(function(x) {
      var h = x.hours || 0;
      if (h <= 0) return;
      var pay = h * cfg.extraRate;
      out.extraHours += h;
      out.extra += pay;
      if (_areaIsFloor(x.area)) out.floorCost += pay;
      bumpArea(x.area || 'flex', pay, 0, h);
    });
  });

  // Monthly tier rest days: the month's rest days scaled by each worker's own
  // attendance through the three-layer gate.
  if (out.restDaysInRange > 0) {
    roster.forEach(function(w) {
      if (w.comp !== 'monthly') return;
      var worked = monthlyDaysBy[w.id] || 0;
      var att = out.workingDays > 0 ? worked / out.workingDays : 0;
      var g = restGate(att, cfg);
      if (g <= 0) return;
      var credited = out.restDaysInRange * g;
      var pay = credited * (w.dayRate || 0);
      out.rest += pay;
      out.restDaysCredited += credited;
      if (w.onFloor !== false) out.floorCost += pay;
    });
  }

  // Daily tier rest credit: one further paid day for a week that reached the
  // gate. Measured on days inside this range, so a range cutting a week in half
  // under-credits that week — stated on the card rather than papered over.
  if (cfg.restCreditMinDays > 0) {
    Object.keys(weekDaysWorked).forEach(function(key) {
      if (weekDaysWorked[key] < cfg.restCreditMinDays) return;
      var w = staffById(parseInt(key.split('|')[0], 10));
      if (!w) return;
      var pay = (w.dayRate || 0);
      out.dailyRest += pay;
      if (w.onFloor !== false) out.floorCost += pay;
      bumpArea(w.area || 'flex', pay, 1, 0);
    });
  }

  ['monthlyDays', 'rest', 'pool', 'daily', 'dailyRest', 'ot', 'extra', 'floorCost'].forEach(function(k) {
    out[k] = gstRound(out[k]);
  });
  Object.keys(out.byArea).forEach(function(k) { out.byArea[k].cost = gstRound(out.byArea[k].cost); });

  // Fixed is the standing crew — the monthly tier, days and gated rest days
  // together. It moves with their attendance but not with tonnage, which is the
  // distinction the split exists to draw.
  out.fixed = gstRound(out.monthlyDays + out.rest);
  out.variable = gstRound(out.pool + out.daily + out.dailyRest + out.ot + out.extra);
  out.total = gstRound(out.fixed + out.variable);
  out.floor = out.floorCost;
  out.offFloor = gstRound(out.total - out.floor);
  out.coverage = out.workingDays > 0 ? Math.min(1, out.daysRecorded / out.workingDays) : 0;
  return out;
}

/* The one place that decides whether a ₹/kg may be printed at all.

   Two gates, and they fail for different reasons. Coverage below 90% means the
   numerator is short — the same 90% bar the client realisation table already
   uses, for the same reason: a figure drawn from a fraction of the book is not
   the same kind of number as one drawn from all of it.

   The day floor is about sample size, not about the lag. The lag is real at
   every length — tonnage here is *billed* tonnage and material is plated weeks
   before it is invoiced — so it cannot be gated away, only stated, and it is
   stated below wherever the range is short enough for it to dominate. Under a
   fortnight there is not enough of either side to divide. */
var LABOUR_PERKG_MIN_DAYS = 14;
var LABOUR_PERKG_LAG_DAYS = 60;
var LABOUR_PERKG_MIN_COVERAGE = 0.9;

function labourPerKgVerdict(lab, tonnageKg) {
  if (lab.total <= 0) return { ok: false, why: 'no labour recorded in this period' };
  if (!(tonnageKg > 0)) return { ok: false, why: 'no weighed tonnage in this period' };
  if (lab.rangeDays < LABOUR_PERKG_MIN_DAYS) {
    return { ok: false, why: 'a range under a fortnight is too short to divide &mdash; ' +
      'billing lags plating, so these invoices are not this period\u2019s output' };
  }
  if (lab.coverage < LABOUR_PERKG_MIN_COVERAGE) {
    return { ok: false, why: 'only ' + lab.daysRecorded + ' of ' + lab.workingDays +
      ' working days are recorded, so the contract side of the bill is short' };
  }
  return { ok: true, perKg: lab.total / tonnageKg };
}

function _labRow(label, value, sub) {
  return '<div class="inv-lab-row"><span class="inv-lab-label">' + label +
    (sub ? '<span class="inv-lab-sub">' + sub + '</span>' : '') + '</span>' +
    '<span class="inv-lab-value inv-mono">' + value + '</span></div>';
}

/* Where the variable hours went.

   This is the second half of the question the handoffs left open — not just how
   much labour, but how it is allocated. It ranks by cost rather than by days,
   because an area that pulls the overtime is a more expensive area than one
   that merely has bodies in it, and days alone would hide that.

   Drawn with `chartRankedBars` rather than a bar of its own: the app already
   has one ranked-bar shape and Top Items is the view a reader arrives from.

   Permanent payroll is not in here and the caption says so. A monthly salary
   cannot be attributed to a day, let alone to the area that day was worked in;
   splitting it by home area would print an allocation that nobody measured. */
function _labAreaRows(lab) {
  var keys = Object.keys(lab.byArea).filter(function(k) { return lab.byArea[k].cost > 0; });
  if (keys.length === 0) return '';
  keys.sort(function(a, b) { return lab.byArea[b].cost - lab.byArea[a].cost; });
  var total = keys.reduce(function(sum, k) { return sum + lab.byArea[k].cost; }, 0);

  var rows = keys.map(function(k) {
    var a = lab.byArea[k];
    var bits = [];
    if (a.days > 0) bits.push(formatNum(a.days, 1) + ' day' + (a.days === 1 ? '' : 's'));
    if (a.hours > 0) bits.push(formatNum(a.hours, 1) + ' h');
    if (total > 0) bits.push(formatNum((a.cost / total) * 100, 0) + '% of variable');
    return {
      label: areaLabel(k),
      value: a.cost,
      display: formatCurrency(a.cost),
      sub: bits.join(' \u00B7 '),
      // Off-floor areas are shaded apart: their wage is real and in the bill,
      // but it is overhead rather than plating cost, and a reader scanning for
      // where the plant's money goes should not have to remember which is which.
      tone: _areaIsFloor(k) ? '' : 'danger'
    };
  });

  return '<div class="inv-lab-area-title">Variable labour by area</div>' +
    chartRankedBars(rows, { unit: 'money' }) +
    '<div class="inv-stats-note">Hourly pool, daily tier, overtime and extra hours, placed by the area each ' +
    'was worked in. <strong>The monthly tier&rsquo;s day pay and rest days are not in here</strong> &mdash; that ' +
    'crew is the standing one and its cost does not follow the area it happened to stand in, so splitting it ' +
    'would print an allocation nobody measured. Their overtime <em>is</em> in here, because an overtime hour ' +
    'was worked somewhere specific and was paid for being worked.</div>';
}

/* The breakdown card. Used by the Attendance tab for a day or a week (cash
   only) and by Stats for the period (cash and ₹/kg). */
function renderLabourCard(fromIso, toIso, title, tonnage, extraClass) {
  var lab = labourForRange(fromIso, toIso);
  var cfg = labourCfg();
  var html = '<div class="inv-card inv-lab-card' + (extraClass ? ' ' + extraClass : '') +
    '"><div class="inv-card-header">' +
    '<span class="inv-card-title">' + escHtml(title || 'Labour') + '</span>' +
    '<span class="inv-lab-total inv-mono">' + formatCurrency(lab.total) + '</span></div>';

  if (lab.rosterSize === 0) {
    return html + '<div class="inv-empty-state inv-empty-state-sm">Nobody on the roster</div></div>';
  }

  html += '<div class="inv-lab-split">' +
    '<div class="inv-lab-half inv-lab-fixed"><div class="inv-lab-half-label">Fixed</div>' +
    '<div class="inv-lab-half-value inv-mono">' + formatCurrency(lab.fixed) + '</div>' +
    '<div class="inv-lab-half-sub">monthly tier, days and rest</div></div>' +
    '<div class="inv-lab-half inv-lab-variable"><div class="inv-lab-half-label">Variable</div>' +
    '<div class="inv-lab-half-value inv-mono">' + formatCurrency(lab.variable) + '</div>' +
    '<div class="inv-lab-half-sub">hourly, daily, OT and extra</div></div></div>';

  // One row per tier that actually has something in it. A tier nobody is on
  // renders nothing rather than a zero: a zero reads as a measurement.
  if (lab.monthlyDays > 0 || lab.monthlyDaysWorked > 0) {
    html += _labRow('Monthly tier &mdash; days', formatCurrency(lab.monthlyDays),
      formatNum(lab.monthlyDaysWorked, 1) + ' day' + (lab.monthlyDaysWorked === 1 ? '' : 's') + ' worked at day rate');
  }
  if (lab.rest > 0 || lab.restDaysInRange > 0) {
    html += _labRow('Rest days credited', formatCurrency(lab.rest),
      formatNum(lab.restDaysCredited, 1) + ' of ' + lab.restDaysInRange + ' &times; roster, gated at ' +
      Math.round(cfg.gateFull * 100) + '% / ' + Math.round(cfg.gateHalf * 100) + '%');
  }
  if (lab.pool > 0 || lab.poolHours > 0) {
    html += _labRow('Hourly pool', formatCurrency(lab.pool),
      formatNum(lab.poolHours, 1) + ' h, flat rate &mdash; no multiplier');
  }
  if (lab.daily > 0 || lab.dailyDays > 0) {
    html += _labRow('Daily tier', formatCurrency(lab.daily),
      formatNum(lab.dailyDays, 1) + ' day' + (lab.dailyDays === 1 ? '' : 's') + ' worked');
  }
  if (lab.dailyRest > 0) {
    html += _labRow('Daily rest credit', formatCurrency(lab.dailyRest),
      'full weeks at ' + cfg.restCreditMinDays + '+ days');
  }
  html += _labRow('Overtime (named)', formatCurrency(lab.ot),
    formatNum(lab.otHours, 1) + ' h at &times;' + formatNum(cfg.otMult, 2) + ', monthly tier at day rate &divide; 8');
  html += _labRow('Extra (unattributed)', formatCurrency(lab.extra), formatNum(lab.extraHours, 1) + ' h at ' + formatCurrency(cfg.extraRate) + '/h');
  html += _labRow('On the floor', formatCurrency(lab.floor),
    lab.offFloor > 0 ? formatCurrency(lab.offFloor) + ' off floor (gate, office)' : 'all of it');

  if (tonnage) {
    var verdict = labourPerKgVerdict(lab, tonnage.kg);
    if (verdict.ok) {
      var gap = cfg.modelPerKg > 0 ? verdict.perKg - cfg.modelPerKg : null;
      html += '<div class="inv-lab-perkg"><span class="inv-lab-perkg-value inv-mono">' +
        formatCurrency(verdict.perKg) + '/kg</span><span class="inv-lab-perkg-label">measured labour</span>' +
        (gap != null
          ? '<span class="inv-lab-perkg-model">against ' + formatCurrency(cfg.modelPerKg) +
            '/kg modelled &mdash; ' + (Math.abs(gap) < 0.005 ? 'the same figure'
              : formatCurrency(Math.abs(gap)) + '/kg ' + (gap > 0 ? 'higher' : 'lower')) + '</span>'
          : '') +
        '</div>';
      if (lab.rangeDays < LABOUR_PERKG_LAG_DAYS) {
        html += '<div class="inv-stats-caveat">Read that as an order of magnitude, not a rate. The labour is ' +
          'this period&rsquo;s; the tonnage under it is what was <strong>billed</strong> in this period, and ' +
          'material is plated weeks before it is invoiced. Over a quarter or a year the two line up; over ' +
          'a month they measure partly different work.</div>';
      }
      if (tonnage.coverage < 0.999) {
        html += '<div class="inv-stats-caveat">That ₹/kg divides the whole labour bill by tonnage covering <strong>' +
          Math.round(tonnage.coverage * 100) + '% of revenue</strong>. The unweighed lines are the piece-billed work, ' +
          'so the real denominator is larger and the true labour cost per kilo is <strong>lower</strong> than this. ' +
          'Items Master &rarr; Derive weights from rates closes it.</div>';
      }
    } else {
      html += '<div class="inv-lab-perkg inv-lab-perkg-none"><span class="inv-lab-perkg-value">&mdash;</span>' +
        '<span class="inv-lab-perkg-label">₹/kg withheld</span>' +
        '<span class="inv-lab-perkg-model">' + verdict.why + '</span></div>';
    }
  }

  // Coverage, always, in the same place whether it is complete or not. A card
  // that only mentions its gaps when it has them teaches the reader to stop
  // looking for the line.
  var covPct = Math.round(lab.coverage * 100);
  html += '<div class="inv-stats-note">Recorded <strong>' + lab.daysRecorded + ' of ' + lab.workingDays +
    ' working days</strong> in this range (' + covPct + '%)' +
    (lab.sundaysRecorded > 0 ? ', plus ' + lab.sundaysRecorded + ' Sunday' + (lab.sundaysRecorded === 1 ? '' : 's') : '') + '. ' +
    (lab.coverage < 0.999
      ? 'Every tier is paid for days and hours actually recorded, so an incomplete range reads <strong>low</strong>, ' +
        'never neutral &mdash; and the monthly tier reads low <em>twice</em>, because a day nobody typed also ' +
        'depresses the attendance its rest-day gate is judged on.'
      : 'Every working day in the range is on file.') +
    (lab.restDaysInRange > 0 && lab.rangeDays < 28
      ? ' The rest-day gate is a monthly rule; over a range shorter than a month it judges each rest day on this range&rsquo;s attendance alone.'
      : '') +
    (lab.dailyRest > 0 && lab.rangeDays > 7 ? ' Daily rest credit is gated on days inside this range, so a range cutting a week in half under-credits that week.' : '') +
    '</div>';

  if (lab.ratelessWorkers.length > 0) {
    html += '<div class="inv-stats-caveat">Hours are recorded for <strong>' +
      escHtml(lab.ratelessWorkers.join(', ')) + '</strong> with no rate to price them at, so those hours ' +
      'are counted in the totals above and paid at zero. Set the rate in Roster to bring them into the bill.</div>';
  }

  // The allocation answer sits last: it is a breakdown of a figure the reader
  // has already been given, and in Stats the ₹/kg is the headline that must not
  // be pushed below a chart.
  html += _labAreaRows(lab);

  if (lab.extra > 0) {
    var share = lab.total > 0 ? (lab.extra / lab.total) * 100 : 0;
    html += '<div class="inv-stats-note"><strong>' + formatNum(share, 1) + '% of this bill</strong> is extra hours ' +
      'booked to an area rather than to a person. That is what &ldquo;the extra&rdquo; on the daily sheet is: ' +
      'real paid contract hours with no name against them. They are not spread across the men present, because ' +
      'a per-worker cost invented that way would answer the fixed-versus-variable question by accident.</div>';
  }

  return html + '</div>';
}

/* ===== STATS INTEGRATION =====
   Converts a Stats period into the ISO range the labour model works in. For
   'all', the range is the attendance store's own span — there is nothing to
   measure outside it. */
function labourRangeForPeriod(period) {
  var range = periodRange(period, 0);
  if (range) {
    return { from: attIso(new Date(range.start)), to: attIso(new Date(range.end)) };
  }
  var keys = Object.keys(S.attendance || {}).sort();
  if (keys.length === 0) return null;
  return { from: keys[0], to: keys[keys.length - 1] };
}

function renderLabourStatsCard(period, tonnage) {
  if ((S.staff || []).length === 0) return '';
  var r = labourRangeForPeriod(period);
  if (!r) return '';
  return renderLabourCard(r.from, r.to, (PERIOD_LABELS[period] || '') + ' Labour', tonnage, 'inv-stats-card-full');
}
/* ===== STATS (Phase 7 — Analytics Rework) =====
 *
 * This is a job-work business priced in rupees per kilogram. Revenue on its
 * own says almost nothing here: the same ₹1L of billing is a good month at
 * 8 tonnes and a loss-making one at 20. So every headline figure is carried
 * alongside the tonnage that produced it, and the ratio between them —
 * realisation, ₹/kg — is treated as the primary number rather than a
 * derived one.
 *
 * Against a full cost of ₹8.55/kg (Settings → Cost of Goods) and a blended
 * realisation near ₹8.45, the gap between a profitable client and a
 * loss-making one is under two rupees a kilo. Nothing in this dashboard used
 * to show it. The client realisation table does.
 */

var _statsPeriod = 'mtd';
var _statsTrendGran = 'month';
/* What the trend plots, and how. Revenue alone answers "did we bill more";
   tonnage answers "did we plate more"; incoming material answers "is work
   still arriving" — which leads the other two and is the one that warns. */
var _statsTrendSeries = 'revenue';
var _statsTrendType = 'line';
/* Composition is a share question, so it gets a share shape as well as a
   ranked one — the pie says "how much of the plant is this account". */
var _statsClientChart = 'bar';
/* Top items ranked by money, by weight, or by price. The card used to rank by
   money alone, which is the one ranking this business's own thesis says is
   insufficient: the same revenue is a good month at 8 tonnes and a bad one at
   20, and the parts filling the plant are not the parts paying for it. */
var _statsTopBy = 'value';

/* ===== PERIOD MATH =====
 * Periods are measured on the invoice DATE, not on when the record happened to
 * be typed. An invoice dated 31 July and entered on 2 August belongs to July —
 * that is the date on the document, the date GSTR-1 reports it under, and the
 * date the customer will quote back. createdAt is the fallback only for rows
 * that somehow carry no date at all.
 */
function invPeriodTs(inv) {
  if (inv && inv.date) {
    var p = inv.date.split('-');
    // Timezone-safe construction: never new Date("YYYY-MM-DD").
    if (p.length === 3) return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)).getTime();
  }
  return (inv && inv.createdAt) || 0;
}

/* Same day-of-month in a target month, clamped to that month's last day.
   Without the clamp, "the 31st, one month back" from 31 March silently
   becomes 3 March and the comparison period is wrong by three days. */
function dayInMonth(year, monthIdx, day) {
  var lastDay = new Date(year, monthIdx + 1, 0).getDate();
  return new Date(year, monthIdx, Math.min(day, lastDay), 23, 59, 59, 999);
}

/* Range for a period, offset periods back. offset 0 is the current period,
   1 the comparable stretch of the previous month / quarter / financial year. */
function periodRange(period, offset) {
  if (period === 'all') return null;
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  offset = offset || 0;

  if (period === 'mtd') {
    return {
      start: new Date(y, m - offset, 1).getTime(),
      end: dayInMonth(y, m - offset, d).getTime()
    };
  }
  if (period === 'qtd') {
    var qStart = m - (m % 3);
    var monthsIn = m - qStart;
    return {
      start: new Date(y, qStart - offset * 3, 1).getTime(),
      end: dayInMonth(y, qStart - offset * 3 + monthsIn, d).getTime()
    };
  }
  if (period === 'ytd') {
    // Indian financial year: 1 April to 31 March.
    var fyStart = m >= 3 ? y : y - 1;
    return {
      start: new Date(fyStart - offset, 3, 1).getTime(),
      end: dayInMonth(y - offset, m, d).getTime()
    };
  }
  return null;
}

function filterByPeriod(invoices, period, offset) {
  var range = periodRange(period, offset);
  if (!range) return offset ? [] : invoices;
  return invoices.filter(function(inv) {
    var ts = invPeriodTs(inv);
    return ts >= range.start && ts <= range.end;
  });
}

var PERIOD_LABELS = { mtd: 'MTD', qtd: 'QTD', ytd: 'YTD', all: 'All Time' };
var PERIOD_PRIOR_LABELS = {
  mtd: 'same days last month',
  qtd: 'same stretch last quarter',
  ytd: 'same stretch last year',
  all: ''
};

/* ===== TONNAGE =====
 * Weight for one line, with an explicit flag for whether it is actually known.
 * KG lines carry it directly. NOS lines need a per-piece weight: partWeights is
 * the operator-entered table that the nos_to_weight billing mode already prices
 * against, and the Items Master stdWeightKg is the fallback.
 *
 * Some of those master weights were recovered as pieceRate ÷ ratePerKg. Such a
