  } else {
    html += '<div class="inv-text-muted inv-storage-text inv-mb-16">' + groups.length + ' candidate group' + (groups.length !== 1 ? 's' : '') + ' found. Select the primary item in each group, then merge.</div>';
    groups.forEach(function(group, gi) {
      html += '<div class="inv-merge-group" id="mergeGroup' + gi + '">' +
        '<div class="inv-merge-group-header">' +
        '<span class="inv-card-title">Group ' + (gi + 1) + ' \u2014 ' + group.items.length + ' items</span>' +
        '<button class="inv-btn inv-btn-primary inv-btn-sm inv-merge-btn" data-action="invMergeGroup" data-group="' + gi + '">Merge</button>' +
        '</div>';
      group.items.forEach(function(it, ii) {
        html += '<label class="inv-merge-radio-row">' +
          '<input type="radio" name="mergePrimary' + gi + '" value="' + it.id + '"' + (ii === 0 ? ' checked' : '') + ' class="inv-merge-radio">' +
          '<div class="inv-merge-item-info">' +
          '<span class="inv-mono">' + escHtml(it.partNumber) + '</span> ' +
          '<span class="inv-client-badge inv-badge-mode">' + escHtml(it.unit) + '</span> ' +
          '<span class="inv-mono' + (it.rate > 0 ? ' inv-text-cost' : ' inv-text-muted') + '">' +
          (it.rate > 0 ? formatCurrency(it.rate) : 'No rate') + '</span>' +
          '</div>' +
          '<div class="inv-merge-item-desc inv-text-muted">' + escHtml(it.desc || '') + '</div>' +
          '</label>';
      });
      if (group._warn) {
        html += '<div class="inv-merge-warn">Review: descriptions differ within this group</div>';
      }
      html += '</div>';
    });
  }

  html += '<div class="inv-btn-bar"><button class="inv-btn inv-btn-ghost" data-action="invCloseOverlay">Close</button></div></div>';
  scrim.innerHTML = html;
  scrim.addEventListener('click', function(e) {
    if (e.target === scrim) { scrim.remove(); document.body.style.overflow = ''; popFocus(); }
  });

  scrim._mergeGroups = groups;

  pushFocus();
  document.body.appendChild(scrim);
  document.body.style.overflow = 'hidden';
  focusFirstInteractive(scrim.querySelector('.inv-overlay-card'));
}

function findDuplicateGroups(items) {
  var groups = [];
  var used = {};

  var coreMap = {};
  items.forEach(function(it) {
    var core = _extractNumericCore(it.partNumber);
    if (!core || core.replace(/\s/g, '').length < 4) return;
    if (!coreMap[core]) coreMap[core] = [];
    coreMap[core].push(it);
  });

  Object.keys(coreMap).forEach(function(core) {
    if (coreMap[core].length < 2) return;
    var ids = coreMap[core].map(function(it) { return it.id; }).sort().join(',');
    if (used[ids]) return;
    used[ids] = true;

    var descs = {};
    coreMap[core].forEach(function(it) {
      var d = (it.desc || '').toUpperCase().trim();
      if (d && d !== (it.partNumber || '').toUpperCase().trim()) {
        descs[d] = true;
      }
    });

    groups.push({ items: coreMap[core], _warn: Object.keys(descs).length > 1 });
  });

  groups.sort(function(a, b) {
    if (a._warn !== b._warn) return a._warn ? 1 : -1;
    return b.items.length - a.items.length;
  });

  return groups;
}

function _extractNumericCore(partNumber) {
  if (!partNumber) return '';
  var digits = partNumber.match(/\d+/g);
  if (!digits) return '';
  return digits.join(' ');
}

function mergeGroup(groupIdx) {
  var scrim = document.querySelector('.inv-overlay-scrim');
  if (!scrim || !scrim._mergeGroups) return;
  var group = scrim._mergeGroups[groupIdx];
  if (!group) return;

  var radios = document.querySelectorAll('input[name="mergePrimary' + groupIdx + '"]');
  var primaryId = null;
  radios.forEach(function(r) { if (r.checked) primaryId = parseInt(r.value); });
  if (primaryId == null) return;

  var primary = group.items.find(function(it) { return it.id === primaryId; });
  if (!primary) return;
  var secondaries = group.items.filter(function(it) { return it.id !== primaryId; });
  if (secondaries.length === 0) return;

  var secondaryPNs = secondaries.map(function(it) { return it.partNumber; });

  var invCount = 0;
  var imCount = 0;
  (S.invoices || []).forEach(function(inv) {
    var affected = false;
    inv.items.forEach(function(li) {
      if (secondaryPNs.indexOf(li.partNumber) >= 0) affected = true;
    });
    if (affected) invCount++;
  });
  (S.incomingMaterial || []).forEach(function(im) {
    var affected = false;
    im.items.forEach(function(li) {
      if (secondaryPNs.indexOf(li.partNumber) >= 0) affected = true;
    });
    if (affected) imCount++;
  });

  var groupEl = document.getElementById('mergeGroup' + groupIdx);
  if (!groupEl) return;

  groupEl.innerHTML = '<div class="inv-merge-preview">' +
    '<div class="inv-card-title">Merge into: ' + escHtml(primary.partNumber) + '</div>' +
    '<div class="inv-text-muted inv-storage-text inv-mb-8">Will remove: ' + secondaries.length + ' duplicate item' + (secondaries.length !== 1 ? 's' : '') + '</div>' +
    '<div class="inv-text-muted inv-storage-text inv-mb-16">Will update: ' + invCount + ' invoice' + (invCount !== 1 ? 's' : '') + ', ' + imCount + ' challan' + (imCount !== 1 ? 's' : '') + '</div>' +
    '<div class="inv-btn-bar">' +
    '<button class="inv-btn inv-btn-ghost inv-btn-sm" data-action="invMergeCancelPreview" data-group="' + groupIdx + '">Cancel</button>' +
    '<button class="inv-btn inv-btn-primary inv-btn-sm" data-action="invMergeConfirm" data-group="' + groupIdx + '" data-primary="' + primaryId + '">Confirm Merge</button>' +
    '</div></div>';
}

function confirmMerge(groupIdx, primaryId) {
  var scrim = document.querySelector('.inv-overlay-scrim');
  if (!scrim || !scrim._mergeGroups) return;
  var group = scrim._mergeGroups[groupIdx];
  if (!group) return;

  var primary = group.items.find(function(it) { return it.id === primaryId; });
  if (!primary) return;
  var secondaries = group.items.filter(function(it) { return it.id !== primaryId; });
  var secondaryPNs = secondaries.map(function(it) { return it.partNumber; });

  var invUpdated = 0;
  (S.invoices || []).forEach(function(inv) {
    inv.items.forEach(function(li) {
      if (secondaryPNs.indexOf(li.partNumber) >= 0) {
        li.partNumber = primary.partNumber;
        li.desc = primary.desc;
        invUpdated++;
      }
    });
  });

  var imUpdated = 0;
  (S.incomingMaterial || []).forEach(function(im) {
    im.items.forEach(function(li) {
      if (secondaryPNs.indexOf(li.partNumber) >= 0) {
        li.partNumber = primary.partNumber;
        li.desc = primary.desc;
        imUpdated++;
      }
    });
  });

  secondaries.forEach(function(sec) {
    var idx = S.items.indexOf(sec);
    if (idx > -1) S.items.splice(idx, 1);
  });

  saveState();

  var groupEl = document.getElementById('mergeGroup' + groupIdx);
  if (groupEl) groupEl.remove();
  scrim._mergeGroups[groupIdx] = null;

  showToast('Merged ' + (secondaries.length + 1) + ' \u2192 1. Updated ' + invUpdated + ' invoice line' + (invUpdated !== 1 ? 's' : '') + ', ' + imUpdated + ' challan line' + (imUpdated !== 1 ? 's' : '') + '.');
}

function cancelMergePreview(groupIdx) {
  closeOverlay();
  openMergeTool();
}

/* --- Weight Calculator --- */
/* ===== BULK WEIGHT ENTRY =====

   Calc Weights derives a weight from lines billed in KG that also carry a
   piece count. Piece-billed work has no such line, so for those parts it can
   derive nothing — and without a weight there is no rupees-per-kg, which means
   no margin figure for the piece-billed side of the book at all.

   This screen closes that gap by hand. It orders the gaps by the revenue
   riding on them, and shows the break-even weight beside each input: at the
   configured cost per kg, a piece heavier than rate/cost is being processed
   at a loss. Typing a weight prices the part immediately, so the entry pass
   doubles as a margin review. */

function _partRevenueMap() {
  var rev = {};
  (S.invoices || []).forEach(function(inv) {
    if (inv.status === 'cancelled') return;
    (inv.items || []).forEach(function(li) {
      if (!li.partNumber) return;
      rev[li.partNumber] = (rev[li.partNumber] || 0) + (li.amount || 0);
    });
  });
  return rev;
}

/* partNumber -> [weight, ...] recovered from piece pricing, in ONE pass.

   Deliberately not a per-item scan. With ~700 invoices and ~160 items that
   shape cost ~350,000 getLineItemRate() calls, each filtering and sorting a
   client's rate ladder — enough to stall the phone this runs on. Walking the
   book once, with the client resolved per invoice rather than per line, does
   the same work in a few hundred. */
function _buildDerivedWeightMap() {
  var map = {};
  (S.invoices || []).forEach(function(inv) {
    if (inv.status === 'cancelled') return;
    var client = S.clients.find(function(c) { return c.id === inv.clientId; });
    if (!client || client.billingMode !== 'piece') return;
    var date = inv.date || localDateStr();

    (inv.items || []).forEach(function(li) {
      if (!li.partNumber) return;
      if ((li.unit || '').toUpperCase() !== 'NOS' || !(li.rate > 0)) return;
      var rateInfo = getLineItemRate(client, date, li.partNumber);
      // An override is a negotiated per-piece figure with no weight basis;
      // inverting it would invent a number rather than recover one.
      if (rateInfo._override || !(rateInfo.ratePerKg > 0)) return;
      if (!map[li.partNumber]) map[li.partNumber] = [];
      map[li.partNumber].push(li.rate / rateInfo.ratePerKg);
    });
  });
  return map;
}

/* Break-even weight in kg: above this, the piece rate does not cover cost.
   Only meaningful for per-piece rates — a KG rate is already rupees per kg. */
function _breakEvenKg(item, cost) {
  if (!cost || cost <= 0) return null;
  if ((item.unit || '').toUpperCase() !== 'NOS') return null;
  if (!item.rate || item.rate <= 0) return null;
  return item.rate / cost;
}

function openWeightEntry() {
  var missing = (S.items || []).filter(function(it) { return it.stdWeightKg == null; });
  if (missing.length === 0) {
    showToast('Every item already has a standard weight');
    return;
  }

  var cost = S.defaultCostPerKg || 0;
  var revMap = _partRevenueMap();
  missing.sort(function(a, b) {
    return (revMap[b.partNumber] || 0) - (revMap[a.partNumber] || 0);
  });

  var weightMap = _buildDerivedWeightMap();
  var derivable = missing.filter(function(it) { return !!weightMap[it.partNumber]; }).length;

  var html = '<div class="inv-overlay-card">' +
    '<div class="inv-overlay-header"><span class="inv-overlay-title">Enter Weights</span>' +

    missing.length + ' item' + (missing.length !== 1 ? 's' : '') + ' without a weight, heaviest revenue first. ' +
    (cost > 0
      ? 'Break-even is shown against a cost of ' + formatCurrency(cost) + '/kg.'
      : 'Set a cost per kg in Settings to see break-even weights.') +
    '</div>' +
    (derivable > 0
      ? '<div class="inv-text-muted inv-storage-text inv-mb-16">' +
        derivable + ' of these are billed per piece off a rate per kg, so the weight is ' +
        'recoverable from the pricing itself — no weighing needed. Note that a weight ' +
        'derived this way prices back at exactly that rate, so it measures tonnage, not margin.' +
        '</div>'
      : '');

  html += '<div class="inv-weight-list">';
  missing.forEach(function(it) {
    var be = _breakEvenKg(it, cost);
    var revenue = revMap[it.partNumber] || 0;
    html += '<div class="inv-weight-row">' +
      '<div class="inv-weight-row-head">' +
      '<span class="inv-item-pn inv-mono">' + escHtml(it.partNumber) + '</span>' +
      (it.gauge ? '<span class="inv-gauge-badge">' + escHtml(it.gauge) + '</span>' : '') +
      '<span class="inv-client-badge inv-badge-mode">' + escHtml(it.unit || 'KG') + '</span>' +
      '</div>' +
      '<div class="inv-weight-row-meta">' +
      '<span class="inv-mono">' + (it.rate ? formatCurrency(it.rate) + '/' + escHtml(it.unit || 'KG') : 'No rate') + '</span>' +
      (revenue > 0 ? '<span class="inv-text-muted inv-mono">' + formatCurrency(revenue) + ' billed</span>' : '') +
      (be != null ? '<span class="inv-weight-breakeven">break-even ' + formatNum(be, 3) + ' kg</span>' : '') +
      '</div>' +
      '<div class="inv-weight-row-entry">' +
      '<input type="number" class="inv-form-input inv-mono inv-weight-input" ' +
      'data-action="invWeightInput" data-id="' + it.id + '" ' +
      'data-rate="' + (it.rate || 0) + '" data-unit="' + escHtml(it.unit || 'KG') + '" ' +
      'step="0.001" min="0" placeholder="kg per piece">' +
      '<span class="inv-weight-verdict" id="invWeightVerdict' + it.id + '"></span>' +
      '</div>' +
      '</div>';
  });
  html += '</div>';

  html += '<div class="inv-btn-bar">' +
    '<button class="inv-btn inv-btn-ghost" data-action="invCloseOverlay">Cancel</button>' +
    (derivable > 0
      ? '<button class="inv-btn inv-btn-ghost" data-action="invDeriveWeights">Derive ' + derivable + ' from rates</button>'
      : '') +
    '<button class="inv-btn inv-btn-primary" data-action="invSaveWeights">Save Weights</button></div></div>';

  var scrim = document.createElement('div');
  scrim.className = 'inv-overlay-scrim';
  scrim.innerHTML = html;
  scrim.addEventListener('click', function(e) {
    if (e.target === scrim) { scrim.remove(); document.body.style.overflow = ''; popFocus(); }
  });
  pushFocus();
  document.body.appendChild(scrim);
  document.body.style.overflow = 'hidden';
  focusFirstInteractive(scrim.querySelector('.inv-overlay-card'));

/* Live pricing as a weight is typed. */
function updateWeightVerdict(input) {
  var el = document.getElementById('invWeightVerdict' + input.dataset.id);
  if (!el) return;
  var cost = S.defaultCostPerKg || 0;
  var rate = parseFloat(input.dataset.rate) || 0;
  var kg = parseFloat(input.value);

  el.classList.remove('inv-weight-ok', 'inv-weight-bad');
  if (!input.value.trim() || isNaN(kg) || kg <= 0) { el.textContent = ''; return; }
  if (rate <= 0 || cost <= 0 || (input.dataset.unit || '').toUpperCase() !== 'NOS') {
    el.textContent = '';
    return;
  }

  var perKg = gstRound(rate / kg);
  el.textContent = formatCurrency(perKg) + '/kg';
  el.classList.add(perKg >= cost ? 'inv-weight-ok' : 'inv-weight-bad');
}

function saveWeights() {
  var inputs = document.querySelectorAll('.inv-weight-input');
  var saved = 0;
  var invalid = 0;

  inputs.forEach(function(input) {
    var raw = input.value.trim();
    if (raw === '') return;
    var kg = parseFloat(raw);
    if (isNaN(kg) || kg <= 0) { invalid++; return; }
    var item = S.items.find(function(it) { return it.id === parseInt(input.dataset.id); });
    if (!item) return;
    item.stdWeightKg = kg;
    saved++;
  });

  if (invalid > 0 && saved === 0) {
    showToast('Enter weights greater than zero', 'error');
    return;
  }
  if (saved === 0) {
    showToast('No weights entered', 'error');
    return;
  }

  saveState();
  closeOverlay();
  _itemsRendered = 0;
  renderClientsPage();
  showToast('Saved ' + saved + ' weight' + (saved !== 1 ? 's' : '') +
    (invalid > 0 ? ' (' + invalid + ' skipped)' : ''));
}

/* Derive weights by inverting the client's own pricing.

   Where a client bills per piece off a rate per kg, the piece rate WAS the
   weight times that rate — so weight = pieceRate / ratePerKg recovers it
   exactly. Corroborated against strip gauge: clamps carried in two gauges
   imply the same developed strip length to within ~1%, which only happens if
   the rates were built this way.

   Restricted to billingMode 'piece' with no itemRates override. An override is
   a negotiated per-piece figure with no stated weight basis, so inverting it
   would invent a number.

   Note what this cannot do: a weight defined as rate/ratePerKg prices back at
   exactly ratePerKg, so these weights say nothing about which parts are more
   profitable. Their value is tonnage — what the plant actually processed. */
/* The derivation itself, with no UI attached, so the Items Master button and
   the bootstrap migration in init.js run exactly the same code rather than two
   implementations that can drift. Fills only empty weights — a weight already
   on file, whether typed or previously derived, is never overwritten.
   Returns what it did; persisting is the caller's business. */
function applyDerivedWeights() {
  var derived = 0;
  var highVariance = 0;
  var ambiguous = 0;
  var weightMap = _buildDerivedWeightMap();

  /* Part numbers held by more than one catalogue row at different gauges.
     Four clamp families are like this — CLAMP 165X83 (NT) exists at 35X6 and
     40X6, and priced differently, so they are different weights. An invoice
     line carries no gauge field, only the part number, so a derived weight
     cannot be attributed to one of them: averaging would hand both rows a
     figure that is right for neither. They are left for manual entry.

     This costs no tonnage. Stats derives a piece-billed line's weight from the
     line's own amount, which is correct whichever gauge it was. What is
     withheld is only the catalogue's per-part figure. */
  var gaugesFor = {};
  (S.items || []).forEach(function(it) {
    var key = it.partNumber;
    if (!gaugesFor[key]) gaugesFor[key] = {};
    gaugesFor[key][it.gauge || ''] = true;
  });

  (S.items || []).forEach(function(item) {
    if (item.stdWeightKg != null) return;

    var weights = weightMap[item.partNumber];
    if (!weights || weights.length === 0) return;

    if (Object.keys(gaugesFor[item.partNumber] || {}).length > 1) { ambiguous++; return; }

    var avg = weights.reduce(function(s, w) { return s + w; }, 0) / weights.length;
    if (weights.length > 1) {
      var variance = weights.reduce(function(s, w) { return s + Math.pow(w - avg, 2); }, 0) / weights.length;
      if ((Math.sqrt(variance) / avg) * 100 > 20) highVariance++;
    }

    item.stdWeightKg = Math.round(avg * 10000) / 10000;
    derived++;
  });

  return { derived: derived, highVariance: highVariance, ambiguous: ambiguous,
           sources: Object.keys(weightMap).length };
}

function deriveWeightsFromRates() {
  var result = applyDerivedWeights();
  var derived = result.derived;
  var highVariance = result.highVariance;

  if (derived === 0) {
    showToast('No piece-billed lines to derive weights from', 'error');
    return;
  }

  saveState();
  closeOverlay();
  _itemsRendered = 0;
  renderClientsPage();
  var notes = [];
  if (highVariance > 0) notes.push(highVariance + ' with inconsistent rates');
  if (result.ambiguous > 0) notes.push(result.ambiguous + ' skipped: same part in two gauges');
  showToast('Derived ' + derived + ' weight' + (derived !== 1 ? 's' : '') +
    (notes.length ? ' (' + notes.join(', ') + ')' : ''),
    notes.length ? 'warning' : 'success');
}

function calculateStdWeights() {
  var calculated = 0;
  var highVariance = 0;

  S.items.forEach(function(item) {
    if (item.stdWeightKg != null) return;

    var pairs = [];

    (S.invoices || []).forEach(function(inv) {
      inv.items.forEach(function(li) {
        if (li.partNumber === item.partNumber && li.unit === 'KG' && li.nosQty > 0 && li.qty > 0) {
          pairs.push({ kg: li.qty, nos: li.nosQty });
        }
      });
    });

    (S.incomingMaterial || []).forEach(function(im) {
      im.items.forEach(function(li) {
        if (li.partNumber === item.partNumber && li.unit === 'KG' && li.nosQty > 0 && li.qty > 0) {
          pairs.push({ kg: li.qty, nos: li.nosQty });
        }
      });
    });

    if (pairs.length === 0) return;

    var weights = pairs.map(function(p) { return p.kg / p.nos; });
    var avg = weights.reduce(function(s, w) { return s + w; }, 0) / weights.length;

    if (weights.length > 1) {
      var variance = weights.reduce(function(s, w) { return s + Math.pow(w - avg, 2); }, 0) / weights.length;
      var cv = (Math.sqrt(variance) / avg) * 100;
      if (cv > 20) highVariance++;
    }

    item.stdWeightKg = gstRound(avg * 1000) / 1000;
    calculated++;
  });

  if (calculated > 0) {
    saveState();
    _itemsRendered = 0;
    _renderItemsList();
  }

  var msg = 'Calculated weights for ' + calculated + ' item' + (calculated !== 1 ? 's' : '') + ' from invoice/challan history';
  if (highVariance > 0) msg += '. ' + highVariance + ' with high variance (>20% CV)';
  if (calculated === 0) msg = 'No items with calculable weights found. Need invoice/challan data with both KG qty and NOS count.';
  showToast(msg, calculated > 0 ? 'success' : 'warning');
}

/* --- Usage Scoring (Phase 6b) --- */
function _buildUsageCache() {
  if (_itemsUsageCache) return _itemsUsageCache;
  var cache = {};
  var now = Date.now();
  var thirtyDaysMs = 30 * 86400000;

  (S.invoices || []).forEach(function(inv) {
    var recent = inv.createdAt && (now - inv.createdAt) < thirtyDaysMs;
    (inv.items || []).forEach(function(li) {
      var pn = li.partNumber;
      if (!pn) return;
      if (!cache[pn]) cache[pn] = { total: 0, recent: 0 };
      cache[pn].total++;
      if (recent) cache[pn].recent++;
    });
  });

  (S.incomingMaterial || []).forEach(function(im) {
    var recent = im.createdAt && (now - im.createdAt) < thirtyDaysMs;
    (im.items || []).forEach(function(li) {
      var pn = li.partNumber;
      if (!pn) return;
      if (!cache[pn]) cache[pn] = { total: 0, recent: 0 };
      cache[pn].total++;
      if (recent) cache[pn].recent++;
    });
  });

  _itemsUsageCache = cache;
  return cache;
}

function _getUsageScore(partNumber) {
  var cache = _buildUsageCache();
  var entry = cache[partNumber];
  if (!entry) return 0;
  return entry.total + (entry.recent * 2);
}

function _getUsageCount(partNumber) {
  var cache = _buildUsageCache();
  var entry = cache[partNumber];
  return entry ? entry.total : 0;
}

function _invalidateUsageCache() {
  _itemsUsageCache = null;
}

/* --- Batch Select/Delete --- */
function toggleItemSelect(itemId) {
  _itemsSelected[itemId] = !_itemsSelected[itemId];
  if (!_itemsSelected[itemId]) delete _itemsSelected[itemId];
  _renderItemsSelectionBar();
  // Toggle visual on card
  var card = document.querySelector('.inv-item-card[data-id="' + itemId + '"]');
  if (card) card.classList.toggle('inv-item-selected', !!_itemsSelected[itemId]);
}

function selectAllUnused() {
  _itemsSelected = {};
  var cache = _buildUsageCache();
  S.items.forEach(function(it) {
    if (!cache[it.partNumber]) _itemsSelected[it.id] = true;
  });
  _itemsRendered = 0;
  _renderItemsList();
  _renderItemsSelectionBar();
  var count = Object.keys(_itemsSelected).length;
  showToast(count + ' unused item' + (count !== 1 ? 's' : '') + ' selected');
}

function clearItemSelection() {
  _itemsSelected = {};
  _itemsRendered = 0;
  _renderItemsList();
  _renderItemsSelectionBar();
}

function batchDeleteItems() {
  var ids = Object.keys(_itemsSelected).filter(function(k) { return _itemsSelected[k]; }).map(Number);
  if (ids.length === 0) return;
  if (!confirm('Delete ' + ids.length + ' item' + (ids.length !== 1 ? 's' : '') + '? Historical invoice/challan references will be kept.')) return;
  S.items = S.items.filter(function(it) { return ids.indexOf(it.id) < 0; });
  _itemsSelected = {};
  _invalidateUsageCache();
  saveState();
  _itemsRendered = 0;
  _renderItemsList();
  _renderItemsSelectionBar();
  showToast(ids.length + ' item' + (ids.length !== 1 ? 's' : '') + ' deleted');
}

function _renderItemsSelectionBar() {
  var count = Object.keys(_itemsSelected).filter(function(k) { return _itemsSelected[k]; }).length;
  var bar = document.getElementById('itemsSelBar');
  if (!bar) return;
  if (count === 0) {
    bar.innerHTML = '';
    return;
  }
  bar.innerHTML = '<div class="inv-im-sel-bar">' +
    '<span class="inv-im-sel-count">' + count + ' selected</span>' +
    '<div class="inv-items-sel-actions">' +
    '<button class="inv-btn inv-btn-ghost inv-btn-sm inv-sel-clear-btn" data-action="invClearItemSelection">Clear</button>' +
    '<button class="inv-im-sel-btn" data-action="invBatchDeleteItems">Delete</button>' +
    '</div></div>';
}

  // Totals
  html += '<div id="invTotalsArea">';
  if (invoiceForm.items.length > 0) {
    const taxable = gstRound(invoiceForm.items.reduce((s,i) => s + (i.amount || 0), 0));
    const gstType = client ? client.gstType : 'intra';
    const cgst = gstType === 'intra' ? gstRound(taxable * 9 / 100) : 0;
    const sgst = gstType === 'intra' ? gstRound(taxable * 9 / 100) : 0;
    const igst = gstType === 'inter' ? gstRound(taxable * 18 / 100) : 0;
    const grand = gstRound(taxable + cgst + sgst + igst);

    html += '<div class="inv-totals">' +
      '<div class="inv-total-row"><span class="inv-total-label">Taxable Value</span><span class="inv-total-value">' + formatCurrency(taxable) + '</span></div>';

        '<div class="inv-total-row"><span class="inv-total-label">SGST @ 9%</span><span class="inv-total-value">' + formatCurrency(sgst) + '</span></div>';
    } else {
      html += '<div class="inv-total-row"><span class="inv-total-label">IGST @ 18%</span><span class="inv-total-value">' + formatCurrency(igst) + '</span></div>';
    }
    html += '<div class="inv-total-row inv-total-row-grand"><span class="inv-total-label">Grand Total</span><span class="inv-total-grand">' + formatCurrency(grand) + '</span></div></div>';
  }
  html += '</div>';

  // Validation + Save
  const errors = validateInvoice();
  html += '<div id="invErrorsArea">';
  if (errors.length > 0) {
    html += errors.map(e => '<div class="inv-error">' + escHtml(e) + '</div>').join('');
  }
  html += '</div>';
  html += '<div class="inv-btn-bar inv-save-bar">' +
    '<button class="inv-btn inv-btn-ghost" data-action="invResetForm">Clear</button>' +
    '<button class="inv-btn inv-btn-primary" id="invSaveBtn" data-action="invSaveInvoice"' + (errors.length > 0 ? ' disabled' : '') + '>' +
    (invoiceForm.editingId ? 'Update Invoice' : 'Create Invoice') + '</button></div>';

  area.innerHTML = html;

  // Bind client search
  const cs = document.getElementById('invClientSearch');
  if (cs) {
    cs.addEventListener('input', () => {
      const q = cs.value.toLowerCase();
      const res = document.getElementById('invClientResults');
      const matches = q.length < 1 ? [] :
        S.clients.filter(c => c.isActive && (c.name.toLowerCase().includes(q) || (c.gstin||'').includes(q))).slice(0, 8);
      acReset();

      cs.setAttribute('aria-expanded', 'true');
    });
    setTimeout(() => cs.focus(), 100);
  }
}

function validateInvoice() {
  const errors = [];
  if (!invoiceForm.clientId) errors.push('Select a client');
  if (!invoiceForm.date) errors.push('Enter invoice date');
  if (invoiceForm.items.length === 0) errors.push('Add at least one line item');
  invoiceForm.items.forEach((item, i) => {
    if (item.qty < 0) errors.push('Line ' + (i+1) + ': Quantity cannot be negative');
    if (item.amount < 0) errors.push('Line ' + (i+1) + ': Amount cannot be negative');
  });
  return errors;
}

function selectClient(id) {
  captureOptionalFields();
  invoiceForm.clientId = id;
  const client = S.clients.find(c => c.id === id);
  // Auto-fill rate on existing items
  if (client) {
    invoiceForm.items.forEach(item => {
      const rateInfo = getLineItemRate(client, invoiceForm.date, item.partNumber);
      if (rateInfo._override) {
        item.rate = rateInfo.rate;
        item._override = true;
        item._label = rateInfo._label;
      } else {
        item.rate = rateInfo.ratePerKg || 0;
      }
      recalcLineItem(item, client);
    });
  }
  renderCreateForm();
}

function addLineItem() {
  captureOptionalFields();
  const client = invoiceForm.clientId ? S.clients.find(c => c.id === invoiceForm.clientId) : null;
  const item = {partNumber:'', desc:'', hsn:'998873', unit:'KG', qty:0, rate:0, amount:0, _override:false, _label:''};
  if (client) {
    const rateInfo = getLineItemRate(client, invoiceForm.date, '');
    item.rate = rateInfo.ratePerKg || 0;
  }
  invoiceForm.items.push(item);
  renderCreateForm();
}

function recalcLineItem(item, client) {
  if (!client) { item.amount = gstRound((item.qty||0) * (item.rate||0)); return; }
  if (client.billingMode === 'piece' && item.unit === 'NOS') {
    // Challan passthrough: amount entered directly, rate back-calculated
    if (item.qty > 0 && item.amount > 0) {
      item.rate = gstRound(item.amount / item.qty);
    }
    // Don't auto-calc amount for NOS piece mode
  } else if (client.billingMode === 'nos_to_weight' && item.unit === 'NOS') {
    const pwKey = (item.partNumber || '').toUpperCase();
    const w = (item.qty || 0) * (S.partWeights[pwKey] || 0);
    const rateInfo = getLineItemRate(client, invoiceForm.date, item.partNumber);
    item.rate = rateInfo.ratePerKg || 0;
    item.amount = gstRound(w * item.rate);
  } else {
    item.amount = gstRound((item.qty || 0) * (item.rate || 0));
  }
}

function saveInvoice() {
  const errors = validateInvoice();
  if (errors.length > 0) { showToast(errors[0], 'error'); return; }

  const client = S.clients.find(c => c.id === invoiceForm.clientId);
  if (!client) return;

  invoiceForm.challanNo = (document.getElementById('invChallanNo') || {}).value || '';
  invoiceForm.challanDate = (document.getElementById('invChallanDate') || {}).value || '';
  invoiceForm.transport = (document.getElementById('invTransport') || {}).value || '';
  invoiceForm.poNumber = (document.getElementById('invPONumber') || {}).value || '';
  invoiceForm.poDate = (document.getElementById('invPODate') || {}).value || '';
  invoiceForm.despatchDate = (document.getElementById('invDespatchDate') || {}).value || '';
  invoiceForm.remarks = (document.getElementById('invRemarks') || {}).value || '';
  invoiceForm.date = document.getElementById('invDate').value;

  const taxable = gstRound(invoiceForm.items.reduce((s,i) => s + (i.amount || 0), 0));
  const cgstPer = client.gstType === 'intra' ? 9 : 0;
  const sgstPer = client.gstType === 'intra' ? 9 : 0;
  const igstPer = client.gstType === 'inter' ? 18 : 0;
  const cgstAmt = gstRound(taxable * cgstPer / 100);
  const sgstAmt = gstRound(taxable * sgstPer / 100);
  const igstAmt = gstRound(taxable * igstPer / 100);
  const grand = gstRound(taxable + cgstAmt + sgstAmt + igstAmt);

  const now = Date.now();

  if (invoiceForm.editingId) {
    // Update existing
    const inv = S.invoices.find(i => i.id === invoiceForm.editingId);
    if (!inv) return;
    const gstTypeChanged = inv.gstType !== client.gstType;
    Object.assign(inv, {
      date: invoiceForm.date, clientId: client.id, clientName: client.name,
      clientGSTIN: client.gstin, clientAddress: {add1:client.add1,add2:client.add2,add3:client.add3,state:client.state,stateCode:client.stateCode},
      gstType: client.gstType,
      items: invoiceForm.items.map(i => ({partNumber:i.partNumber,desc:i.desc,hsn:i.hsn||'998873',unit:i.unit,qty:i.qty,rate:i.rate,amount:i.amount,nosQty:i.nosQty||null})),
      taxableValue: taxable, cgstPer, cgstAmt, sgstPer, sgstAmt, igstPer, igstAmt,
      grandTotal: grand, amountInWords: numberToWords(grand),
      challanNo: invoiceForm.challanNo, challanDate: invoiceForm.challanDate,
      poNumber: invoiceForm.poNumber, poDate: invoiceForm.poDate,
      despatchDate: invoiceForm.despatchDate, transport: invoiceForm.transport, remarks: invoiceForm.remarks, updatedAt: now
    });
    if (gstTypeChanged) {
      showToast('Invoice updated — GST type changed, verify tax amounts', 'warning');
    } else {
      showToast('Invoice updated');
    }
  } else {
    // New invoice
    const num = String(S.invNextNum).padStart(5, '0');
    const inv = {
      id: 'INV-' + now,
      invoiceNumber: num,
      displayNumber: S.invPrefix + num,
      date: invoiceForm.date,
      status: 'active',
      invoiceState: 'created',
      dispatchedAt: null, deliveredAt: null, filedAt: null,
      clientId: client.id, clientName: client.name,
      clientGSTIN: client.gstin,
      clientAddress: {add1:client.add1,add2:client.add2,add3:client.add3,state:client.state,stateCode:client.stateCode},
      gstType: client.gstType,
      items: invoiceForm.items.map(i => ({partNumber:i.partNumber,desc:i.desc,hsn:i.hsn||'998873',unit:i.unit,qty:i.qty,rate:i.rate,amount:i.amount,nosQty:i.nosQty||null})),
      taxableValue: taxable, cgstPer, cgstAmt, sgstPer, sgstAmt, igstPer, igstAmt,
      grandTotal: grand, amountInWords: numberToWords(grand),
      poNumber: invoiceForm.poNumber, poDate: invoiceForm.poDate, challanNo: invoiceForm.challanNo, challanDate: invoiceForm.challanDate,
      despatchDate: invoiceForm.despatchDate, transport: invoiceForm.transport, eWayBill:'', remarks: invoiceForm.remarks,
      linkedIMIds: invoiceForm._linkedIMIds || [], createdAt: now, updatedAt: now, cancelledAt: null
    };
    S.invoices.push(inv);
    S.invNextNum++;

    // Mark IM items as invoiced
    if (invoiceForm._linkedIMItemIds && invoiceForm._linkedIMItemIds.length > 0) {
      (S.incomingMaterial || []).forEach(function(im) {
        im.items.forEach(function(it) {
          if (invoiceForm._linkedIMItemIds.indexOf(it.id) >= 0) {
            it.invoiced = true;
            it.invoiceId = inv.id;
          }
        });
      });
    }

    showToast('Invoice ' + inv.displayNumber + ' saved');
  }

  // Save vehicle number to client for autocomplete
  saveVehicleToClient(invoiceForm.clientId, invoiceForm.transport);

  saveState();
  const returnDest = _navReturnTab || 'pageHome';
  initCreateForm();
  switchTab(returnDest);
}

function saveSettings() {
  S.company.name = document.getElementById('setCompName').value.trim();
  S.company.gstin = document.getElementById('setCompGstin').value.trim();
  S.company.add1 = document.getElementById('setCompAdd1').value.trim();

  S.invPrefix = document.getElementById('setPrefix').value.trim();
  S.invNextNum = parseInt(document.getElementById('setNextNum').value) || S.invNextNum;
  var cnNextEl = document.getElementById('setCnNextNum');
  if (cnNextEl) {
    var cnNext = parseInt(cnNextEl.value, 10);
    // Never below a number already issued from the app: a credit note number
    // the customer holds may not be handed out twice.
    var issued = (S.creditNotes || []).reduce(function(mx, c) {
      var n = parseInt(c.cnNumber, 10);
      return isNaN(n) ? mx : Math.max(mx, n);
    }, 0);
    if (!isNaN(cnNext) && cnNext > 0) {
      if (cnNext <= issued) {
        showToast('Next credit note must be above ' + cnPadNum(issued) + ' — that one is issued', 'error');
      } else {
        S.cnNextNum = cnNext;
      }
    }
  }
  var costEl = document.getElementById('setDefaultCost');
  if (costEl) { var parsedCost = parseFloat(costEl.value); if (!isNaN(parsedCost) && parsedCost > 0) S.defaultCostPerKg = parsedCost; }
  if (!S.labour) S.labour = {};
  var otMultEl = document.getElementById('setOtMult');
  if (otMultEl) { var pm = parseFloat(otMultEl.value); if (!isNaN(pm) && pm >= 0) S.labour.otMult = pm; }
  var extraRateEl = document.getElementById('setExtraRate');
  if (extraRateEl) { var pe = parseFloat(extraRateEl.value); if (!isNaN(pe) && pe >= 0) S.labour.extraRate = pe; }
  var restMinEl = document.getElementById('setRestMin');
  if (restMinEl) { var pr = parseInt(restMinEl.value, 10); if (!isNaN(pr) && pr >= 0) S.labour.restCreditMinDays = pr; }
  var labModelEl = document.getElementById('setLabModel');
  if (labModelEl) { var pl = parseFloat(labModelEl.value); if (!isNaN(pl) && pl >= 0) S.labour.modelPerKg = pl; }
  var gateFullEl = document.getElementById('setGateFull');
  if (gateFullEl) { var gf = parseFloat(gateFullEl.value); if (!isNaN(gf) && gf >= 0 && gf <= 100) S.labour.gateFull = gf / 100; }
  var gateHalfEl = document.getElementById('setGateHalf');
  if (gateHalfEl) { var gh = parseFloat(gateHalfEl.value); if (!isNaN(gh) && gh >= 0 && gh <= 100) S.labour.gateHalf = gh / 100; }
  // A half threshold above the full one would make the middle band unreachable
  // and the gate silently binary. Swap rather than refuse: the intent is plain.
  if (S.labour.gateHalf > S.labour.gateFull) {
    var swap = S.labour.gateHalf; S.labour.gateHalf = S.labour.gateFull; S.labour.gateFull = swap;
  }
  var apiKeyEl = document.getElementById('setApiKey');
  if (apiKeyEl) setApiKey(apiKeyEl.value.trim());
  var metalsKeyEl = document.getElementById('setMetalsKey');
  if (metalsKeyEl) setMetalsKey(metalsKeyEl.value.trim());

  var z = getZinc();
  var zRateEl = document.getElementById('setZincRate');
  if (zRateEl) {
    var raw = zRateEl.value.trim();
    if (raw === '') {
      z.ratePerKg = null;
      z.updatedAt = null;
      z.source = '';
    } else {
      var parsedZinc = parseFloat(raw);
      // Only stamp the date when the figure actually moved, so an unrelated
      // settings save cannot make a stale rate look freshly checked.
      if (!isNaN(parsedZinc) && parsedZinc > 0 && parsedZinc !== z.ratePerKg) {
        z.ratePerKg = gstRound(parsedZinc);
        z.updatedAt = Date.now();
        z.source = 'manual';
        // A figure typed here is the MCX rate itself, so it must not also be
        // uplifted — that would compound an estimate onto a known number.
        z.basis = 'manual';
      }
    }
  }
  var zPremEl = document.getElementById('setZincPremium');
  if (zPremEl) {
    var parsedPrem = parseFloat(zPremEl.value);
    if (!isNaN(parsedPrem) && parsedPrem >= 0) z.premiumPerKg = gstRound(parsedPrem);
  }
  var zUpliftEl = document.getElementById('setZincUplift');
  if (zUpliftEl) {
    var parsedUplift = parseFloat(zUpliftEl.value);
    if (!isNaN(parsedUplift) && parsedUplift >= 0) z.upliftPct = parsedUplift;
  }

  saveGhSyncSettings();

  saveState();
  closeOverlay();
  renderZincCard();
  ghRenderCard();
  showToast('Settings saved');
}

function exportData() {

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sep-invoicing-backup-' + localDateStr() + '.json';

function importData() {
  const inp = document.getElementById('importFileInput');
  inp.onchange = (e) => {

    if (!f) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {

        showToast('Invalid file: ' + err.message, 'error');
      }

}

/* ===== GITHUB SYNC =====
   Backup and cross-device transfer for a localStorage-only app. Pushes the
   whole state object to one JSON file in a GitHub repo through the Contents
   API, and pulls it back on another device.

   Two things this deliberately is not. It is not a merge: the state is a
   single document with no per-record clocks, so anything other than
   last-writer-wins would be inventing a reconciliation it cannot verify. And
   it is not silent: every overwrite in either direction is confirmed, because
   the thing being overwritten is a GST filing record.

   What it does guarantee is that no overwrite happens blind. Each device
   remembers the blob SHA it last exchanged; if the SHA on the server has moved
   since, another device wrote in between and the operator is told whose and
   when before anything is replaced. */

const GH_SYNC_KEY = 'sep_inv_github_sync';
const GH_TOKEN_KEY = 'sep_inv_github_token';
const GH_SCHEMA = 1;

/* The token lives in its own localStorage entry, never on S — same rule the
   Gemini and metals.dev keys follow, so an exported backup can never carry a
   credential. The rest of the config is kept off S too: a file SHA and a
   device id describe *this* device's relationship to the remote, and restoring
   someone else's backup must not hand this device their sync position. */
function getGhToken() { try { return localStorage.getItem(GH_TOKEN_KEY) || ''; } catch (e) { return ''; } }
function setGhToken(t) { try { localStorage.setItem(GH_TOKEN_KEY, t); } catch (e) {} }

function getGhConfig() {
  var c = loadJSON(GH_SYNC_KEY, null) || {};
  if (!c.deviceId) {
    c.deviceId = 'dev-' + Math.random().toString(36).slice(2, 8);
    saveJSON(GH_SYNC_KEY, c);
  }
  return {
    owner: c.owner || '',
    repo: c.repo || '',
    branch: c.branch || 'main',
    path: c.path || 'sep-invoicing-data.json',
    deviceId: c.deviceId,
    deviceName: c.deviceName || '',
    sha: c.sha || null,
    lastPushAt: c.lastPushAt || null,
    lastPullAt: c.lastPullAt || null,
    autoPush: !!c.autoPush
  };
}

function setGhConfig(cfg) { saveJSON(GH_SYNC_KEY, cfg); }

function ghIsConfigured() {
  var c = getGhConfig();
  return !!(c.owner && c.repo && c.path && getGhToken());
}

function ghLastSyncAt() {
  var c = getGhConfig();
  return Math.max(c.lastPushAt || 0, c.lastPullAt || 0) || null;
}

/* ===== ENCODING =====
   The Contents API carries base64. btoa() only handles Latin-1, and client
   names and notes are not — so the string goes through TextEncoder first.
   The byte array is walked in chunks because String.fromCharCode.apply blows
   the call stack on a large state file. */
function ghEncode(str) {
  var bytes = new TextEncoder().encode(str);
  var bin = '';
  var chunk = 0x8000;
  for (var i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

function ghDecode(b64) {
  var bin = atob(String(b64).replace(/\s/g, ''));
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function ghContentsUrl(cfg) {
  return 'https://api.github.com/repos/' +
    encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo) +
    '/contents/' + cfg.path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
}

/* One place where an HTTP status becomes something an operator can act on.
   "404" on this endpoint almost never means what it says — a fine-grained
   token without Contents access gets a 404, not a 403. */
function ghErrorMessage(status, body) {
  var detail = body && body.message ? body.message : '';
  if (status === 401) return 'GitHub rejected the token. Check it has not expired.';
  if (status === 403) return 'GitHub refused the request (rate limit, or the token lacks Contents write). ' + detail;
  if (status === 404) return 'Not found — check owner, repo and branch, and that the token grants Contents access to this repo.';
  if (status === 409) return 'The file changed on GitHub while this push was in flight. Pull first, or push again.';
  if (status === 422) return 'GitHub rejected the file contents. ' + detail;
  return 'GitHub error ' + status + (detail ? ': ' + detail : '');
}

async function ghRequest(url, options) {
  var token = getGhToken();
  var opts = options || {};
  var res;
  try {
    res = await fetch(url, {
      method: opts.method || 'GET',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        'Content-Type': 'application/json'
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  } catch (err) {
    // fetch only rejects on a transport failure, which offline is.
    throw new Error('No connection to GitHub. The data is safe on this device — sync when you are back online.');
  }
  var payload = null;
  try { payload = await res.json(); } catch (e) { payload = null; }
  if (!res.ok) {
    var e2 = new Error(ghErrorMessage(res.status, payload));
    e2.status = res.status;
    throw e2;
  }
  return payload;
}

/* Reads the remote file. Returns null when it does not exist yet, which is
   the ordinary first-push case and not an error. */
async function ghGetRemote(cfg) {
  var url = ghContentsUrl(cfg) + '?ref=' + encodeURIComponent(cfg.branch);
  try {
    var data = await ghRequest(url);
    var envelope = null;
    if (data && data.content) {
      try { envelope = JSON.parse(ghDecode(data.content)); } catch (e) { envelope = null; }
    }
    return { sha: data ? data.sha : null, envelope: envelope };
  } catch (err) {
    if (err.status === 404) return null;
    throw err;
  }
}

function ghBuildEnvelope(cfg) {
  return {
    app: 'sep-invoicing',
    schema: GH_SCHEMA,
    savedAt: Date.now(),
    device: cfg.deviceName || cfg.deviceId,
    deviceId: cfg.deviceId,
    counts: {
      invoices: (S.invoices || []).length,
      challans: (S.incomingMaterial || []).length,
      clients: (S.clients || []).length,
      items: (S.items || []).length
    },
    state: S
  };
}

function ghDescribeEnvelope(env) {
  if (!env) return 'an unreadable file';
  var c = env.counts || {};
  var who = env.device ? ' from ' + env.device : '';
  var when = env.savedAt ? ' on ' + formatTimestamp(env.savedAt) : '';
  return (c.invoices != null ? c.invoices + ' invoices, ' + c.challans + ' challans' : 'a backup') + who + when;
}

/* ===== PUSH ===== */
async function ghPush(opts) {
  var silent = opts && opts.silent;
  var cfg = getGhConfig();
  if (!ghIsConfigured()) {
    if (!silent) showToast('Set the GitHub repo and token in Settings first', 'error');
    return false;
  }

  ghSetBusy(true, 'Pushing');
  try {
    var remote = await ghGetRemote(cfg);

    // The SHA moved since this device last exchanged: someone else wrote.
    // Never resolve that quietly — the operator is the only one who knows
    // which copy is the real one.
    if (remote && remote.sha && remote.sha !== cfg.sha) {
      if (silent) {
        ghSetBusy(false);
        ghSetStatus('Auto-push paused: GitHub has a newer copy (' + ghDescribeEnvelope(remote.envelope) + '). Push or pull by hand.');
        return false;
      }
      var ok = confirm('GitHub already holds a copy this device has not seen — ' +
        ghDescribeEnvelope(remote.envelope) + '.\n\nPushing replaces it with this device\'s data. Continue?');
      if (!ok) { ghSetBusy(false); ghSetStatus('Push cancelled.'); return false; }
    }

    var envelope = ghBuildEnvelope(cfg);
    var body = {
      message: 'SEP Invoicing backup — ' + envelope.counts.invoices + ' invoices, ' +
        envelope.counts.challans + ' challans (' + envelope.device + ')',
      content: ghEncode(JSON.stringify(envelope, null, 2)),
      branch: cfg.branch
    };
    if (remote && remote.sha) body.sha = remote.sha;

    var result = await ghRequest(ghContentsUrl(cfg), { method: 'PUT', body: body });
    cfg.sha = result && result.content ? result.content.sha : null;
    cfg.lastPushAt = Date.now();
    setGhConfig(cfg);
    ghSetBusy(false);
    ghSetStatus('Pushed ' + formatTimestamp(cfg.lastPushAt) + '.');
    ghRenderCard();
    if (!silent) showToast('Pushed to GitHub');
    return true;
  } catch (err) {
    ghSetBusy(false);
    ghSetStatus(err.message);
    if (!silent) showToast(err.message, 'error');
    return false;
  }
}

/* ===== PULL ===== */
async function ghPull() {
  var cfg = getGhConfig();
  if (!ghIsConfigured()) { showToast('Set the GitHub repo and token in Settings first', 'error'); return false; }

  ghSetBusy(true, 'Pulling');
  try {
    var remote = await ghGetRemote(cfg);
    if (!remote) {
      ghSetBusy(false);
      ghSetStatus('No backup file at that path yet — push once to create it.');
      showToast('Nothing to pull yet', 'warning');
      return false;
    }
    var env = remote.envelope;
    if (!env || env.app !== 'sep-invoicing' || !env.state || !env.state.company || !env.state.clients) {
      ghSetBusy(false);
      ghSetStatus('That file is not a SEP Invoicing backup.');
      showToast('That file is not a SEP Invoicing backup', 'error');
      return false;
    }
    if (env.schema > GH_SCHEMA) {
      ghSetBusy(false);
      ghSetStatus('That backup was written by a newer version of the app.');
      showToast('Backup is from a newer app version', 'error');
      return false;
    }

    var mine = (S.invoices || []).length + ' invoices, ' + (S.incomingMaterial || []).length + ' challans';
    if (!confirm('Replace ALL data on this device with ' + ghDescribeEnvelope(env) + '?\n\n' +
        'This device currently holds ' + mine + '. That is discarded.')) {
      ghSetBusy(false);
      ghSetStatus('Pull cancelled.');
      return false;
    }

    S = env.state;
    // Same repairs the loader applies, so a backup written before a field
    // existed cannot land the app in a broken state.
    if (!S.invoices) S.invoices = [];
    if (!S.incomingMaterial) S.incomingMaterial = [];
    if (!S.partWeights) S.partWeights = {};
    if (!S.voidedNumbers) S.voidedNumbers = [];
    saveState();

    cfg.sha = remote.sha;
    cfg.lastPullAt = Date.now();
    setGhConfig(cfg);

    ghSetBusy(false);
    ghSetStatus('Pulled ' + formatTimestamp(cfg.lastPullAt) + '.');
    closeOverlay();
    _tabDirty.home = true;
    _tabDirty.register = true;
    _regToolbarRendered = false;
    _imToolbarRendered = false;
    switchTab('pageHome');
    showToast('Pulled from GitHub');
    return true;
  } catch (err) {
    ghSetBusy(false);
    ghSetStatus(err.message);
    showToast(err.message, 'error');
    return false;
  }
}

/* ===== AUTO-PUSH =====
   Opt-in, debounced, and never during a burst of edits. saveState() fires on
   every keystroke-driven recalculation, so pushing per save would be both
   useless and rate-limited. */
var _ghPushTimer = null;
var _ghAutoBackoff = false;
const GH_AUTOPUSH_DELAY = 45000;

function ghNotifyChange() {
  var cfg = getGhConfig();
  if (!cfg.autoPush || !ghIsConfigured() || _ghAutoBackoff) return;
  if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
  clearTimeout(_ghPushTimer);
  _ghPushTimer = setTimeout(function() {
    ghPush({ silent: true }).then(function(ok) {
      // One failure stops the timer re-arming forever in the background;
      // a manual push clears it.
      if (!ok) _ghAutoBackoff = true;
    });
  }, GH_AUTOPUSH_DELAY);
}

/* ===== STATUS SURFACE ===== */
var _ghStatusText = '';
var _ghBusy = false;

function ghSetStatus(text) {
  _ghStatusText = text || '';
  var el = document.getElementById('ghSyncStatus');
  if (el) el.textContent = _ghStatusText;
  ghRenderCard();
}

function ghSetBusy(busy, label) {
  _ghBusy = busy;
  if (busy) _ghAutoBackoff = false;
  var el = document.getElementById('ghSyncStatus');
  if (el && busy) el.textContent = (label || 'Working') + '…';
  ['ghPushBtn', 'ghPullBtn'].forEach(function(id) {
    var b = document.getElementById(id);
    if (b) b.disabled = busy;
  });
}

function ghRelTime(ts) {
  if (!ts) return 'never';
  var mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + ' h ago';
  var days = Math.floor(hrs / 24);
  return days + ' day' + (days > 1 ? 's' : '') + ' ago';
}

/* Home card. A backup whose state you cannot see is a backup you will not
   trust, so the last sync time sits on the first screen rather than three
   taps into Settings. */
function ghRenderCard() {
  var host = document.getElementById('homeSyncCard');
  if (!host) return;
  if (!ghIsConfigured()) { host.innerHTML = ''; return; }

  var cfg = getGhConfig();
  var last = ghLastSyncAt();
  // Anything past a working day without a push is worth flagging on a device
  // whose only other copy is the localStorage it is sitting in.
  var stale = !last || (Date.now() - last) > 86400000;

  host.innerHTML = '<div class="inv-card inv-sync-card">' +
    '<div class="inv-flex-between">' +
      '<div class="inv-sync-meta">' +
        '<div class="inv-sync-label">GitHub backup' +
          (stale ? '<span class="inv-sync-stale">stale</span>' : '') + '</div>' +
        '<div class="inv-sync-repo inv-mono">' + escHtml(cfg.owner + '/' + cfg.repo) + '</div>' +
        '<div class="inv-sync-time">Last synced ' + escHtml(ghRelTime(last)) + '</div>' +
      '</div>' +
      '<button class="inv-btn inv-btn-ghost inv-btn-sm" data-action="invGhPush"' + (_ghBusy ? ' disabled' : '') + '>' +
        (_ghBusy ? 'Syncing…' : 'Back up now') + '</button>' +
    '</div></div>';
}

/* ===== SETTINGS SECTION ===== */
function renderGhSyncSettings() {
  var cfg = getGhConfig();
  var last = ghLastSyncAt();
  return '<div class="inv-settings-section"><div class="inv-settings-title">GitHub Sync</div>' +
    '<div class="inv-form-row">' +
      '<div class="inv-form-group"><label class="inv-form-label" for="setGhOwner">Owner</label>' +

      '<div class="inv-form-group"><label class="inv-form-label" for="setGhRepo">Repo</label>' +
      '<input class="inv-form-input inv-mono" id="setGhRepo" value="' + escHtml(cfg.repo) + '" placeholder="sep-invoicing-data" autocomplete="off"></div>' +
    '</div>' +
    '<div class="inv-form-row">' +
      '<div class="inv-form-group"><label class="inv-form-label" for="setGhBranch">Branch</label>' +
      '<input class="inv-form-input inv-mono" id="setGhBranch" value="' + escHtml(cfg.branch) + '" placeholder="main" autocomplete="off"></div>' +
      '<div class="inv-form-group"><label class="inv-form-label" for="setGhPath">File path</label>' +
      '<input class="inv-form-input inv-mono" id="setGhPath" value="' + escHtml(cfg.path) + '" placeholder="sep-invoicing-data.json" autocomplete="off"></div>' +
    '</div>' +
    '<div class="inv-form-group"><label class="inv-form-label" for="setGhDevice">This device</label>' +
    '<input class="inv-form-input" id="setGhDevice" value="' + escHtml(cfg.deviceName) + '" placeholder="Office desktop" autocomplete="off">' +
    '<div class="inv-text-muted inv-storage-text">Named in the commit message, so the history says which device wrote each backup.</div></div>' +

    '<div class="inv-form-group"><label class="inv-form-label" for="setGhToken">Personal access token</label>' +
    '<div class="inv-api-key-wrap"><input class="inv-form-input inv-mono" id="setGhToken" type="password" value="' + escHtml(getGhToken()) + '" placeholder="github_pat_..." autocomplete="off">' +
    '<button class="inv-api-key-toggle" data-action="invToggleGhToken" type="button" aria-label="Show token">' +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>' +
    '<div class="inv-text-muted inv-storage-text">A fine-grained token with <strong>Contents: Read and write</strong> on one private repo is enough — nothing wider. It stays on this device and is never written into a JSON export. Anyone with access to this device can read it, so use a private repo and revoke the token if the device is lost.</div></div>' +

    '<label class="inv-check-row" for="setGhAuto">' +
    '<input type="checkbox" id="setGhAuto" class="inv-check"' + (cfg.autoPush ? ' checked' : '') + '>' +
    '<span>Back up automatically after changes</span></label>' +
    '<div class="inv-text-muted inv-storage-text inv-mb-8">Pushes about a minute after the last edit. Paused automatically if GitHub holds a copy this device has not seen.</div>' +

    '<div class="inv-form-row">' +
      '<button class="inv-btn inv-btn-ghost inv-btn-block" id="ghPushBtn" data-action="invGhPush">Push to GitHub</button>' +

    '</div>' +

/* Called from saveSettings() — the config has to land before a push is
   attempted, or the first push after setup goes to the previous repo. */
function saveGhSyncSettings() {
  var cfg = getGhConfig();
  var owner = document.getElementById('setGhOwner');
  var repo = document.getElementById('setGhRepo');
  var branch = document.getElementById('setGhBranch');
  var path = document.getElementById('setGhPath');
  var device = document.getElementById('setGhDevice');
  var token = document.getElementById('setGhToken');
  var auto = document.getElementById('setGhAuto');
  if (!owner) return;

  var nextOwner = owner.value.trim();
  var nextRepo = repo ? repo.value.trim() : cfg.repo;
  var nextPath = path ? path.value.trim() : cfg.path;
  var nextBranch = branch ? branch.value.trim() : cfg.branch;

  // Pointing at a different file makes the remembered SHA meaningless, and a
  // stale SHA would let the next push overwrite a file it never read.
  if (nextOwner !== cfg.owner || nextRepo !== cfg.repo || nextPath !== cfg.path || nextBranch !== cfg.branch) {
    cfg.sha = null;
  }

  cfg.owner = nextOwner;
  cfg.repo = nextRepo;
  cfg.path = nextPath || 'sep-invoicing-data.json';
  cfg.branch = nextBranch || 'main';
  if (device) cfg.deviceName = device.value.trim();
  if (auto) cfg.autoPush = !!auto.checked;
  setGhConfig(cfg);
  if (token) setGhToken(token.value.trim());
  _ghAutoBackoff = false;
}

/* ===== INVOICE REGISTER ===== */
var _regSelected = {};
var _regSelectMode = false;
var _regActiveInvId = null;

/* Unified sort accessor (Phase 8C) */
function getRegSortConfig() {
  if (_isDesktop && regFilter.desktopSort) return regFilter.desktopSort;
  return { col: 'date', dir: regFilter.regSortDir || 'desc' };
}

function getFilteredInvoices() {
  let list = [...S.invoices];
  if (regFilter.clientId) {
    const cid = parseInt(regFilter.clientId);
    list = list.filter(i => i.clientId === cid);
  }
  // A date range and a month are alternatives, never layered — whichever the
  // operator set last wins and the other is cleared, so there is no precedence
  // rule to remember. ISO dates compare lexically, so no parsing is needed.
  if (regFilter.dateFrom || regFilter.dateTo) {
    list = list.filter(function(i) {
      if (!i.date) return false;
      if (regFilter.dateFrom && i.date < regFilter.dateFrom) return false;
      if (regFilter.dateTo && i.date > regFilter.dateTo) return false;
      return true;
    });
  } else if (regFilter.month) {
    list = list.filter(i => i.date && i.date.startsWith(regFilter.month));
  }
  if (regFilter.search) {
    const q = regFilter.search.toLowerCase();
    list = list.filter(i =>
      (i.displayNumber || '').toLowerCase().includes(q) ||
      (i.clientName || '').toLowerCase().includes(q)
    );
  }
  if (regFilter.state) {
    if (regFilter.state === 'cancelled') {
      list = list.filter(i => i.status === 'cancelled');
    } else {
      list = list.filter(i => i.status === 'active' && getInvState(i) === regFilter.state);
    }
  }

  /* Desktop: multi-column sort via getRegSortConfig().
     Mobile: preserve existing createdAt sort (no behavioral change). */
  if (_isDesktop) {
    var sc = getRegSortConfig();
    var dir = sc.dir === 'asc' ? 1 : -1;
    list.sort(function(a, b) {
      var va, vb;
      switch (sc.col) {
        case 'client': va = (a.clientName || '').toLowerCase(); vb = (b.clientName || '').toLowerCase(); return va < vb ? -dir : va > vb ? dir : 0;
        case 'date': va = a.date || ''; vb = b.date || ''; return va < vb ? -dir : va > vb ? dir : 0;
        case 'taxable': return dir * ((a.taxableValue || 0) - (b.taxableValue || 0));
        case 'total': return dir * ((a.grandTotal || 0) - (b.grandTotal || 0));
        case 'state': {
          var so = { created: 0, dispatched: 1, delivered: 2, filed: 3 };
          va = a.status === 'cancelled' ? -1 : (so[getInvState(a)] || 0);
          vb = b.status === 'cancelled' ? -1 : (so[getInvState(b)] || 0);
          return dir * (va - vb);
        }
        default: va = a.date || ''; vb = b.date || ''; return va < vb ? -dir : va > vb ? dir : 0;
      }
    });
  } else {
    var sortDir = regFilter.regSortDir || 'desc';
    if (sortDir === 'asc') {
      list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    } else {
      list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    }
  }
  return list;
}

/* Read every register filter control into regFilter, in one place.
   Two event paths reached these fields with the same block of code copied into
   both, so a new filter had to be added twice or it silently did nothing on one
   of them.

   Driven by `change` only. These controls used to carry a data-action as well,
   which meant the click that OPENS a <select> ran this — and this re-renders
   the toolbar, replacing the element the dropdown was hanging off, so the list
   shut before an option could be picked. A select speaks through change; a
   click on one is not a choice. */
function captureRegFilters(changedId) {
  var cf = document.getElementById('regClientFilter');
  var mf = document.getElementById('regMonthFilter');
  var sf = document.getElementById('regStateFilter');
  var df = document.getElementById('regDateFrom');
  var dt = document.getElementById('regDateTo');
  if (cf) regFilter.clientId = cf.value;
  if (sf) regFilter.state = sf.value;
  if (mf) regFilter.month = mf.value;
  if (df) regFilter.dateFrom = df.value;
  if (dt) regFilter.dateTo = dt.value;

  // Month and range are alternatives. Setting one clears the other rather than
  // leaving both populated and one of them quietly ignored.
  if (changedId === 'regMonthFilter' && regFilter.month) {
    regFilter.dateFrom = ''; regFilter.dateTo = '';
  } else if ((changedId === 'regDateFrom' || changedId === 'regDateTo') &&
             (regFilter.dateFrom || regFilter.dateTo)) {
    regFilter.month = '';
  }

  // A selection made under one filter must not survive into another. The rows
  // become invisible but stay selected, and every bulk action still acts on
  // them — file, dispatch, certificates alike. Harmless while selecting meant
  // one tap per row; a hazard now that one tap selects the whole page.
  _regSelected = {};

  saveRegFilter();
  // The toolbar has to be rebuilt — the range's clear button, the scope note
  // and the select-all count all depend on the filters — but rebuilding it
  // throws away the control the operator is standing on, so focus is put back.
  var focusId = document.activeElement && document.activeElement.id;
  _regToolbarRendered = false;
  renderRegisterToolbar();
  _regToolbarRendered = true;
  if (focusId) {
    var back = document.getElementById(focusId);
    if (back) { try { back.focus(); } catch (err) {} }
  }
  _renderRegView();
  _renderRegSelBar();
}

/* Invoices in the current filter that a bulk action can actually act on.
   Cancelled ones are excluded: every bulk path already refuses them — state
   transitions skip them and certificates are declined — and on mobile their
   row renders no checkbox at all, so selecting one would be unclearable. */
function regSelectableInvoices() {
  return getFilteredInvoices().filter(function(i) { return i.status !== 'cancelled'; });
}

function toggleRegSelectAll() {
  var selectable = regSelectableInvoices();
  var allOn = selectable.length > 0 && selectable.every(function(i) { return _regSelected[i.id]; });
  _regSelected = {};
  if (!allOn) selectable.forEach(function(i) { _regSelected[i.id] = true; });
  _renderRegView();
  _renderRegSelBar();
  _regToolbarRendered = false;
  renderRegisterToolbar();
  _regToolbarRendered = true;
  showToast(allOn ? 'Selection cleared'
    : selectable.length + ' invoice' + (selectable.length !== 1 ? 's' : '') + ' selected');
}

    (sortDir === 'asc' ? 'Oldest first' : 'Newest first') +
    '</button>' +
    '<button class="inv-btn inv-btn-ghost inv-btn-sm' + (_regSelectMode ? ' inv-chip-active' : '') + '" data-action="invRegToggleSelect">' +
    (_regSelectMode ? 'Cancel select' : 'Select') +
    '</button>' +
    // Desktop always shows checkboxes; mobile only inside select mode, so the
    // control follows wherever ticking is actually possible.
    ((_isDesktop || _regSelectMode) && selectableCount > 0
      ? '<button class="inv-btn inv-btn-ghost inv-btn-sm" data-action="invRegSelectAll">' +
        (allSelected ? 'Clear selection' : 'Select all (' + selectableCount + ')') + '</button>'
      : '') +

    (cnCount > 0 ? '<span class="inv-numaudit-count">' + cnCount + '</span>' : '') +

    '<button class="inv-btn inv-btn-ghost inv-btn-sm" id="regNumberAudit" data-action="invShowNumberAudit">Number audit' +
    (unaccounted > 0 ? '<span class="inv-numaudit-count">' + unaccounted + '</span>' : '') +

      _regSelected = {};
      clearTimeout(_regSearchTimer);
      _regSearchTimer = setTimeout(function() { _renderRegView(); _renderRegSelBar(); }, 200);
    });
  }
}

function _restorePanelWidth(masterId, tabKey) {

function _initDragHandle(handleId, masterId, detailId, tabKey) {
  var handle = document.getElementById(handleId);
  if (!handle || handle.dataset.dragInit) return;
  handle.dataset.dragInit = 'true';

  function onStart(e) {
    e.preventDefault();
    var container = handle.parentElement;
    var startX = e.clientX || e.touches[0].clientX;
    _dragState = {
      startX: startX,
      containerW: container.offsetWidth,
      masterStart: document.getElementById(masterId).offsetWidth,
      masterId: masterId, tabKey: tabKey
    };
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  }

  handle.addEventListener('mousedown', onStart);
  handle.addEventListener('touchstart', onStart, { passive: false });
}

function renderRegisterTable() {
  var area = document.getElementById('regList');
  if (!area) return;

  if (!_regToolbarRendered) {
    renderRegisterToolbar();
    _regToolbarRendered = true;
  }

  var wrapper = document.getElementById('regMasterDetail');
  if (!wrapper) {
    // First render — build wrapper, init drag, restore width
    area.innerHTML =
      '<div class="inv-master-detail" id="regMasterDetail">' +
        '<div class="inv-master" id="regMaster"></div>' +
        '<div class="inv-drag-handle" id="regDragHandle"></div>' +
        '<div class="inv-detail" id="regDetail">' + _renderDetailEmpty() + '</div>' +
      '</div>';
    _initDragHandle('regDragHandle', 'regMaster', 'regDetail', 'pageRegister');
    _restorePanelWidth('regMaster', 'pageRegister');
  }

  // Re-render master content
  var master = document.getElementById('regMaster');
  if (!master) return;
  master.innerHTML = _buildRegisterTableHtml();

  // Detail panel validation: keep detail in sync with data changes
  if (_regActiveInvId) {
    var stillExists = S.invoices.find(function(i) { return i.id === _regActiveInvId; });
    if (!stillExists) {
      // Deleted — clear detail
      _regActiveInvId = null;
      var detail = document.getElementById('regDetail');
      if (detail) detail.innerHTML = _renderDetailEmpty();
    } else {
      // Check if active invoice is still in filtered set
      var filtered = getFilteredInvoices();
      var inFiltered = filtered.find(function(i) { return i.id === _regActiveInvId; });
      if (!inFiltered) {
        // Filtered out — clear detail
        _regActiveInvId = null;
        var detail2 = document.getElementById('regDetail');
        if (detail2) detail2.innerHTML = _renderDetailEmpty();
      } else {
        // Still visible — refresh detail content (skip master since we just rendered it)
        _renderRegDetail(_regActiveInvId, true);
      }
    }
  }

  _renderRegSelBar();
}

/* View dispatcher (Phase 8B) */
function _renderRegView() {
  _isDesktop ? renderRegisterTable() : renderRegisterList();
}

/* Backward-compat: renderRegister calls both */
function renderRegister() {
  if (_isDesktop) {
    renderRegisterTable();
    return;
  }
  _regToolbarRendered = false;
  renderRegisterToolbar();
  _regToolbarRendered = true;
  _renderRegView();
}

/* --- Register bulk selection (Phase 6b) --- */
function toggleRegSelectMode() {

  _regToolbarRendered = true;
  _renderRegView();

}

function toggleRegInv(invId) {

/* The register's current selection, in one place — three call sites used to
   re-derive it and a fourth would have made four. */
function _regSelectedIds() {
  return Object.keys(_regSelected).filter(function(k) { return _regSelected[k]; });
}

function _renderRegSelBar() {
  var bar = document.getElementById('regSelBar');
  if (!bar) return;
  var ids = _regSelectedIds();
  if (ids.length === 0 || (!_isDesktop && !_regSelectMode)) { bar.innerHTML = ''; return; }

  // Determine what state transitions are available
  var canDispatch = 0;
  var canDeliver = 0;
  var canFile = 0;
  ids.forEach(function(id) {
    var inv = S.invoices.find(function(i) { return i.id === id; });
    if (!inv || inv.status !== 'active') return;
    var st = getInvState(inv);
    if (st === 'created') canDispatch++;
    if (st === 'dispatched') canDeliver++;
    if (st === 'delivered') canFile++;
  });

  // Certificates go out with the dispatch, so the count is of what can actually
  // be certified — a cancelled invoice in the selection is not offered.
  var canCert = qcEligibleCount(ids);

  var btns = '';
  if (canDispatch > 0) btns += '<button class="inv-im-sel-btn" data-action="invRegBulkState" data-state="dispatched">Dispatch (' + canDispatch + ')</button>';
  if (canDeliver > 0) btns += '<button class="inv-im-sel-btn" data-action="invRegBulkState" data-state="delivered">Deliver (' + canDeliver + ')</button>';
  if (canFile > 0) btns += '<button class="inv-im-sel-btn" data-action="invRegBulkState" data-state="filed">File (' + canFile + ')</button>';
  if (canCert > 0) btns += '<button class="inv-im-sel-btn" data-action="invRegQualityCerts">Quality certs (' + canCert + ')</button>';
  // Offered whenever there is anything active in the selection. If the batch is
  // unusable — two customers in it, say — the click explains why rather than
  // the button silently not being there.
  if (ids.some(function(id) {
    var inv = S.invoices.find(function(i) { return i.id === id; });
    return inv && inv.status !== 'cancelled';
  })) btns += '<button class="inv-im-sel-btn" data-action="invRegCreditNote">Credit note</button>';

  bar.innerHTML = '<div class="inv-im-sel-bar">' +
    '<span class="inv-im-sel-count">' + ids.length + ' selected</span>' +
    '<div class="inv-items-sel-actions">' + btns + '</div></div>';
}

function regBulkSetState(targetState) {
  var ids = _regSelectedIds();
  var now = Date.now();
  var updated = 0;

  var stateOrder = { created: 0, dispatched: 1, delivered: 2, filed: 3 };
  var targetIdx = stateOrder[targetState];
  if (targetIdx == null) return;

  ids.forEach(function(id) {
    var inv = S.invoices.find(function(i) { return i.id === id; });
    if (!inv || inv.status !== 'active') return;
    var curState = getInvState(inv);
    var curIdx = stateOrder[curState];
    // Only advance by one step
    if (curIdx != null && curIdx + 1 === targetIdx) {
      inv.invoiceState = targetState;
      if (targetState === 'dispatched') inv.dispatchedAt = now;
      else if (targetState === 'delivered') inv.deliveredAt = now;
      else if (targetState === 'filed') inv.filedAt = now;
      updated++;
    }
  });

  if (updated > 0) {
    saveState();
    _regSelected = {};
    _renderRegView();
    _renderRegSelBar();
    showToast(updated + ' invoice' + (updated !== 1 ? 's' : '') + ' marked as ' + INV_STATE_LABELS[targetState]);
  }
}

function toggleRegSortDir() {
  regFilter.regSortDir = (regFilter.regSortDir || 'desc') === 'desc' ? 'asc' : 'desc';
  saveRegFilter();
  _regToolbarRendered = false;
  renderRegisterToolbar();
  _regToolbarRendered = true;
  _renderRegView();
}

/* Edit invoice — loads into Create Invoice in edit mode */
function editInvoice(invId) {
  const inv = S.invoices.find(i => i.id === invId);
  if (!inv) return;
  if (inv.status === 'cancelled') {
    showToast('Cancelled invoices cannot be edited', 'warning');
    return;
  }

  // Check cross-month warning
  const now = new Date();
  const curMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  const invMonth = inv.date ? inv.date.substring(0, 7) : '';
  let editToast = 'Editing ' + inv.displayNumber;
  if (invMonth && invMonth !== curMonth) {
    const monthNames = ['','January','February','March','April','May','June','July','August','September','October','November','December'];
    const parts = invMonth.split('-');
    const mName = monthNames[parseInt(parts[1])] + ' ' + parts[0];
    editToast += ' (' + mName + ' — may affect filed returns)';
  }

  // Load into form
  invoiceForm = {
    clientId: inv.clientId,
    date: inv.date,
    items: inv.items.map(i => ({...i, _override: false, _label: ''})),
    poNumber: inv.poNumber || '',
    poDate: inv.poDate || localDateStr(),
    challanNo: inv.challanNo || '',
    challanDate: inv.challanDate || localDateStr(),
    despatchDate: inv.despatchDate || localDateStr(),
    transport: inv.transport || '',
    eWayBill: inv.eWayBill || '',
    remarks: inv.remarks || '',
    editingId: inv.id
  };
  closeOverlay();
  _navReturnTab = 'pageRegister';
  renderCreateForm();
  switchTab('pageCreate');
  showToast(editToast, 'warning');
}

  const scrim = document.createElement('div');
