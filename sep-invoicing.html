function renderChallanClientResults(query) {
  var res = document.getElementById('imChallanClientResults');
  var input = document.getElementById('imChallanClientSearch');
  if (!res) return;
  var q = (query || '').trim().toLowerCase();
  var matches = q.length < 1 ? [] : S.clients.filter(function(c) {
    return c.isActive && (c.name.toLowerCase().includes(q) || (c.gstin || '').includes(q));
  }).slice(0, 8);

  acReset();
  if (matches.length === 0) {
    res.className = 'inv-search-results inv-hidden';
    res.innerHTML = '';
    if (input) input.setAttribute('aria-expanded', 'false');
    return;
  }
  res.className = 'inv-search-results';
  res.innerHTML = matches.map(function(c, i) {
    return '<div class="inv-search-item" role="option" id="imClientOpt' + i + '" data-action="invSelectChallanClient" data-id="' + c.id + '">' +
      '<div><div class="inv-client-name">' + escHtml(c.name) + '</div>' +
      '<div class="inv-client-meta">' + escHtml(c.gstin || '') + '</div></div></div>';
  }).join('');
  if (input) input.setAttribute('aria-expanded', 'true');
}

function captureChallanFields() {
  if (!_challanForm) return;
  var cn = document.getElementById('imChallanNo');
  var cd = document.getElementById('imChallanDate');
  var vn = document.getElementById('imVehicleNo');
  if (cn) _challanForm.challanNo = cn.value.trim();
  if (cd) _challanForm.challanDate = cd.value;
  if (vn) _challanForm.vehicleNo = vn.value.trim();
}

function selectChallanClient(clientId) {
  if (!_challanForm) return;
  captureChallanFields();
  _challanForm.clientId = clientId;
  // Picking the client is the first step; Challan No is the next thing typed.
  _challanFocusNext = { k: 'challanNo', sel: null };
  var client = S.clients.find(function(c) { return c.id === clientId; });
  // Auto-fill rate on existing items
  if (client) {
    _challanForm.items.forEach(function(item) {
      var rateInfo = getLineItemRate(client, _challanForm.challanDate || localDateStr(), item.partNumber);
      if (rateInfo._override) {
        item.rate = rateInfo.rate;
      } else {
        item.rate = rateInfo.ratePerKg || 0;
      }
      recalcChallanLine(item, client);
    });
  }
  renderAddChallanForm();
}

function recalcChallanLine(item, client) {
  if (!client) { item.amount = gstRound((item.qty || 0) * (item.rate || 0)); return; }
  if (client.billingMode === 'piece' && item.unit === 'NOS') {
    // Amount entered directly for NOS piece mode
    if (item.qty > 0 && item.amount > 0) {
      item.rate = gstRound(item.amount / item.qty);
    }
  } else {
    item.amount = gstRound((item.qty || 0) * (item.rate || 0));
  }
}

function addChallanLine() {
  if (!_challanForm) return;
  captureChallanFields();
  var client = _challanForm.clientId ? S.clients.find(function(c) { return c.id === _challanForm.clientId; }) : null;
  var item = { partNumber: '', desc: '', hsn: '998873', unit: 'KG', qty: 0, rate: 0, amount: 0, nosQty: null };
  if (client) {
    var rateInfo = getLineItemRate(client, _challanForm.challanDate || localDateStr(), '');
    item.rate = rateInfo.ratePerKg || 0;
  }
  _challanForm.items.push(item);
  _challanFocusNext = { k: 'part-' + (_challanForm.items.length - 1), sel: null };
  renderAddChallanForm();
}

function removeChallanLine(idx) {
  if (!_challanForm) return;
  captureChallanFields();
  _challanForm.items.splice(idx, 1);
  // Land on the line that slid into this slot, or the one above it if the
  // removed line was last. With no lines left there is nothing to focus but
  // the button that makes one.
  if (_challanForm.items.length === 0) {
    _challanFocusNext = { k: 'addline', sel: null };
  } else {
    _challanFocusNext = { k: 'part-' + Math.min(idx, _challanForm.items.length - 1), sel: null };
  }
  renderAddChallanForm();
}

function saveChallan() {
  if (!_challanForm) return;
  captureChallanFields();
  if (!_challanForm.clientId) { showToast('Select a client', 'error'); return; }
  if (_challanForm.items.length === 0) { showToast('Add at least one line item', 'error'); return; }

  var client = S.clients.find(function(c) { return c.id === _challanForm.clientId; });
  if (!client) return;

  // Duplicate guard: warn once, then let the operator decide. Covers both entry
  // paths — the scanner fills this same form and comes through here.
  if (!_challanForm._dupeAcked) {
    var dupes = findChallanDuplicates(_challanForm, _challanForm._editingId || null);
    if (dupes.any) { showChallanDuplicateWarning(dupes); return; }
  }

  var now = Date.now();
  // Stamped so a later audit can tell an accepted duplicate from an unseen one.
  var dupeAck = _challanForm._dupeAcked
    ? { at: now, matchedIds: _challanForm._dupeMatchedIds || [] }
    : null;

  if (_challanForm._editingId) {
    // Phase 5: Edit mode — update existing entry
    var existing = (S.incomingMaterial || []).find(function(m) { return m.id === _challanForm._editingId; });
    if (!existing) { showToast('Challan not found', 'error'); return; }
    existing.challanNo = _challanForm.challanNo;
    existing.challanDate = _challanForm.challanDate;
    existing.clientId = client.id;
    existing.clientName = client.name;
    existing.vehicleNo = _challanForm.vehicleNo;
    existing.receivedDate = _challanForm.challanDate || localDateStr();
    existing.notes = _challanForm.notes || '';
    if (dupeAck) existing.dupeAck = dupeAck;
    existing.items = _challanForm.items.map(function(item, idx) {
      return {
        id: existing.id + '-' + idx,
        partNumber: item.partNumber,
        desc: item.desc || item.partNumber,
        hsn: item.hsn || '998873',
        unit: item.unit || 'KG',
        qty: item.qty || 0,
        rate: item.rate || 0,
        amount: item.amount || 0,
        nosQty: item.nosQty || null,
        invoiced: false,
        invoiceId: null
      };
    });
    saveVehicleToClient(_challanForm.clientId, _challanForm.vehicleNo);
    saveState();
    _challanForm = null;
    cancelAddChallanUI();
    _imToolbarRendered = false;
    renderIMToolbar();
    _imToolbarRendered = true;
    _renderIMView();
    showToast('Challan updated (' + existing.items.length + ' item' + (existing.items.length > 1 ? 's' : '') + ')');
    return;
  }

  // New challan
  var imId = 'IM-' + now;
  var entry = {
    id: imId,
    challanNo: _challanForm.challanNo,
    challanDate: _challanForm.challanDate,
    clientId: client.id,
    clientName: client.name,
    vehicleNo: _challanForm.vehicleNo,
    items: _challanForm.items.map(function(item, idx) {
      return {
        id: imId + '-' + idx,
        partNumber: item.partNumber,
        desc: item.desc || item.partNumber,
        hsn: item.hsn || '998873',
        unit: item.unit || 'KG',
        qty: item.qty || 0,
        rate: item.rate || 0,
        amount: item.amount || 0,
        nosQty: item.nosQty || null,
        invoiced: false,
        invoiceId: null
      };
    }),
    receivedDate: _challanForm.challanDate || localDateStr(),
    notes: '',
    createdAt: now,
    dupeAck: dupeAck
  };

  S.incomingMaterial.push(entry);
  saveVehicleToClient(_challanForm.clientId, _challanForm.vehicleNo);
  saveState();

  _challanForm = null;
  cancelAddChallanUI();
  _imToolbarRendered = false;
  renderIMToolbar();
  _imToolbarRendered = true;
  _renderIMView();
  showToast('Challan saved (' + entry.items.length + ' item' + (entry.items.length > 1 ? 's' : '') + ')');
}

function deleteChallan(imId) {
  var im = (S.incomingMaterial || []).find(function(m) { return m.id === imId; });
  if (!im) return;
  // Check if any items are invoiced
  var invoicedCount = im.items.filter(function(it) { return it.invoiced; }).length;
  if (invoicedCount > 0) {
    showToast('Cannot delete: ' + invoicedCount + ' item' + (invoicedCount > 1 ? 's' : '') + ' already invoiced', 'warning');
    return;
  }
  // Tier 1 confirm
  if (!confirm('Delete this challan?')) return;
  var idx = S.incomingMaterial.indexOf(im);
  if (idx > -1) S.incomingMaterial.splice(idx, 1);

  delete _imExpanded[imId];
  if (_imActiveChallanId === imId) _imActiveChallanId = null;
  im.items.forEach(function(it) { delete _imSelected[it.id]; });
  saveState();
  _imToolbarRendered = false;
  renderIMToolbar();
  _imToolbarRendered = true;
  _renderIMView();
  showToast('Challan deleted');
}

/* ===== IM DUPLICATE GUARD ===== */

/*
 * Seven duplicate receipt events went into the books across FY27 unchallenged:
 * 973.75 kg + 826 NOS of phantom receipts, four of which propagated into
 * customer invoices (Dilip ch 47, General ch 932, Khurana ch 202, Dorabji
 * ch 146). Nothing in the app said a word at either end.
 *
 * The obvious key — (client, challanNo, challanDate) — misses two of those
 * seven. One copy of Dorabji ch 146 carried a blank challanNo, and Dilip ch 47
 * carried the same 282.70 kg under an aliased part number. So the fingerprint
 * is content-based instead: client + challan date + the multiset of line
 * quantities. Part names and challan numbers are what the operator retypes;
 * the weights are what the material actually was.
 *
 * Warning, not hard block. Split challans against one consignment (702/703)
 * are legitimate and can look identical, so the judgement stays with the
 * operator — but the acknowledgement is stamped on the entry, so a later audit
 * can tell a duplicate somebody accepted from one nobody was ever shown.
 */

/* Multiset of line quantities, order-independent. */
function imQtySignature(items) {
  var parts = (items || []).map(function(it) {
    var qty = Math.round((Number(it.qty) || 0) * 1000) / 1000;
    var nos = Math.round(Number(it.nosQty) || 0);
    return (it.unit || 'KG') + ':' + qty + (nos > 0 ? '/' + nos : '');
  });
  parts.sort();
  return parts.join('|');
}

function imFingerprint(clientId, challanDate, items) {
  return clientId + '@' + (challanDate || '') + '#' + imQtySignature(items);
}

function imChallanFingerprint(im) {
  return imFingerprint(im.clientId, im.challanDate, im.items);
}

/* A challan of all-zero quantities fingerprints against every other empty one.
   Those matches carry no information, so they are not raised. */
function imHasQuantity(items) {
  return (items || []).some(function(it) {
    return (Number(it.qty) || 0) > 0 || (Number(it.nosQty) || 0) > 0;
  });
}

/*
 * Matches for one candidate challan against everything already stored.
 *   content — same client, same date, same quantity multiset
 *   number  — same client, same non-blank challan number (any date, so a
 *             re-entry with the date corrected still surfaces)
 *   blankNo — the candidate has no challan number of its own
 */
function findChallanDuplicates(candidate, excludeId) {
  var out = { content: [], number: [], blankNo: false, any: false };
  if (!candidate || !candidate.clientId) return out;

  var challanNo = (candidate.challanNo || '').trim();
  out.blankNo = challanNo === '';

  var fp = imFingerprint(candidate.clientId, candidate.challanDate, candidate.items);
  var scorable = imHasQuantity(candidate.items);
  var cnKey = challanNo.toLowerCase();

  (S.incomingMaterial || []).forEach(function(im) {
    if (im.id === excludeId) return;
    if (im.clientId !== candidate.clientId) return;
    if (scorable && imChallanFingerprint(im) === fp) {
      out.content.push(im);
      return;
    }
    if (cnKey && (im.challanNo || '').trim().toLowerCase() === cnKey) {
      out.number.push(im);
    }
  });

  out.any = out.content.length > 0 || out.number.length > 0 || out.blankNo;
  return out;
}

/* ===== BILLING VERDICT ===== */

/*
 * A duplicate receipt sometimes propagates to a bill and sometimes does not —
 * ch 248 and ch 110 collapsed into a single invoice and cost nothing, while
 * ch 47 and ch 932 became real output tax. The collection-level check cannot
 * tell those apart; following the line items into `invoices` can.
 */
function imDuplicateVerdict(group) {
  var invoiceIds = {};
  var invoicedCopies = 0;
  group.forEach(function(im) {
    var hit = false;
    im.items.forEach(function(it) {
      if (it.invoiced && it.invoiceId) { invoiceIds[it.invoiceId] = true; hit = true; }
      else if (it.invoiced) { hit = true; }
    });
    if (hit) invoicedCopies++;
  });
  var distinct = Object.keys(invoiceIds).length;
  if (distinct > 1) return { key: 'billed', label: 'Billed twice', cls: 'inv-dupe-verdict-billed' };
  if (invoicedCopies === 0) return { key: 'open', label: 'Unbilled — still preventable', cls: 'inv-dupe-verdict-open' };
  return { key: 'collapsed', label: 'Collapsed into one invoice', cls: 'inv-dupe-verdict-clean' };
}

/* Value of the surplus copies: everything beyond the first. */
function imDuplicateExposure(group) {
  var totals = group.map(function(im) {
    return im.items.reduce(function(s, it) { return s + (Number(it.amount) || 0); }, 0);
  });
  var all = totals.reduce(function(s, t) { return s + t; }, 0);
  return gstRound(all - Math.max.apply(null, totals));
}

/* ===== WHOLE-COLLECTION SCAN ===== */

function imDuplicateGroups() {
  var buckets = {};
  (S.incomingMaterial || []).forEach(function(im) {
    if (!imHasQuantity(im.items)) return;
    var fp = imChallanFingerprint(im);
    if (!buckets[fp]) buckets[fp] = [];
    buckets[fp].push(im);
  });
  var groups = [];
  Object.keys(buckets).forEach(function(fp) {
    if (buckets[fp].length > 1) {
      groups.push(buckets[fp].slice().sort(function(a, b) {
        return (a.createdAt || 0) - (b.createdAt || 0);
      }));
    }
  });
  groups.sort(function(a, b) {
    return (b[0].challanDate || '').localeCompare(a[0].challanDate || '');
  });
  return groups;
}

function imBlankChallanRecords() {
  return (S.incomingMaterial || []).filter(function(im) {
    return !(im.challanNo || '').trim();
  }).sort(function(a, b) {
    return (b.challanDate || '').localeCompare(a.challanDate || '');
  });
}

function imDuplicateGroupCount() {
  return imDuplicateGroups().length;
}

/* ===== CHALLAN SCANNER (Phase 4 — AI Vision) ===== */
var _scanExtractionPrompt = 'You are parsing an Indian delivery challan image for a zinc electroplating job work factory.\n\nExtract ALL data into this exact JSON structure. Return ONLY valid JSON, no markdown, no backticks, no explanation.\n\n{"challanNo":"string - just digits, strip leading zeros and FY suffix like /26-27","challanDate":"YYYY-MM-DD format","clientName":"string","vehicleNo":"string","items":[{"partNumber":"string","desc":"string","unit":"KG or NOS","qty":0,"nosQty":null,"rate":0,"amount":0}]}\n\nRULES for Dorabji Auto challans (printed white paper with DELIVERY CHALLAN header):\n- Qty column = NOS count -> put in nosQty\n- Wt.(Kgs.) column = weight in KG -> put in qty\n- Rate and Total columns = Dorabji internal pricing -> IGNORE\n- Set rate to 13, amount = qty * 13, unit = KG\n- Strip TRIVALENT YELLOW, FE, DO from description\n\nRULES for SSS Mehta challans (pink handwritten paper):\n- Qty = NOS count -> put in both qty AND nosQty\n- Amount column -> put in amount, Rate = amount/qty\n- unit = NOS\n\nFor other clients: KG billing, extract weight as qty.\nChallan number: just numeric part e.g. 0041/26-27 -> 41';

var _scanClientMap = {
  'DORABJI': {id:1, name:'DORABJI AUTO', rate:13},
  'SSSMEHTA': {id:2, name:'SSSMEHTA ENTERPRISES AND INDUSTRIES PVT LTD', rate:5.40},
  'SAMARTH': {id:3, name:'SAMARTH ENGG. CO. PVT. LTD.', rate:14.50},
  'HIGHCO': {id:4, name:'HIGHCO ENGINEERS PVT. LTD.', rate:11},
  'PARAKH': {id:5, name:'PARAKH INDUSTRIES', rate:10},
  'PAWAN': {id:6, name:'PAWAN AUTO P LTD', rate:10.50},
  'OM SHEET': {id:7, name:'OM SHEET METALS', rate:14.25},
  'GENERAL': {id:8, name:'GENERAL ENGINEERING CORPORATION', rate:14.25},
  'DILIP': {id:9, name:'DILIP PRESS METAL & AGROTECH P LTD', rate:13.50},
  'KHURANA': {id:13, name:'KHURANA INDUSTRIES', rate:14.25}
};

function _scanMatchClient(name) {
  if (!name) return null;
  var upper = name.toUpperCase();
  for (var key in _scanClientMap) {
    if (upper.indexOf(key) >= 0) return _scanClientMap[key];
  }
  return null;
}

function scanChallan() {
  var apiKey = getApiKey();
  if (!apiKey) {
    showToast('Set your Gemini API key in Settings first (free from aistudio.google.com)', 'warning');
    return;
  }
  var inp = document.getElementById('scanFileInput');
  if (!inp) return;
  inp.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    inp.value = '';
    _processScanImage(file, apiKey);
  };
  inp.click();
}

function _processScanImage(file, apiKey) {
  // Show processing overlay
  var proc = document.getElementById('scanProcessing');
  if (proc) {
    proc.innerHTML = '<div class="inv-scan-processing"><div class="inv-scan-processing-card">' +
      '<div class="inv-scan-spinner"></div>' +
      '<div class="inv-scan-processing-text">Reading challan</div>' +
      '<div class="inv-scan-processing-sub">Gemini is extracting the data</div></div></div>';
  }

  var reader = new FileReader();
  reader.onload = function(ev) {
    var base64 = ev.target.result.split(',')[1];
    var mediaType = file.type || 'image/jpeg';

    fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(apiKey), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { inline_data: { mime_type: mediaType, data: base64 } },
            { text: _scanExtractionPrompt }
          ]
        }]
      })
    })
    .then(function(resp) { return resp.json(); })
    .then(function(data) {
      if (proc) proc.innerHTML = '';
      if (data.error) {
        showToast('API error: ' + (data.error.message || 'Unknown'), 'error');
        return;
      }
      // Extract text from Gemini response
      var text = '';
      try {
        var parts = data.candidates[0].content.parts;
        for (var p = 0; p < parts.length; p++) {
          if (parts[p].text) text += parts[p].text;
        }
      } catch(ex) {
        showToast('No response from Gemini', 'error');
        return;
      }
      var clean = text.replace(/```json|```/g, '').trim();
      var parsed;
      try { parsed = JSON.parse(clean); } catch(err) {
        showToast('Failed to parse response', 'error');
        return;
      }
      _applyScanResult(parsed);
    })
    .catch(function(err) {
      if (proc) proc.innerHTML = '';
      showToast('Scan failed: ' + err.message, 'error');
    });
  };
  reader.readAsDataURL(file);
}

function _applyScanResult(parsed) {
  // Match client
  var client = _scanMatchClient(parsed.clientName);
  if (client) {
    parsed.clientId = client.id;
    parsed.clientName = client.name;
    (parsed.items || []).forEach(function(item) {
      if (item.unit === 'KG' && client.rate) {
        item.rate = client.rate;
        item.amount = gstRound((item.qty || 0) * client.rate);
      }
    });
  }

  // Pre-fill the Add Challan form
  _challanForm = {
    clientId: parsed.clientId || null,
    challanNo: parsed.challanNo || '',
    challanDate: parsed.challanDate || localDateStr(),
    vehicleNo: parsed.vehicleNo || '',
    items: (parsed.items || []).map(function(item) {
      return {
        partNumber: item.partNumber || '',
        desc: item.desc || item.partNumber || '',
        hsn: '998873',
        unit: item.unit || 'KG',
        qty: item.qty || 0,
        rate: item.rate || 0,
        amount: item.amount || 0,
        nosQty: item.nosQty || null
      };
    }),
    notes: ''
  };

  if (_challanForm.items.length === 0) {
    _challanForm.items.push({partNumber:'', desc:'', hsn:'998873', unit:'KG', qty:0, rate:0, amount:0, nosQty:null});
  }

  renderAddChallanForm();
  showToast('Challan scanned: ' + (parsed.items || []).length + ' item' + ((parsed.items || []).length !== 1 ? 's' : '') + ' found');
}

    case 'invStatsJumpIM': {
      closeOverlay();
      _imFilter.clientId = btn.dataset.clientId;
      _imToolbarRendered = false;
      switchTab('pageIM');
      break;
    }
    // Phase 7: History navigation
    case 'invHistoryJumpInvoice': {
      var inv = S.invoices.find(function(i) { return i.id === btn.dataset.id; });
      if (!inv) { showToast('Invoice not found', 'warning'); break; }
      regFilter.clientId = '';
      regFilter.search = inv.displayNumber || '';
      regFilter.state = '';
      saveRegFilter();
      _tabDirty.register = true;
      _regToolbarRendered = false;
      switchTab('pageRegister');
      break;
    }
    case 'invHistoryJumpChallan': {
      var imId = btn.dataset.id;
      var im = (S.incomingMaterial || []).find(function(c) { return c.id === imId; });
      if (!im) { showToast('Challan not found', 'warning'); break; }
      _imFilter.clientId = String(im.clientId);
      _imToolbarRendered = false;
      switchTab('pageIM');
      setTimeout(function() {
        var hdr = document.querySelector('[data-action="invToggleIM"][data-id="' + imId + '"]');
        var card = hdr ? hdr.closest('.inv-im-challan') : null;
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 100);
      break;
    }
    // Phase 7: History load more
    case 'invHistoryLoadMore': _historyShowCount += 50; renderHistory(); break;
    case 'invHistoryType': _historyType = btn.dataset.type; _historyShowCount = 50; renderHistory(); break;
    case 'invHistoryExport': exportHistoryCSV(); break;
    // Phase 4: Challan Scanner
    case 'invScanChallan': scanChallan(); break;
    case 'invToggleApiKey': {
      var akEl = document.getElementById('setApiKey');
      if (akEl) akEl.type = akEl.type === 'password' ? 'text' : 'password';
      break;
    }
    case 'invToggleMetalsKey': {
      var mkEl = document.getElementById('setMetalsKey');
      if (mkEl) mkEl.type = mkEl.type === 'password' ? 'text' : 'password';
      break;
    }
    case 'invRefreshZinc': refreshZincRate(); break;
    // GitHub sync
    case 'invGhPush': ghPush(); break;
    case 'invGhPull': ghPull(); break;
    case 'invToggleGhToken': {
      var gtEl = document.getElementById('setGhToken');
      if (gtEl) gtEl.type = gtEl.type === 'password' ? 'text' : 'password';
      break;
    }
    // Phase 6: Items Master
    case 'invSwitchSubView': setItemsSubView(btn.dataset.view); renderClientsPage(); break;
    case 'invEditItem': openItemEdit(parseInt(btn.dataset.id)); break;
    case 'invAddItem': openItemAdd(); break;
    case 'invSaveItem': saveItem(parseInt(btn.dataset.id), btn.dataset.mode); break;
    case 'invDeleteItem': deleteItem(parseInt(btn.dataset.id)); break;
    case 'invOpenMergeTool': openMergeTool(); break;
    case 'invMergeGroup': mergeGroup(parseInt(btn.dataset.group)); break;
    case 'invMergeConfirm': confirmMerge(parseInt(btn.dataset.group), parseInt(btn.dataset.primary)); break;
    case 'invMergeCancelPreview': cancelMergePreview(parseInt(btn.dataset.group)); break;
    case 'invCalcWeights': calculateStdWeights(); break;
    case 'invOpenWeightEntry': openWeightEntry(); break;
    case 'invSaveWeights': saveWeights(); break;
    case 'invDeriveWeights': deriveWeightsFromRates(); break;
    case 'invFilterNoWeight': {
      var curFilter = getItemsFilter();
      regFilter.itemsFilter = curFilter === 'no-weight' ? 'all' : 'no-weight';
      saveRegFilter();
      _itemsRendered = 0;
      renderClientsPage();
      break;
    }
    case 'invFilterUnused': {
      var curFilter2 = getItemsFilter();
      regFilter.itemsFilter = curFilter2 === 'unused' ? 'all' : 'unused';
      saveRegFilter();
      _itemsRendered = 0;
      renderClientsPage();
      break;
    }
    case 'invSelectAllUnused': selectAllUnused(); break;
    case 'invToggleItemSelect': e.stopPropagation(); toggleItemSelect(parseInt(btn.dataset.id)); break;
    case 'invClearItemSelection': clearItemSelection(); break;
    case 'invBatchDeleteItems': batchDeleteItems(); break;
    case 'invLoadMoreItems': _renderItemsList(); break;
    case 'invItemsSort': {
      var sortEl = document.getElementById('itemsSort');
      if (sortEl) { regFilter.itemsSort = sortEl.value; saveRegFilter(); _itemsRendered = 0; _renderItemsList(); }
      break;
    }
    // Phase 8E: Clients/Items desktop row selection
    case 'invSelectClientRow': _renderClientDetail(parseInt(btn.dataset.id)); break;
    case 'invSelectItemRow': _renderItemDetail(parseInt(btn.dataset.id)); break;
    // Phase 6b: Register bulk operations
    case 'invRegToggleSort': toggleRegSortDir(); break;
    case 'invRegToggleSelect': toggleRegSelectMode(); break;
    case 'invRegToggleInv': e.stopPropagation(); toggleRegInv(btn.dataset.id); break;
    case 'invRegBulkState': regBulkSetState(btn.dataset.state); break;
    // Phase 8C: Desktop table interactions
    case 'invSelectRegRow': _renderRegDetail(btn.dataset.id); break;
    case 'invDesktopSort': {
      if (!regFilter.desktopSort) regFilter.desktopSort = { col: 'date', dir: 'desc' };
      if (regFilter.desktopSort.col === btn.dataset.col) {
        regFilter.desktopSort.dir = regFilter.desktopSort.dir === 'desc' ? 'asc' : 'desc';
      } else {
        regFilter.desktopSort = { col: btn.dataset.col, dir: 'desc' };
      }
      saveRegFilter();
      _renderRegView();
      break;
    }
    // Phase 8D: IM desktop table interactions
    case 'invSelectIMRow': _renderIMDetail(btn.dataset.id); break;
    case 'invDesktopIMSort': {
      if (!_imFilter.desktopSort) _imFilter.desktopSort = { col: 'date', dir: 'desc' };
      if (_imFilter.desktopSort.col === btn.dataset.col) {
        _imFilter.desktopSort.dir = _imFilter.desktopSort.dir === 'desc' ? 'asc' : 'desc';
      } else {
        _imFilter.desktopSort = { col: btn.dataset.col, dir: 'desc' };
      }
      _renderIMView();
      break;
    }
  }
});

/* Capture optional fields from DOM into invoiceForm before any re-render */
function captureOptionalFields() {
  const cn = document.getElementById('invChallanNo');
  const cd = document.getElementById('invChallanDate');
  const rm = document.getElementById('invRemarks');
  const tr = document.getElementById('invTransport');
  const po = document.getElementById('invPONumber');
  const pd = document.getElementById('invPODate');
  const dd = document.getElementById('invDespatchDate');
  const dt = document.getElementById('invDate');

/* Update totals section only (no full re-render) */
function updateTotalsDisplay() {
  const container = document.getElementById('invTotalsArea');
  if (!container) return;
  const client = invoiceForm.clientId ? S.clients.find(c => c.id === invoiceForm.clientId) : null;
  if (invoiceForm.items.length === 0) { container.innerHTML = ''; return; }
  const taxable = gstRound(invoiceForm.items.reduce((s,i) => s + (i.amount || 0), 0));
  const gstType = client ? client.gstType : 'intra';
  const cgst = gstType === 'intra' ? gstRound(taxable * 9 / 100) : 0;
  const sgst = gstType === 'intra' ? gstRound(taxable * 9 / 100) : 0;
  const igst = gstType === 'inter' ? gstRound(taxable * 18 / 100) : 0;
  const grand = gstRound(taxable + cgst + sgst + igst);
  let h = '<div class="inv-totals"><div class="inv-total-row"><span class="inv-total-label">Taxable Value</span><span class="inv-total-value">' + formatCurrency(taxable) + '</span></div>';
  if (gstType === 'intra') {
    h += '<div class="inv-total-row"><span class="inv-total-label">CGST @ 9%</span><span class="inv-total-value">' + formatCurrency(cgst) + '</span></div>' +
      '<div class="inv-total-row"><span class="inv-total-label">SGST @ 9%</span><span class="inv-total-value">' + formatCurrency(sgst) + '</span></div>';
  } else {
    h += '<div class="inv-total-row"><span class="inv-total-label">IGST @ 18%</span><span class="inv-total-value">' + formatCurrency(igst) + '</span></div>';
  }
  h += '<div class="inv-total-row inv-total-row-grand"><span class="inv-total-label">Grand Total</span><span class="inv-total-grand">' + formatCurrency(grand) + '</span></div></div>';
  container.innerHTML = h;
  // Update validation state
  const errors = validateInvoice();
  const errArea = document.getElementById('invErrorsArea');
  if (errArea) errArea.innerHTML = errors.length > 0 ? errors.map(e => '<div class="inv-error">' + escHtml(e) + '</div>').join('') : '';
  const saveBtn = document.getElementById('invSaveBtn');
  if (saveBtn) saveBtn.disabled = errors.length > 0;
}

document.addEventListener('change', function(e) {
  const el = e.target.closest('[data-action="invUpdateLine"]');
  if (el) {
    const idx = parseInt(el.dataset.idx);
    const field = el.dataset.field;
    const item = invoiceForm.items[idx];
    if (!item) return;
    const client = invoiceForm.clientId ? S.clients.find(c => c.id === invoiceForm.clientId) : null;
    if (field === 'unit') {
      item.unit = el.value;
      // Piece mode: switching to NOS means amount is user-entered, rate is back-calculated
      if (client && client.billingMode === 'piece' && el.value === 'NOS') {
        item.rate = 0;
        item.amount = 0;
      }
      recalcLineItem(item, client);
      captureOptionalFields();
      renderCreateForm();
    }
  }
  if (e.target.id === 'invDate') {
    invoiceForm.date = e.target.value;
  }
  // Register filters — one capture path, so a new filter control cannot end up
  // wired to the click delegate and not to this one.
  if (e.target.id === 'regClientFilter' || e.target.id === 'regMonthFilter' ||
      e.target.id === 'regStateFilter' || e.target.id === 'regDateFrom' || e.target.id === 'regDateTo') {
    captureRegFilters(e.target.id);
  }
  // IM filters
  if (e.target.id === 'imClientFilter' || e.target.id === 'imStatusFilter') {
    captureIMFilters();
  }
  // Attendance. A <select> speaks through change, never click — and the date
  // input re-renders because the date is what the whole view is showing.
  if (e.target.id === 'attDate') {
    attSetDate(e.target.value);
    return;
  }
  // Area decides whether those hours are plating cost or overhead, so the
  // breakdown below has to move with it. Safe on `change` — the native picker
  // has already closed by the time this fires; it is `click` that would shut it.
  if (e.target.hasAttribute && e.target.hasAttribute('data-att-area')) {
    setAttArea(parseInt(e.target.dataset.id, 10), e.target.value);
    renderAttendance();
    return;
  }
  if (e.target.hasAttribute && e.target.hasAttribute('data-att-extra-area')) {
    setAttExtraArea(parseInt(e.target.dataset.idx, 10), e.target.value);
    renderAttendance();
    return;
  }
  if (e.target.hasAttribute && e.target.hasAttribute('data-att-ot')) {
    setAttOt(parseInt(e.target.dataset.id, 10), e.target.value);
    renderAttendance();
    return;
  }
  if (e.target.hasAttribute && e.target.hasAttribute('data-att-hours')) {
    setAttHours(parseInt(e.target.dataset.id, 10), e.target.value);
    renderAttendance();
    return;
  }
  if (e.target.hasAttribute && e.target.hasAttribute('data-att-extra-hours')) {
    setAttExtraHours(parseInt(e.target.dataset.idx, 10), e.target.value);
    renderAttendance();
    return;
  }
  // Client performance: which account is under the lens
  if (e.target.id === 'cpClientSelect') {
    setPerfClientId(e.target.value);
    renderClientsPage();
    return;
  }
  // Phase 6: Items sort
  if (e.target.id === 'itemsSort') {
    regFilter.itemsSort = e.target.value;
    saveRegFilter();
    _itemsRendered = 0;
    _renderItemsList();
  }
  // Phase 7: History filter changes (client + date range)
  if (e.target.id === 'historyClientFilter') {
    _historyClientFilter = e.target.value;
    _historyShowCount = 50;
    renderHistory();
  }
  if (e.target.id === 'historyDateFrom') {
    _historyDateFrom = e.target.value;
    _historyShowCount = 50;
    renderHistory();
  }
  if (e.target.id === 'historyDateTo') {
    _historyDateTo = e.target.value;
    _historyShowCount = 50;
    renderHistory();
  }
  // Phase 4: IM challan line unit change
  const challanLineEl = e.target.closest('[data-action="invUpdateChallanLine"]');
  if (challanLineEl && challanLineEl.dataset.field === 'unit' && _challanForm) {
    const cidx = parseInt(challanLineEl.dataset.idx);
    const citem = _challanForm.items[cidx];
    if (citem) {
      citem.unit = challanLineEl.value;
      var cclient = _challanForm.clientId ? S.clients.find(function(c) { return c.id === _challanForm.clientId; }) : null;
      if (cclient && cclient.billingMode === 'piece' && challanLineEl.value === 'NOS') {
        citem.rate = 0; citem.amount = 0;
      }
      recalcChallanLine(citem, cclient);
      captureChallanFields();
      renderAddChallanForm();
    }
  }
});

document.addEventListener('input', function(e) {
  if (e.target.id === 'clientSearch') {
    renderClientList(e.target.value);
  }
  // Attendance hours. Written on every keystroke so nothing is lost, but never
  // re-rendered here: replacing the field mid-entry is what ended the keyboard
  // path in challan entry, and a number input is the same trap.
  if (e.target.hasAttribute && e.target.hasAttribute('data-att-ot')) {
    setAttOt(parseInt(e.target.dataset.id, 10), e.target.value);
    return;
  }
  if (e.target.hasAttribute && e.target.hasAttribute('data-att-hours')) {
    setAttHours(parseInt(e.target.dataset.id, 10), e.target.value);
    return;
  }
  if (e.target.hasAttribute && e.target.hasAttribute('data-att-extra-hours')) {
    setAttExtraHours(parseInt(e.target.dataset.idx, 10), e.target.value);
    return;
  }
  // History search. Debounced so a long log is not rebuilt per keystroke, and
  // focus is restored because renderHistory replaces the input it lives in.
  if (e.target.id === 'historySearch') {
    _historySearch = e.target.value.trim();
    clearTimeout(_historySearchTimer);
    _historySearchTimer = setTimeout(function() {
      var caret = null;
      var el = document.getElementById('historySearch');
      if (el) { try { caret = el.selectionStart; } catch (err) { caret = null; } }
      _historyShowCount = 50;
      renderHistory();
      var restored = document.getElementById('historySearch');
      if (restored) {
        restored.focus();
        if (caret != null && restored.setSelectionRange) restored.setSelectionRange(caret, caret);
      }
    }, 250);
    return;
  }
  // Credit note form: the totals restate as the discount is typed, so the
  // figure being committed is the one on screen. Focus is preserved because
  // the caret position is restored across the re-render.
  if (e.target.dataset.action === 'invCnInput') {
    captureCnForm();
    // Only the discount moves the totals. The date and the vehicle number do
    // not, and re-rendering for them replaced the control being used — which
    // on a date input means tearing the native picker out mid-choice.
    if (e.target.id !== 'cnPct') return;
    var cnId = e.target.id, cnCaret = null;
    try { cnCaret = e.target.selectionStart; } catch (err) { cnCaret = null; }
    renderCreditNoteForm();
    var back = document.getElementById(cnId);
    if (back) {
      back.focus();
      if (cnCaret != null && back.setSelectionRange) {
        try { back.setSelectionRange(cnCaret, cnCaret); } catch (err) {}
      }
    }
    return;
  }
  // Bulk weight entry: price the part as soon as a weight is typed
  if (e.target.dataset.action === 'invWeightInput') {
    updateWeightVerdict(e.target);
  }
  // Part name editing + autocomplete
  if (e.target.dataset.action === 'invEditLinePart') {
    const idx = parseInt(e.target.dataset.idx);
    const item = invoiceForm.items[idx];
    if (item) {
      item.desc = e.target.value;
      item.partNumber = e.target.value;

      // Show part autocomplete dropdown
      showPartAutocomplete(idx, e.target.value);

      // Recalc for nos_to_weight: part name change affects weight lookup
      const client = invoiceForm.clientId ? S.clients.find(c => c.id === invoiceForm.clientId) : null;
      if (client && client.billingMode === 'nos_to_weight' && item.unit === 'NOS' && item.qty > 0) {
        recalcLineItem(item, client);
        const amtInput = document.querySelector('[data-field="amount"][data-idx="' + idx + '"]');
        if (amtInput) amtInput.value = formatNum(item.amount);
        updateTotalsDisplay();
      }
      // Also check itemRates override
      if (client && client.itemRates && client.itemRates.length > 0) {
        const rateInfo = getLineItemRate(client, invoiceForm.date, item.partNumber);
        if (rateInfo._override) {
          item.rate = rateInfo.rate;
          item._override = true;
          item._label = rateInfo._label;
          recalcLineItem(item, client);
          const rateInput = document.querySelector('[data-field="rate"][data-idx="' + idx + '"]');
          const amtInput = document.querySelector('[data-field="amount"][data-idx="' + idx + '"]');
          if (rateInput) rateInput.value = formatNum(item.rate);
          if (amtInput) amtInput.value = formatNum(item.amount);
          updateTotalsDisplay();
        }
      }
    }
    return;
  }
  // Phase 4: IM challan part editing + autocomplete
  if (e.target.dataset.action === 'invEditChallanPart' && _challanForm) {
    var cidx = parseInt(e.target.dataset.idx);
    var citem = _challanForm.items[cidx];
    if (citem) {
      citem.desc = e.target.value;
      citem.partNumber = e.target.value;
      // Show part autocomplete
      showChallanPartAutocomplete(cidx, e.target.value);
      // Auto-fill rate from client rate card
      var cclient = _challanForm.clientId ? S.clients.find(function(c) { return c.id === _challanForm.clientId; }) : null;
      if (cclient && cclient.itemRates && cclient.itemRates.length > 0) {
        var rateInfo = getLineItemRate(cclient, _challanForm.challanDate || localDateStr(), citem.partNumber);
        if (rateInfo._override) {
          citem.rate = rateInfo.rate;
          recalcChallanLine(citem, cclient);
          var rI = document.querySelector('[data-action="invUpdateChallanLine"][data-field="rate"][data-idx="' + cidx + '"]');
          var aI = document.querySelector('[data-action="invUpdateChallanLine"][data-field="amount"][data-idx="' + cidx + '"]');
          if (rI) rI.value = formatNum(citem.rate);
          if (aI) aI.value = formatNum(citem.amount);
        }
      }
    }
    return;
  }
  // Phase 4: IM challan numeric field input
  var challanLineInput = e.target.closest('[data-action="invUpdateChallanLine"]');
  if (challanLineInput && _challanForm && (challanLineInput.dataset.field === 'qty' || challanLineInput.dataset.field === 'rate' || challanLineInput.dataset.field === 'amount' || challanLineInput.dataset.field === 'nosQty')) {
    var cidx2 = parseInt(challanLineInput.dataset.idx);
    var citem2 = _challanForm.items[cidx2];
    if (citem2) {
      // nosQty is integer, others are float
      if (challanLineInput.dataset.field === 'nosQty') {
        citem2.nosQty = parseInt(challanLineInput.value) || null;
        return;
      }
      var cclient2 = _challanForm.clientId ? S.clients.find(function(c) { return c.id === _challanForm.clientId; }) : null;
      citem2[challanLineInput.dataset.field] = parseFloat(challanLineInput.value) || 0;
      if (cclient2 && cclient2.billingMode === 'piece' && citem2.unit === 'NOS') {
        if (challanLineInput.dataset.field === 'amount' || challanLineInput.dataset.field === 'qty') {
          if (citem2.qty > 0 && citem2.amount > 0) {
            citem2.rate = gstRound(citem2.amount / citem2.qty);
            var rI2 = document.querySelector('[data-action="invUpdateChallanLine"][data-field="rate"][data-idx="' + cidx2 + '"]');
            if (rI2) rI2.value = formatNum(citem2.rate);
          }
        }
      } else {
        if (challanLineInput.dataset.field !== 'amount') {
          recalcChallanLine(citem2, cclient2);
          var aI2 = document.querySelector('[data-action="invUpdateChallanLine"][data-field="amount"][data-idx="' + cidx2 + '"]');
          if (aI2) aI2.value = formatNum(citem2.amount);
        }
      }
    }
    return;
  }
  // Numeric line item fields — update model + totals only, no full re-render
  const el = e.target.closest('[data-action="invUpdateLine"]');
  if (el && (el.dataset.field === 'qty' || el.dataset.field === 'rate' || el.dataset.field === 'amount')) {
    const idx = parseInt(el.dataset.idx);
    const item = invoiceForm.items[idx];
    if (!item) return;
    const client = invoiceForm.clientId ? S.clients.find(c => c.id === invoiceForm.clientId) : null;
    item[el.dataset.field] = parseFloat(el.value) || 0;

    if (client && client.billingMode === 'piece' && item.unit === 'NOS') {
      // Piece mode NOS: amount is user-entered, rate is back-calculated
      if (el.dataset.field === 'amount' || el.dataset.field === 'qty') {
        if (item.qty > 0 && item.amount > 0) {
          item.rate = gstRound(item.amount / item.qty);
          const rateInput = document.querySelector('[data-field="rate"][data-idx="' + idx + '"]');
          if (rateInput) rateInput.value = formatNum(item.rate);
        }
      }
    } else {
      // All other modes: amount = qty * rate
      if (el.dataset.field !== 'amount') {
        recalcLineItem(item, client);
        const amtInput = document.querySelector('[data-field="amount"][data-idx="' + idx + '"]');
        if (amtInput) amtInput.value = formatNum(item.amount);
      }
    }
    // Update totals without full DOM replacement
    updateTotalsDisplay();
  }
});

/* Keyboard: suggestion lists, Enter-to-next-field, and challan form shortcuts */
document.addEventListener('keydown', function(e) {
  // 1. An open suggestion list owns the arrow keys and Enter. Without this the
  //    list could only be committed with a pointer — Enter used to return
  //    early here and do nothing at all, which is what stranded the keyboard.
  var openList = e.target.tagName === 'INPUT' ? acListFor(e.target) : null;
  if (openList) {
    if (e.key === 'ArrowDown') { e.preventDefault(); acMoveCursor(openList, 1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); acMoveCursor(openList, -1); return; }
    // Ctrl/Cmd+Enter is "save the challan" and must not be swallowed as a
    // suggestion pick just because a list happens to be open.
    if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
      var pending = acPendingOption(openList);
      if (pending) {
        e.preventDefault();
        acReset();
        // Routed through the same click delegate the pointer path uses, so
        // there is exactly one selection code path to keep correct.
        pending.click();
        return;
      }
    }
  }

  if (e.key === 'Escape') {
    dismissAllAutocomplete();
    var searchRes = document.getElementById('invClientResults');
    if (searchRes) searchRes.classList.add('inv-hidden');
    var imSearchRes = document.getElementById('imChallanClientResults');
    if (imSearchRes) imSearchRes.classList.add('inv-hidden');
    return;
  }

  // 2. Challan form shortcuts, scoped to the form so they cannot fire elsewhere.
  var challanArea = document.getElementById('imAddForm');
  if (_challanForm && challanArea && challanArea.contains(e.target)) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      saveChallan();
      return;
    }
    if (e.altKey && (e.key === 'n' || e.key === 'N')) {
      e.preventDefault();
      captureChallanFields();
      addChallanLine();
      return;
    }
  }

  // 3. Enter moves to the next field. Buttons carrying data-kbd-ring join the

    var target = e.target;
    while (target && target !== document.body) {
      if (target.scrollWidth > target.clientWidth + 2) return;

    }

    var current = document.querySelector('.inv-page-active');
    if (!current) return;
    var idx = TAB_ORDER.indexOf(current.id);
    if (idx < 0) return;

    var next = dx < 0 ? idx + 1 : idx - 1;
    if (next < 0 || next >= TAB_ORDER.length) return;

    switchTab(TAB_ORDER[next]);
  }, { passive: true });
})();

/* Lift a bare gauge out of the description into its own field. Idempotent.

   166 catalogue rows used `desc` to hold nothing but a steel strip size —
   "40X6", "25X6" — which is a specification, not a description. It is also
   the only thing distinguishing several clamp rows that share a part number,
   so it needs to be a field the app can see rather than free text.

   The rule is deliberately narrow: exactly two dimensions, and the text must
   not simply repeat the part number (part "82X81" describes itself and is not
   a gauge). Three-dimension values like "150X68X3" are sizes, not gauges, and
   are left alone. */
(function() {
  var GAUGE_RE = /^\s*\d+\s*[Xx]\s*\d+\s*$/;
  var moved = 0;
  (S.items || []).forEach(function(it) {
    if (it.gauge) return;
    var d = String(it.desc || '').trim();
    if (!GAUGE_RE.test(d)) return;
    if (d.toLowerCase() === String(it.partNumber || '').trim().toLowerCase()) return;
    it.gauge = d.toUpperCase();
    it.desc = '';
    moved++;
  });
  if (moved > 0) {
    saveJSON(STORAGE_KEY, S);
    console.log('Items Master: moved ' + moved + ' gauge value(s) out of the description field');
  }
})();

/* Repair duplicate item ids. Idempotent.

   The seed shipped id 4586 on two different rows (CLAMP 45X86(BOX) and
   BOX CLAMP 45X86). Every lookup — openItemEdit, _renderItemDetail,
   selectPartForLine — resolves by id through .find(), so the second row was
   unreachable and picking it in autocomplete silently selected the first. */
(function() {
  var seen = {};
  var maxId = (S.items || []).reduce(function(mx, it) { return Math.max(mx, it.id || 0); }, 0);
  var repaired = 0;
  (S.items || []).forEach(function(it) {
    if (it.id == null || seen[it.id]) {
      it.id = ++maxId;
      repaired++;
    }
    seen[it.id] = true;
  });
  if (repaired > 0) {
    saveJSON(STORAGE_KEY, S);
    console.log('Items Master: reassigned ' + repaired + ' duplicate item id(s)');
  }
})();

/* Collapse redundant Items Master rows. Idempotent — no version flag needed.

   A row is redundant ONLY when another row matches it on partNumber, gauge,
   unit, rate AND stdWeightKg, and at most one distinct informative
   description exists in the group ("informative" = non-empty and not just a
   copy of the part number). The discarded row then carries no information the
   kept row lacks, so this cannot lose data.

   Deliberately conservative: rows sharing a part number but differing in
   gauge, rate or unit are LEFT ALONE. CLAMP 133X83 (NT) exists as 35X6 at
   3.67 and 40X6 at 4.24. Nothing prices off these rows — invoice and challan
   lines both resolve rate through getLineItemRate() against the client ladder
   — so merging them would misprice nothing today, but it would erase the only
   record of which gauge costs what. Use the Merge tool for judgement calls. */
(function() {
  var items = S.items || [];
  var groups = {};
  var order = [];

  function keyOf(it) {
    return [
      String(it.partNumber || '').trim().toLowerCase(),
      String(it.gauge || '').trim().toUpperCase(),
      it.unit || '',
      it.rate == null ? 0 : it.rate,
      it.stdWeightKg == null ? '' : it.stdWeightKg
    ].join('\u0000');
  }

  function informative(it) {
    var d = String(it.desc || '').trim();
    return d !== '' && d.toLowerCase() !== String(it.partNumber || '').trim().toLowerCase();
  }

  items.forEach(function(it) {
    var k = keyOf(it);
    if (!groups[k]) { groups[k] = []; order.push(k); }
    groups[k].push(it);
  });

  var kept = [];
  order.forEach(function(k) {
    var group = groups[k];
    if (group.length < 2) { kept.push(group[0]); return; }
    var descs = {};
    group.forEach(function(it) {
      if (informative(it)) descs[String(it.desc).trim().toLowerCase()] = true;
    });
    // Conflicting real descriptions — not safely mergeable, keep every row.
    if (Object.keys(descs).length > 1) { kept.push.apply(kept, group); return; }
    var winner = null;
    for (var i = 0; i < group.length; i++) {
      if (informative(group[i])) { winner = group[i]; break; }
    }
    kept.push(winner || group[0]);
  });

  if (kept.length !== items.length) {
    var removed = items.length - kept.length;
    S.items = kept;
    saveJSON(STORAGE_KEY, S);
    console.log('Items Master: collapsed ' + removed + ' redundant row' + (removed !== 1 ? 's' : ''));
  }
})();

  var removed = before - S.items.length;
  if (removed > 0) console.log('Rate cleanup: removed ' + removed + ' items with rate > 25 (Belrise trading remnants)');
  S._rateCleanup1 = true;

/* Comp classes rebuilt against the two pay mechanics the shop actually runs.

   The first cut of the Staff tab shipped `permanent` (a flat monthly, accrued
   by calendar day) and `contract` (days at a day rate, OT at a multiplier).
   Neither matched a payout slip: the salaried tier is paid ₹/day × days with
   its rest days gated on attendance, and the weekly pool is paid a flat rate
   for every hour with no day boundary and no multiplier at all.

   `permanent` becomes `monthly`, and where such a worker carried only a flat
   salary it is divided by 30 to recover the day rate the slips are written in.
   That is an approximation and it is the only lossy step here — but the tier
   was never *paid* off a flat monthly, so the flat figure was the approximation
   in the first place. `contract` becomes `daily`, which is the same arithmetic
   under a name that no longer claims to describe this shop's contract pool.

   Idempotent, and a no-op on the overwhelmingly likely case: the roster ships
   empty, so most devices have nothing to migrate. */
if (!S._staffComp1) {
  var _sc = 0;
  (S.staff || []).forEach(function(w) {
    if (w.comp === 'permanent') {
      w.comp = 'monthly';
      if (!(w.dayRate > 0) && w.monthly > 0) w.dayRate = gstRound(w.monthly / 30);
      _sc++;
    } else if (w.comp === 'contract') {
      w.comp = 'daily';
      _sc++;
    }
    delete w.monthly;
  });
  S._staffComp1 = true;
  saveJSON(STORAGE_KEY, S);
  if (_sc > 0) console.log('Staff: migrated ' + _sc + ' worker' + (_sc === 1 ? '' : 's') + ' to the tiered comp model');
}

/* Phase 9: Default cost per KG for margin dashboard (IL-4) — idempotent */
if (S.defaultCostPerKg === undefined) {
  S.defaultCostPerKg = 8.55;
  saveJSON(STORAGE_KEY, S);
}

/* Derive standard weights from piece pricing — one-time, idempotent.

   Stats measures this business in rupees per kilogram, and a line whose part
   has no weight cannot be counted at all. On live data 90 of 168 catalogue rows
   had no weight, and the gap was not random: it was almost entirely the
   piece-billed work, which is the low-realisation end of the book. So tonnage
   covered 61% of revenue and realisation was computed over the well-priced
   remainder — the one account the figures existed to examine was the one they
   could not see. Leaving that behind a button nobody had pressed made the
   dashboard quietly wrong rather than visibly incomplete.

   Where a client bills per piece off a rate per kg, weight = pieceRate /
   ratePerKg recovers the weight exactly. It fills only empty weights and never
   touches billing: rates resolve through getLineItemRate() against the client
   ladder, and stdWeightKg is read by Stats and Items Master alone. The
   nos_to_weight billing path reads S.partWeights, which this does not write.

   Note what such a weight is and is not. Defined as rate/ratePerKg it prices
   back at exactly ratePerKg, so it measures tonnage, not margin.

   The flag is only set once there was something to derive from, so a device
   that loads empty and imports a backup afterwards still gets its pass. */
if (!S._deriveWeights1) {
  var _dw = applyDerivedWeights();
  if (_dw.sources > 0) {
    S._deriveWeights1 = true;
    saveJSON(STORAGE_KEY, S);
    if (_dw.derived > 0) {
      console.log('Weights: derived ' + _dw.derived + ' from piece rates' +
        (_dw.highVariance > 0 ? ' (' + _dw.highVariance + ' with inconsistent rates)' : ''));
    }
  }
}

/* The credit note series did not start in this app. CN/001 to CN/005 of
   2026-27 were raised by hand before it existed — the 04/08/26 reference is
   CN/005 — so the first one issued here is 006, not 001. Restarting the series
   at 001 would put a number the customer already holds on a second document.

   Runs once, and only while the app has issued none of its own, so it can
   never walk over a real number. Settings → Credit Note Series carries it
   afterwards, for the next financial year or a correction. */
var CN_SERIES_START = 6;
if (!S._cnSeriesStart1) {
  if ((S.creditNotes || []).length === 0 && (!S.cnNextNum || S.cnNextNum < CN_SERIES_START)) {
    S.cnNextNum = CN_SERIES_START;
  }
  S._cnSeriesStart1 = true;
  saveJSON(STORAGE_KEY, S);
}

/* ===== GLOBAL DRAG HANDLERS (Phase 8B) ===== */
function _onDragMove(clientX) {
  if (!_dragState) return;
  var dx = clientX - _dragState.startX;
  var newW = _dragState.masterStart + dx;
  var minMaster = 280, minDetail = 320;
  var maxMaster = _dragState.containerW - minDetail;
  newW = Math.max(minMaster, Math.min(maxMaster, newW));
  document.getElementById(_dragState.masterId).style.width = (newW / _dragState.containerW * 100) + '%';
}

function _onDragEnd() {
  if (!_dragState) return;
  var master = document.getElementById(_dragState.masterId);
  var ratio = master.offsetWidth / master.parentElement.offsetWidth;
  if (!regFilter.desktopPanelWidths) regFilter.desktopPanelWidths = {};
  regFilter.desktopPanelWidths[_dragState.tabKey] = ratio;
  saveRegFilter();
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
  _dragState = null;
}

document.addEventListener('mousemove', function(e) { _onDragMove(e.clientX); });
document.addEventListener('mouseup', _onDragEnd);
document.addEventListener('touchmove', function(e) {
  if (!_dragState) return;
  e.preventDefault();
  _onDragMove(e.touches[0].clientX);
}, { passive: false });
document.addEventListener('touchend', _onDragEnd);

// Debounced ResizeObserver
new ResizeObserver(function() {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(updateLayoutMode, 150);
}).observe(document.documentElement);

/* Manifest app shortcuts land here as ?tab=<pageId>[&new=1]. Writing the target
   into regFilter before the first layout pass means both the desktop and the
   mobile restore paths pick it up without a second switchTab, and the query is
   stripped so a later refresh returns to the ordinary saved tab. */
var _launchNew = false;
(function() {
  var params;
  try { params = new URLSearchParams(window.location.search); } catch (e) { return; }
  var wanted = params.get('tab');
  if (!wanted || !document.getElementById(wanted)) return;
  regFilter.activeTab = wanted;
  saveRegFilter();
  _launchNew = params.get('new') === '1';
  try { history.replaceState(null, '', window.location.pathname); } catch (e) {}
})();

// Initial layout detection (no debounce)
updateLayoutMode();

/* Phase 6b: Restore active tab on refresh */
// If updateLayoutMode triggered _applyModeSwitch, it already called switchTab.
// Only do manual restore if we're still on mobile (no mode switch happened).
if (!_isDesktop) {
  var _savedTab = regFilter.activeTab || 'pageHome';
  if (_savedTab !== 'pageHome' && document.getElementById(_savedTab)) {
    switchTab(_savedTab);
  } else {
    renderHome();
  }
}

/* The "Add Challan" app shortcut opens the form, not just the tab. Runs after
   the tab restore above so the IM view exists to render into. */
if (_launchNew && regFilter.activeTab === 'pageIM' && !_isDesktop) {
  showAddChallanForm();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
