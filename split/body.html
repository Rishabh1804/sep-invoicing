</head>
<body>

<!-- TOP BAR (design system §4, §6.1) -->
<header class="inv-topbar">
  <button class="inv-topbar-btn inv-topbar-back" id="navBack" data-action="invNavBack" aria-label="Back" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <nav class="inv-topbar-trail" id="navTrail" aria-label="Trail"></nav>
  <h1 class="inv-topbar-title" id="topbarTitle">Today</h1>
  <span class="inv-topbar-ctx" id="topbarCtx"></span>
  <span class="inv-topbar-spacer"></span>
  <!-- Search (DIRECTION_B): a field-like button on the desktop, an icon on the phone; search.js builds what it opens. -->
  <button class="inv-search inv-ws-search" data-action="invSearchOpen" aria-keyshortcuts="Control+K">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Search</span><kbd class="inv-kbd">Ctrl K</kbd>
  </button>
  <button class="inv-topbar-btn" data-action="invSearchOpen" aria-label="Search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
  </button>
  <!-- The knowledge base (knowledge.js): the guides for the screen on show, else Start. -->
  <button class="inv-topbar-btn" data-action="invKbHelp" aria-label="Knowledge: how and why" title="Knowledge: how and why">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7M8 11h5"/></svg>
  </button>
  <!-- The book on the desktop, where the phone's top bar icons are hidden (the QA chain of 5 Oct 2026: the desktop had no
       way to the guides for the screen on show). Hidden on the phone, which has the icon above. -->
  <button class="inv-btn inv-btn-icon inv-btn-ghost" data-action="invKbHelp" aria-label="Knowledge: how and why" title="Knowledge: how and why">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7M8 11h5"/></svg>
  </button>
  <!-- This screen in a new window (search.js). The desktop's: hidden on the phone. -->
  <button class="inv-btn inv-btn-icon inv-btn-ghost" data-action="invNewWindow" aria-label="Open this screen in a new window" title="Open this screen in a new window">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
  </button>
  <!-- The guard (guard.js): who is signed in; their menu. Shown only while the guard is on. -->
  <button class="inv-guard-user" id="guardUserBtn" data-action="invGuardMenu" aria-label="Who is signed in" hidden></button>
  <button class="inv-topbar-btn" data-action="invOpenSettings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4"/></svg>
  </button>
</header>
<!-- The open workspace's views (workspace.js): here on the phone, moved into the top bar on the desktop. -->
<div class="inv-viewtabs inv-ws-tabs inv-hidden" id="wsTabs" role="tablist"></div>

<!-- PAGES -->
<div id="pageHome" class="inv-page inv-page-active">
  <!-- Today (today.js): Needs you, then Pulse; one of the two shown (pageHome's own view, ?tab=pageHome&v=pulse). -->
  <div id="homeNeeds" data-today="needs"></div>
  <div id="homePulse" data-today="pulse" class="inv-hidden">
  <div id="homeQuestions"></div>
  <div id="homeEditArea"></div>
  <div class="inv-panels inv-panels-3" id="homeWidgets">
    <div data-home-w="mtd" class="inv-panels-wide">
      <div class="inv-tiles" id="homeTiles">
        <div class="inv-tile"><div class="inv-tile-label">Invoices</div><div class="inv-tile-value" id="mtdCount">0</div><div class="inv-tile-sub" id="mtdCountSub">&nbsp;</div><div class="inv-tile-sub" id="mtdCountDelta"></div></div>
        <div class="inv-tile"><div class="inv-tile-label">Revenue</div><div class="inv-tile-value" id="mtdRevenue">&#8377;0</div><div class="inv-tile-sub" id="mtdRevenueSub">taxable</div><div class="inv-tile-sub" id="mtdRevenueDelta"></div></div>
        <div class="inv-tile"><div class="inv-tile-label">Tonnage billed</div><div class="inv-tile-value" id="mtdKg">&mdash;</div><div class="inv-tile-sub" id="mtdKgSub">&nbsp;</div><div class="inv-tile-sub" id="mtdKgDelta"></div></div>
        <div class="inv-tile" id="mtdPerKgTile"><div class="inv-tile-label">Realisation</div><div class="inv-tile-value" id="mtdPerKg">&mdash;</div><div class="inv-tile-sub" id="mtdPerKgSub">&nbsp;</div><div class="inv-tile-sub" id="mtdPerKgDelta"></div></div>
      </div>
    </div>
    <div data-home-w="quick" class="inv-panels-wide">
      <div class="inv-btn-grid" role="group" aria-label="Quick actions">
        <button class="inv-btn inv-btn-primary" data-action="invCreateNew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg><span>New invoice</span></button>
        <button class="inv-btn inv-btn-secondary" data-action="invHomeQuick" data-go="challan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg><span>New challan</span></button>
        <button class="inv-btn inv-btn-secondary" data-action="invHomeQuick" data-go="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v6L4.5 19a1.5 1.5 0 001.3 2h12.4a1.5 1.5 0 001.3-2L14 9V3"/><path d="M7 15h10"/></svg><span>Stock entry</span></button>
        <button class="inv-btn inv-btn-secondary" data-action="invHomeQuick" data-go="attendance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg><span>Attendance</span></button>
        <button class="inv-btn inv-btn-secondary" data-action="invHomeQuick" data-go="paste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg><span>Paste message</span></button>
        <button class="inv-btn inv-btn-secondary" data-action="invHomeQuick" data-go="task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg><span>Add task</span></button>
      </div>
    </div>
    <div data-home-w="money" id="homeFinCard"></div>
    <div data-home-w="todo" id="homeTodoCard"></div>
    <div data-home-w="attendance" id="homeAttCard"></div>
    <div data-home-w="unbilled" id="homeUnbilledCard"></div>
    <div data-home-w="production" id="homeProdCard"></div>
    <div data-home-w="power" id="homePowerCard"></div>
    <div data-home-w="stock" id="homeStockCard"></div>
    <div data-home-w="sync" id="homeSyncCard"></div>
    <div data-home-w="zinc" id="homeZincCard"></div>
    <div data-home-w="recent" class="inv-panel inv-panel-flush inv-panels-wide">
      <div class="inv-panel-head"><span class="inv-panel-title">Recent invoices</span></div>
      <div id="recentInvoices"></div>
    </div>
  </div>
  <div class="inv-toolbar" id="homeEditBar"><button class="inv-btn inv-btn-ghost inv-btn-sm" data-action="invHomeEdit">Edit Home</button></div>
  </div>
</div>

<div id="pageCreate" class="inv-page">
  <div id="createFormArea"></div>
</div>

<div id="pageIM" class="inv-page">
  <div id="imToolbar"></div>
  <div id="imAddForm"></div>
  <div id="imList"></div>
  <div id="imSelBar"></div>
  <input type="file" id="scanFileInput" accept="image/*" class="inv-hidden">
  <div id="scanProcessing"></div>
</div>

<div id="pageRegister" class="inv-page">
  <div id="regToolbar"></div>
  <div id="regList"></div>
  <div id="regSelBar"></div>
</div>

<div id="pagePipeline" class="inv-page">
  <div id="pipelineContent"></div>
</div>

<div id="pageClients" class="inv-page">
  <div id="clientsPageContent"></div>
</div>

<div id="pageStaff" class="inv-page">
  <div id="attToolbar"></div>
  <div id="attContent"></div>
  <input type="file" id="rosterFileInput" accept="application/json,.json" class="inv-hidden">
</div>

<div id="pageStats" class="inv-page">
  <div id="statsToolbar"></div>
  <div id="statsContent" class="inv-panels inv-panels-dense inv-panels-3"></div>
</div>

<div id="pageReports" class="inv-page">
  <div id="reportsContent"></div>
</div>

<div id="pagePlanner" class="inv-page">
  <div id="plannerContent"></div>
</div>

<div id="pageFloor" class="inv-page">
  <div id="floorContent"></div>
</div>

<div id="pageProduction" class="inv-page">
  <div id="productionContent"></div>
  <div id="prodProcessing"></div>
</div>

<div id="pageKnow" class="inv-page">
  <div id="knowContent"></div>
</div>

<div id="pagePower" class="inv-page">
  <div id="powerContent"></div>
</div>

<div id="pageStock" class="inv-page">
  <div id="stockContent"></div>
</div>

<div id="pageFinance" class="inv-page">
  <div id="financeContent"></div>
</div>

<div id="pageTodo" class="inv-page">
  <div id="todoContent"></div>
</div>

<div id="pageHistory" class="inv-page">
  <div id="historyToolbar"></div>
  <div id="historyList"></div>
</div>

<!-- BOTTOM BAR (phone and tablet): Today · Office · Add · Floor · Money, drawn from the workspaces' map (workspace.js). -->
<nav class="inv-navbar" aria-label="Main"></nav>

<!-- SETTINGS OVERLAY (hidden) -->
<div id="settingsOverlay" class="inv-hidden"></div>

<!-- PRINT VIEW (hidden, full-page) -->
<div id="invPrintView" class="inv-print-view">
  <div class="inv-print-toolbar">
    <button class="inv-print-toolbar-btn" data-action="invClosePrint">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </button>
    <button class="inv-print-toolbar-btn" data-action="invPrint">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Print
    </button>
  </div>
  <div class="inv-print-body" id="invPrintBody"></div>
</div>
