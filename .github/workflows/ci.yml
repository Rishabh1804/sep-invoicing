name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are worth cancelling; commits on main are not — each
  # one should keep its own recorded result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No job does anything but read the tree.
permissions:
  contents: read

jobs:
  build-sync:
    name: Build output in sync with split/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # AGENTS.md rule 1: never edit the built output directly, never bypass
      # build.sh. This job is what makes that rule enforceable — it runs the
      # same command a developer runs and fails if anything changes, so the
      # check can't drift from the build it is checking.
      - name: Rebuild from split/ modules
        run: bash split/build.sh

      - name: Committed HTML matches split/ sources
        run: |
          if ! git diff --exit-code -- sep-invoicing.html index.html version.json; then
            echo "::error::Built output is stale. Run 'bash split/build.sh' and commit the result. Enabling the pre-commit hook (git config core.hooksPath .githooks) does this automatically."
            exit 1
          fi

  e2e:
    name: Playwright e2e
    # Pinned: ubuntu-latest became 26.04 on 26 Oct 2026, and Playwright 1.59.1
    # cannot install Chromium there ("does not support chromium on
    # ubuntu26.04-x64"). 24.04 keeps the browser CI has measured against.
    runs-on: ubuntu-24.04
    # A hang backstop, not a budget: without it a wedged browser would burn the
    # 6h job default. The suite itself takes ~27 min on two workers (1,734 tests,
    # 10 Oct 2026: 26.6 min on the run for the entry faces' F4) and the apt step
    # behind Chromium's install has taken 5 min on its own, so 30 would cut the
    # next runs off mid-suite, as 15 once did.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only Chromium — both Playwright projects (mobile-chromium via the Pixel 5
      # descriptor, desktop-chromium) run on it.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e suite
        run: pnpm exec playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  feeds:
    name: Feeds Worker tests
    runs-on: ubuntu-latest
    # The Worker's own suite (server/feeds, docs/UI_PASS_3.md §9a) runs inside the
    # Workers runtime with GDELT and MET Norway faked, in about ten seconds once
    # installed. A hang backstop, not a budget.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/feeds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/feeds/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the Worker's tests
        run: npx vitest run
