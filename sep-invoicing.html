function confirmCancelInvoice(invId) {
  const inv = S.invoices.find(i => i.id === invId);
  if (!inv) return;
  inv.status = 'cancelled';
  inv.cancelledAt = Date.now();
  inv.updatedAt = Date.now();
  // Unlink IM items (item-level, not entry-level)
  if (inv.linkedIMIds && inv.linkedIMIds.length > 0) {
    inv.linkedIMIds.forEach(imId => {
      const im = (S.incomingMaterial || []).find(m => m.id === imId);
      if (im) {
        im.items.forEach(it => {
          if (it.invoiceId === inv.id) { it.invoiced = false; it.invoiceId = null; }
        });
      }
    });
  }
  saveState();
  closeOverlay();
  renderRegister();
  showToast('Invoice ' + inv.displayNumber + ' cancelled');
}

/* Delete invoice — hard delete with filing cutoff tiered warning */
function deleteInvoice(invId) {
  const inv = S.invoices.find(i => i.id === invId);
  if (!inv) return;

  // Filing cutoff: invoice month + 1 month + 5 days
  const invDate = new Date(inv.date + 'T00:00:00');
  const filingDeadline = new Date(invDate.getFullYear(), invDate.getMonth() + 2, 5);
  const now = new Date();
  const pastDeadline = now >= filingDeadline;

  const scrim = document.createElement('div');
  scrim.className = 'inv-overlay-scrim';

  // The lifecycle state is harder evidence than the date heuristic: once an
  // invoice is dispatched the customer holds a document bearing that number,
  // and deleting it here does not retract it there.
  const issued = getInvState(inv) !== 'created';

  let warnHtml = '';
  let bodyText = '';
  let btnClass = '';

  if (issued) {
    warnHtml = '<div class="inv-confirm-warn">This invoice was ' + escHtml(INV_STATE_LABELS[getInvState(inv)].toLowerCase()) +
      '. The customer may hold a copy and claim credit against this number, which deleting it here does not retract' +
      (pastDeadline ? ', and it may already sit in a filed return' : '') +
      '. A credit note is usually the right instrument. The number stays spent either way.</div>';
    bodyText = 'Permanently delete invoice <strong>' + escHtml(inv.displayNumber) + '</strong>? This cannot be undone.';
    btnClass = 'inv-btn-danger';
  } else if (pastDeadline) {
    warnHtml = '<div class="inv-confirm-warn">This invoice may have been included in a filed GST return. Cancelling (not deleting) is recommended.</div>';
    bodyText = 'Permanently delete invoice <strong>' + escHtml(inv.displayNumber) + '</strong>? This cannot be undone.';
    btnClass = 'inv-btn-danger';
  } else {
    bodyText = 'Delete invoice <strong>' + escHtml(inv.displayNumber) + '</strong>? It never left the building, so this number returns to the series.';
    btnClass = 'inv-btn-primary';
  }

  scrim.innerHTML = '<div class="inv-overlay-card">' +
    '<div class="inv-overlay-header"><span class="inv-overlay-title">Delete Invoice</span>' +
    '<button class="inv-overlay-close" data-action="invCloseConfirm">&times;</button></div>' +
    warnHtml +
    '<div class="inv-confirm-body">' + bodyText + '</div>' +
    '<div class="inv-form-group"><label class="inv-form-label">Why is it going?</label>' +
    '<input class="inv-form-input" id="invDeleteReason" placeholder="e.g. duplicate of 00657" autocomplete="off">' +
    '<div class="inv-form-hint">Kept against the number in the register. Without it a deleted number is indistinguishable from one never issued.</div></div>' +
    '<div class="inv-btn-bar"><button class="inv-btn inv-btn-ghost" data-action="invCloseConfirm">Keep</button>' +
    '<button class="inv-btn ' + btnClass + '" data-action="invConfirmDelete" data-id="' + escHtml(inv.id) + '">Delete</button></div></div>';
  // Act overlay: scrim tap does nothing (DP 5.2)
  pushFocus();
  document.body.appendChild(scrim);
  document.body.style.overflow = 'hidden';
  focusFirstInteractive(scrim.querySelector('.inv-overlay-card'));
}

function confirmDeleteInvoice(invId) {
  const inv = S.invoices.find(i => i.id === invId);
  if (!inv) return;

  const reasonEl = document.getElementById('invDeleteReason');
  const reason = reasonEl ? reasonEl.value.trim() : '';
  if (!reason) {
    showToast('Say why it is going — the number outlives the invoice', 'error');
    if (reasonEl) reasonEl.focus();
    return;
  }

  const dispNum = inv.displayNumber;
  // A number the customer has seen is spent; one still in `created` returns to
  // the series. Recorded before the invoice is spliced out.
  const reserved = getInvState(inv) !== 'created';
  recordVoidedNumber(inv, reason, reserved);

  // Unlink IM items (item-level, not entry-level)
  if (inv.linkedIMIds && inv.linkedIMIds.length > 0) {
    inv.linkedIMIds.forEach(imId => {
      const im = (S.incomingMaterial || []).find(m => m.id === imId);
      if (im) {
        im.items.forEach(it => {
          if (it.invoiceId === inv.id) { it.invoiced = false; it.invoiceId = null; }
        });
      }
    });
  }
  // Hard delete from array
  const idx = S.invoices.indexOf(inv);
  if (idx > -1) S.invoices.splice(idx, 1);

  // Recycle the number only if nothing holds it — live invoices and reserved
  // voids both count, so invNextNum can no longer walk back over an issued one.
  recomputeNextInvoiceNumber();

  saveState();
  closeOverlay();
  renderRegister();
  showToast('Invoice ' + dispNum + (reserved ? ' deleted — number stays spent' : ' deleted'));
}

/* ===== INVOICE NUMBER LEDGER ===== */

/*
 * Deleting an invoice used to remove the record outright, which made a
 * deliberately voided number indistinguishable from one never issued. On
 * 4 Aug inv 00666 was deleted for exactly the right reason — a duplicate of
 * inv 00657 — and the app immediately lost the reason along with the record.
 * Five earlier numbers are worse: cancelled and filed in GSTR-1 at zero, but
 * absent here, so the filing and the app disagree and every review re-raises
 * them.
 *
 * So a deletion now leaves a tombstone in S.voidedNumbers carrying the number,
 * the reason and what the invoice was, and the register can walk the whole
 * serial sequence and say of every number: live, cancelled, voided with a
 * reason, or unaccounted for. Unaccounted is the only state that needs work,
 * and a historical gap can be explained in place without inventing an invoice
 * to hang the explanation on.
 *
 * `reserved` is the distinction that matters for numbering. An invoice still
 * in `created` state never left the building, so its number is free to reuse —
 * that is the ordinary typo-and-redo flow. Once it is dispatched, delivered or
 * filed, the customer holds a document bearing that number: the number is
 * spent, invNextNum must never walk back over it, and rule 46's consecutive
 * series keeps a hole that this ledger explains.
 */

function getVoidedNumbers() {
  if (!S.voidedNumbers) S.voidedNumbers = [];
  return S.voidedNumbers;
}

function invNumInt(n) {
  var v = parseInt(n, 10);
  return isNaN(v) ? null : v;
}

function padInvNum(num) {
  return String(num).padStart(5, '0');
}

function displayForNumber(num) {
  return (S.invPrefix || '') + padInvNum(num);
}

/* invNextNum may only advance. Live invoices and reserved voids both hold slots. */
function recomputeNextInvoiceNumber() {
  var maxLive = S.invoices.reduce(function(max, inv) {
    var n = invNumInt(inv.invoiceNumber);
    return n != null && n > max ? n : max;
  }, 0);
  var maxHeld = getVoidedNumbers().reduce(function(max, v) {
    var n = invNumInt(v.invoiceNumber);
    return v.reserved && n != null && n > max ? n : max;
  }, 0);
  S.invNextNum = Math.max(maxLive, maxHeld) + 1;
}

/* ===== SEQUENCE ANALYSIS ===== */

/*
 * Bounds are drawn from evidence, not from 1. A user who starts a series at
 * 500 has not skipped 499 numbers, and reporting them as gaps would bury the
 * real ones. The top extends to invNextNum - 1: numbers handed out and then
 * lost are exactly what this is looking for.
 */
function analyseInvoiceNumbers() {
  var byNum = {};
  var voidByNum = {};
  var known = [];

  S.invoices.forEach(function(inv) {
    var n = invNumInt(inv.invoiceNumber);
    if (n == null) return;
    byNum[n] = inv;
    known.push(n);
  });
  getVoidedNumbers().forEach(function(v) {
    var n = invNumInt(v.invoiceNumber);
    if (n == null) return;
    voidByNum[n] = v;
    known.push(n);
  });

  var out = { entries: [], unaccounted: [], counts: { active: 0, cancelled: 0, voided: 0, reissued: 0, unaccounted: 0 }, from: null, to: null };
  if (known.length === 0) return out;

  var lo = Math.min.apply(null, known);
  var hi = Math.max.apply(null, known);
  var next = invNumInt(S.invNextNum);
  if (next != null && next - 1 > hi) hi = next - 1;

  for (var n = lo; n <= hi; n++) {
    var inv = byNum[n] || null;
    var voided = voidByNum[n] || null;
    var kind;
    if (inv && voided) kind = 'reissued';
    else if (inv) kind = inv.status === 'cancelled' ? 'cancelled' : 'active';
    else if (voided) kind = 'voided';
    else kind = 'unaccounted';

    out.counts[kind]++;
    var entry = { num: n, display: inv ? inv.displayNumber : displayForNumber(n), kind: kind, inv: inv, voided: voided };
    out.entries.push(entry);
    if (kind === 'unaccounted') out.unaccounted.push(entry);
  }

  out.from = lo;
  out.to = hi;
  return out;
}

function unaccountedNumberCount() {
  return analyseInvoiceNumbers().unaccounted.length;
}

/* ===== VOID LEDGER WRITES ===== */

/* Called from confirmDeleteInvoice, after the invoice has been read but before
   it is spliced out. Returns the record so the caller can report on it. */
function recordVoidedNumber(inv, reason, reserved) {
  var rec = {
    invoiceNumber: inv.invoiceNumber,
    displayNumber: inv.displayNumber,
    date: inv.date || '',
    clientId: inv.clientId != null ? inv.clientId : null,
    clientName: inv.clientName || '',
    taxableValue: inv.taxableValue || 0,
    grandTotal: inv.grandTotal || 0,
    lastState: getInvState(inv),
    wasCancelled: inv.status === 'cancelled',
    reason: reason,
    reserved: !!reserved,
    source: 'deleted',
    voidedAt: Date.now()
  };
  getVoidedNumbers().push(rec);
  return rec;
}

/* ===== ACCOUNT FOR A HISTORICAL GAP ===== */

var _accountForNum = null;

function openAccountForNumber(num) {

    '<div class="inv-confirm-body">This number is missing from the register. Record what happened to it — a cancelled invoice filed at zero, a spoiled number, one deleted before this ledger existed. No invoice is created.</div>' +
    '<div class="inv-form-group"><label class="inv-form-label">What happened to this number</label>' +

  pushFocus();

}

function saveGapReason() {
  if (_accountForNum == null) return;
  var reasonEl = document.getElementById('invGapReason');
  var reason = reasonEl ? reasonEl.value.trim() : '';
  if (!reason) { showToast('Say what happened to this number', 'error'); return; }

  var dateEl = document.getElementById('invGapDate');
  var clientEl = document.getElementById('invGapClient');
  var n = _accountForNum;

  getVoidedNumbers().push({
    invoiceNumber: padInvNum(n),
    displayNumber: displayForNumber(n),
    date: (dateEl && dateEl.value) || '',
    clientId: null,
    clientName: (clientEl && clientEl.value.trim()) || '',
    taxableValue: 0,
    grandTotal: 0,
    lastState: 'unknown',
    wasCancelled: false,
    reason: reason,
    // A number old enough to be a gap was issued. It is spent either way.
    reserved: true,
    source: 'reconciled',
    voidedAt: Date.now()
  });
  recomputeNextInvoiceNumber();
  saveState();
  _accountForNum = null;

  closeOverlay();
  _regToolbarRendered = false;
  renderRegisterToolbar();
  _regToolbarRendered = true;
  _renderRegView();

}

/* ===== EXPORT ROWS ===== */

/*
 * Reserved voids belong in the returns at zero — that is how SEP already files
 * them, and it is the disagreement between the app and the filing that made
 * these numbers look missing in the first place. Never-issued numbers are not
 * included: they were recycled, so a live invoice occupies the slot.
 */
function getVoidedForExport() {
  return getVoidedNumbers().filter(function(v) {
    if (!v.reserved) return false;
    if (regFilter.clientId && v.clientId !== parseInt(regFilter.clientId)) return false;
    if (regFilter.month && !(v.date || '').startsWith(regFilter.month)) return false;
    if (regFilter.search) {
      var q = regFilter.search.toLowerCase();
      if ((v.displayNumber || '').toLowerCase().indexOf(q) < 0 &&
          (v.clientName || '').toLowerCase().indexOf(q) < 0) return false;
    }
    return true;
  }).sort(function(a, b) { return (invNumInt(a.invoiceNumber) || 0) - (invNumInt(b.invoiceNumber) || 0); });
}
/* ===== GST EXPORT ===== */
function csvEscape(val) {
  const s = String(val == null ? '' : val);
  if (s.includes(',') || s.includes('"') || s.includes('\n')) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function downloadCSV(filename, rows) {
  const content = rows.map(r => r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + content], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

/* Rows in serial order, voided numbers sitting in their own slot.
   Both exports used to take getFilteredInvoices() order, which on mobile is
   createdAt descending — so the register filed to the accountant came out in
   reverse typing order — and then appended the voids in a block at the end. A
   register is read by serial: that is the order rule 46's consecutive series is
   kept in, and it is the order a gap is spotted in. The on-screen sort is a
   browsing preference and deliberately does not reach the file. */
function _exportRowsInSerialOrder(invoices, voided, invRow, voidRow) {
  var rows = invoices.map(function(inv) {
    return { num: invNumInt(inv.invoiceNumber), build: function() { return invRow(inv); } };
  }).concat(voided.map(function(v) {
    return { num: invNumInt(v.invoiceNumber), build: function() { return voidRow(v); } };
  }));
  rows.sort(function(a, b) {
    if (a.num == null) return 1;
    if (b.num == null) return -1;
    return a.num - b.num;
  });
  return rows.map(function(r) { return r.build(); });
}

/* Filenames say what the file actually contains. `SEP-Sales-Register-all.csv`
   twice in a downloads folder, from two different client filters, is a filing
   accident waiting to happen. */
function _exportSlug(s) {
  return String(s || '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
}

function exportScopeLabel() {
  var parts = [];
  if (regFilter.dateFrom || regFilter.dateTo) {
    parts.push((regFilter.dateFrom || 'start') + '_to_' + (regFilter.dateTo || localDateStr()));
  } else if (regFilter.month) {
    parts.push(regFilter.month);
  } else {
    parts.push('all-dates');
  }
  if (regFilter.clientId) {
    var c = S.clients.find(function(x) { return x.id === parseInt(regFilter.clientId); });
    if (c) parts.push(_exportSlug(c.name));
  }
  if (regFilter.state) parts.push(_exportSlug(regFilter.state));
  if (regFilter.search) parts.push('search-' + _exportSlug(regFilter.search));
  return parts.join('_');
}

function getPlaceOfSupply(inv) {
  const code = (inv.clientAddress && inv.clientAddress.stateCode) || '20';
  const stateMap = { '20': 'Jharkhand', '27': 'Maharashtra' };
  const name = stateMap[code] || (inv.clientAddress && inv.clientAddress.state) || 'Jharkhand';
  return code + '-' + name;
}

function exportSalesCSV() {
  const invoices = getFilteredInvoices();
  // Phase 5: Metadata row above column headers
  var exportDate = formatDateExport(localDateStr());
  var metaRow = ['SOMA ELECTRO PRODUCTS | GSTIN: ' + (S.company.gstin || '20AAPFS4718J2Z0') + ' | Export Date: ' + exportDate];
  var scope = exportScopeLabel();
  metaRow.push('Scope: ' + scope);
  const header = ['Inv. No.', 'Date', 'Customer', 'Status', 'Taxable Value', 'CGST%', 'CGST Amt', 'SGST%', 'SGST Amt', 'IGST%', 'IGST Amt', 'Invoice Amount'];
  // Voided numbers ride along at zero. The number was issued, so the series
  // has to show it; the reason travels in the customer column so the internal
  // register explains its own gaps.
  const voided = getVoidedForExport();
  const rows = [metaRow, header].concat(_exportRowsInSerialOrder(
    invoices, voided,
    function(inv) {
      const cancelled = inv.status === 'cancelled';
      return [
        inv.displayNumber,
        formatDateExport(inv.date),
        inv.clientName,
        cancelled ? 'Cancelled' : INV_STATE_LABELS[getInvState(inv)] || 'Created',
        cancelled ? 0 : inv.taxableValue,
        cancelled ? 0 : (inv.cgstPer || 0),
        cancelled ? 0 : (inv.cgstAmt || 0),
        cancelled ? 0 : (inv.sgstPer || 0),
        cancelled ? 0 : (inv.sgstAmt || 0),
        cancelled ? 0 : (inv.igstPer || 0),
        cancelled ? 0 : (inv.igstAmt || 0),
        cancelled ? 0 : (inv.grandTotal || 0)
      ];
    },
    function(v) {
      return [
        v.displayNumber,
        formatDateExport(v.date),
        (v.clientName ? v.clientName + ' — ' : '') + 'VOID: ' + v.reason,
        'Voided',
        0, 0, 0, 0, 0, 0, 0, 0
      ];
    }
  ));
  downloadCSV('SEP-Sales-Register_' + scope + '.csv', rows);
  showToast('Sales Register exported (' + (invoices.length + voided.length) + ' rows)');
}

function exportGSTR1CSV() {

        gstRate,
        cancelled ? 0 : (inv.taxableValue || 0),
        cancelled ? 0 : (inv.cgstAmt || 0),
        cancelled ? 0 : (inv.sgstAmt || 0),
        cancelled ? 0 : (inv.igstAmt || 0),
        0
      ];
    },
    function(v) {
      return ['', v.displayNumber, formatDateExport(v.date), 0,
        '20-Jharkhand', 'N', 'Regular', '', 0, 0, 0, 0, 0, 0];
    }
  ));
  downloadCSV('SEP-GSTR1_' + scope + '.csv', rows);
  showToast('GSTR1 exported (' + (invoices.length + voided.length) + ' rows)');
}

/* ===== INCOMING MATERIAL (Phase 3) ===== */
let _imExpanded = {};
let _imSelected = {}; // keyed by item id: true/false
let _imFilter = { clientId: '', status: '' }; // '' = all
let _imToolbarRendered = false;
var _imActiveChallanId = null;

/* Unified IM sort accessor (Phase 8D) */
function getIMSortConfig() {
  if (_isDesktop && _imFilter.desktopSort) return _imFilter.desktopSort;
  return null; // mobile uses inline sort logic, not config-driven
}

function getIMStatus(im) {
  const total = im.items.length;
  const invoicedCount = im.items.filter(it => it.invoiced).length;
  if (invoicedCount === 0) return 'pending';
  if (invoicedCount < total) return 'partial';
  return 'invoiced';
}

function getFilteredIM() {
  let list = [...(S.incomingMaterial || [])];
  if (_imFilter.clientId) {
    const cid = parseInt(_imFilter.clientId);
    list = list.filter(im => im.clientId === cid);
  }
  if (_imFilter.status) {
    list = list.filter(im => getIMStatus(im) === _imFilter.status);
  }
  // Sort: desktop uses multi-column, mobile uses pending-first + date desc
  if (_isDesktop) {
    var sc = getIMSortConfig();
    if (sc) {
      var dir = sc.dir === 'asc' ? 1 : -1;
      list.sort(function(a, b) {
        var va, vb;
        switch (sc.col) {
          case 'client': va = (a.clientName || '').toLowerCase(); vb = (b.clientName || '').toLowerCase(); return va < vb ? -dir : va > vb ? dir : 0;
          case 'date': va = a.challanDate || ''; vb = b.challanDate || ''; return va < vb ? -dir : va > vb ? dir : 0;
          case 'items': return dir * (a.items.length - b.items.length);
          case 'amount': {
            var ta = a.items.reduce(function(s, it) { return s + (it.amount || 0); }, 0);
            var tb = b.items.reduce(function(s, it) { return s + (it.amount || 0); }, 0);
            return dir * (ta - tb);
          }
          case 'status': {
            var so = { pending: 0, partial: 1, invoiced: 2 };
            va = so[getIMStatus(a)] || 0;
            vb = so[getIMStatus(b)] || 0;
            return dir * (va - vb);
          }
          default: va = a.challanDate || ''; vb = b.challanDate || ''; return va < vb ? -dir : va > vb ? dir : 0;
        }
      });
    } else {
      // Desktop with no explicit sort: same as mobile default
      list.sort(function(a, b) {
        var sa = getIMStatus(a) === 'invoiced' ? 1 : 0;
        var sb = getIMStatus(b) === 'invoiced' ? 1 : 0;
        if (sa !== sb) return sa - sb;
        return (b.challanDate || '').localeCompare(a.challanDate || '') || (b.createdAt || 0) - (a.createdAt || 0);
      });
    }
  } else {
    list.sort(function(a, b) {
      var sa = getIMStatus(a) === 'invoiced' ? 1 : 0;
      var sb = getIMStatus(b) === 'invoiced' ? 1 : 0;
      if (sa !== sb) return sa - sb;
      return (b.challanDate || '').localeCompare(a.challanDate || '') || (b.createdAt || 0) - (a.createdAt || 0);
    });
  }
  return list;
}

    '<option value=""' + (!_imFilter.status ? ' selected' : '') + '>All Status</option>' +
    '<option value="pending"' + (_imFilter.status === 'pending' ? ' selected' : '') + '>Pending</option>' +
    '<option value="partial"' + (_imFilter.status === 'partial' ? ' selected' : '') + '>Partial</option>' +

}

function renderIMList() {

    html += '<div class="inv-empty-state">No incoming material found</div>';

      const challanTotal = im.items.reduce((s, it) => s + (it.amount || 0), 0);
      const pendingItems = im.items.filter(it => !it.invoiced);

        (status !== 'invoiced' ? '<input type="checkbox" class="inv-im-check" data-action="invCheckIMChallan" data-id="' + escHtml(im.id) + '"' + (allPendingChecked ? ' checked' : '') + '>' : '') +
        '<div class="inv-im-info">' +

        ' <span class="inv-im-status inv-im-status-' + status + '">' + status + '</span></div>' +
        '<div class="inv-im-client">' + escHtml(im.clientName) + '</div>' +
        '<div class="inv-im-meta">' + formatDate(im.challanDate) +
        (im.vehicleNo ? ' &middot; ' + escHtml(im.vehicleNo) : '') +
        ' &middot; ' + im.items.length + ' item' + (im.items.length > 1 ? 's' : '') + '</div></div>' +
        '<span class="inv-im-amount">' + formatCurrency(challanTotal) + '</span>' +
        '<svg class="inv-im-chevron' + (expanded ? ' inv-im-chevron-open' : '') + '" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>';

      // Line items (expandable)
      html += '<div class="inv-im-items' + (expanded ? ' inv-im-items-open' : '') + '">';
      im.items.forEach(it => {
        const itemInvoiced = it.invoiced;
        var invBadgeHtml = '';
        if (itemInvoiced) {

          if (linkedInv) {
            var shortNum = linkedInv.invoiceNumber || linkedInv.displayNumber;
            invBadgeHtml = '<span class="inv-im-status inv-im-status-invoiced inv-mono" title="' + escHtml(linkedInv.displayNumber) + '">INV ' + escHtml(shortNum) + '</span>';
          } else {
            invBadgeHtml = '<span class="inv-im-status inv-im-status-orphan" title="Invoice deleted — tap to repair">INV (missing)</span>';
          }
        }
        html += '<div class="inv-im-item' + (itemInvoiced ? ' inv-im-item-invoiced' : '') + '">' +
          (!itemInvoiced ? '<input type="checkbox" class="inv-im-check" data-action="invCheckIMItem" data-item-id="' + escHtml(it.id) + '"' + (_imSelected[it.id] ? ' checked' : '') + '>' :
          invBadgeHtml) +
          '<div class="inv-im-item-info">' +
          '<div class="inv-im-item-desc">' + escHtml(it.desc || it.partNumber) + '</div>' +
          '<div class="inv-im-item-detail">' + escHtml(it.qty) + ' ' + escHtml(it.unit) +
          (it.nosQty && it.nosQty > 0 ? ' (' + escHtml(it.nosQty) + ' NOS)' : '') +
          ' @ ' + formatCurrency(it.rate) + '/' + escHtml(it.unit) + '</div></div>' +
          '<span class="inv-im-item-amount">' + formatCurrency(it.amount) + '</span></div>';
      });
      // Delete + Edit buttons (only if zero items invoiced)
      if (status !== 'invoiced' && im.items.filter(it => it.invoiced).length === 0) {
        html += '<div class="inv-btn-bar inv-im-delete-bar">' +
          '<button class="inv-btn inv-btn-ghost inv-btn-sm" data-action="invEditChallan" data-id="' + escHtml(im.id) + '">Edit</button>' +
          '<button class="inv-btn inv-btn-ghost inv-btn-sm inv-text-danger" data-action="invDeleteChallan" data-id="' + escHtml(im.id) + '">Delete Challan</button></div>';
      } else if (status !== 'invoiced') {
        // Partially invoiced: show disabled edit with toast guard
        var invoicedItemCount = im.items.filter(function(it2) { return it2.invoiced; }).length;
        html += '<div class="inv-btn-bar inv-im-delete-bar">' +
          '<button class="inv-btn inv-btn-ghost inv-btn-sm inv-btn-disabled" data-action="invEditChallanGuard" data-count="' + invoicedItemCount + '">Edit</button></div>';
      }
      html += '</div></div>';
    });
  }
  area.innerHTML = html;
  renderIMSelBar();
}

function renderIMSelBar() {
  const bar = document.getElementById('imSelBar');
  const fab = document.getElementById('imFabBar');
  if (!bar) return;
  const selectedIds = Object.keys(_imSelected).filter(k => _imSelected[k]);
  if (selectedIds.length === 0) {
    bar.innerHTML = '';
    if (fab) fab.classList.remove('inv-hidden');
    return;
  }
  if (fab) fab.classList.add('inv-hidden');
  // Calculate total of selected items
  let total = 0;
  (S.incomingMaterial || []).forEach(im => {
    im.items.forEach(it => {
      if (_imSelected[it.id]) total += (it.amount || 0);
    });
  });
  // Check if all selected items belong to one client
  const clientIds = new Set();
  (S.incomingMaterial || []).forEach(im => {
    im.items.forEach(it => {
      if (_imSelected[it.id]) clientIds.add(im.clientId);
    });
  });
  const multiClient = clientIds.size > 1;

  bar.innerHTML = '<div class="inv-im-sel-bar">' +
    '<span class="inv-im-sel-count">' + selectedIds.length + ' item' + (selectedIds.length > 1 ? 's' : '') +
    ' &middot; ' + formatCurrency(total) + '</span>' +
    '<button class="inv-im-sel-btn" data-action="invCreateFromIM"' + (multiClient ? ' disabled title="Select items from one client only"' : '') + '>' +
    (multiClient ? 'Multi-client' : 'Create Invoice') + '</button></div>';
}

/* ===== IM DESKTOP TABLE (Phase 8D) ===== */

function _buildIMTableHtml() {
  var filtered = getFilteredIM();
  var pendingCount = filtered.filter(function(im) { return getIMStatus(im) !== 'invoiced'; }).length;

  var html = '<div class="inv-im-summary">' +
    '<span class="inv-reg-summary-label">' + filtered.length + ' challan' + (filtered.length !== 1 ? 's' : '') +
    ' (' + pendingCount + ' pending)</span></div>';

  if (filtered.length === 0) {
    html += '<div class="inv-empty-state">No incoming material found</div>';
    return html;
  }

  var sc = getIMSortConfig();

  html += '<table class="inv-desktop-table"><thead><tr>';
  html += '<th class="inv-th inv-td-check"></th>';
  html += '<th class="inv-th inv-td-challan">Challan</th>';

  var cols = [
    { key: 'client', label: 'Client', cls: '' },
    { key: 'date', label: 'Date', cls: 'inv-td-date' },
    { key: 'items', label: 'Items', cls: 'inv-td-items' },
    { key: 'amount', label: 'Amount', cls: 'inv-td-amount inv-th-amount' },
    { key: 'status', label: 'Status', cls: 'inv-td-status' }
  ];
  cols.forEach(function(c) {
    html += '<th class="inv-th inv-th-sortable' + (c.cls ? ' ' + c.cls : '') + '" data-action="invDesktopIMSort" data-col="' + c.key + '">' +
      c.label + (sc && sc.col === c.key ? '<span class="inv-sort-arrow">' + (sc.dir === 'asc' ? '\u25B2' : '\u25BC') + '</span>' : '') +
      '</th>';
  });
  html += '</tr></thead><tbody>';

  filtered.forEach(function(im) {
    var status = getIMStatus(im);
    var isActive = _imActiveChallanId === im.id;
    var challanTotal = im.items.reduce(function(s, it) { return s + (it.amount || 0); }, 0);
    var pendingItems = im.items.filter(function(it) { return !it.invoiced; });
    var allPendingChecked = pendingItems.length > 0 && pendingItems.every(function(it) { return _imSelected[it.id]; });

    html += '<tr class="inv-tr' + (isActive ? ' inv-tr-active' : '') + '" data-id="' + escHtml(im.id) + '">';

    // Checkbox cell
    if (status !== 'invoiced') {
      html += '<td class="inv-td inv-td-check"><input type="checkbox" data-action="invCheckIMChallan" data-id="' + escHtml(im.id) + '"' + (allPendingChecked ? ' checked' : '') + '></td>';
    } else {
      html += '<td class="inv-td inv-td-check"></td>';
    }

    // Challan number (monospace)
    html += '<td class="inv-td inv-td-challan" data-action="invSelectIMRow" data-id="' + escHtml(im.id) + '">' +
      (im.challanNo ? escHtml(im.challanNo) : '\u2014') + '</td>';

    // Content cells — all get invSelectIMRow
    html += '<td class="inv-td" data-action="invSelectIMRow" data-id="' + escHtml(im.id) + '">' + escHtml(im.clientName) + '</td>';
    html += '<td class="inv-td inv-td-date" data-action="invSelectIMRow" data-id="' + escHtml(im.id) + '">' + formatDate(im.challanDate) + '</td>';
    html += '<td class="inv-td inv-td-items" data-action="invSelectIMRow" data-id="' + escHtml(im.id) + '">' + im.items.length + '</td>';
    html += '<td class="inv-td inv-td-amount" data-action="invSelectIMRow" data-id="' + escHtml(im.id) + '">' + formatCurrency(challanTotal) + '</td>';

    // Status badge (inline, no helper function)
    html += '<td class="inv-td inv-td-status" data-action="invSelectIMRow" data-id="' + escHtml(im.id) + '">' +
      '<span class="inv-im-status inv-im-status-' + status + '">' + status + '</span></td>';

    html += '</tr>';
  });

  html += '</tbody></table>';

  // IM FAB bar (Add Challan + Scan buttons visible on desktop too)
  html += '<div class="inv-im-fab-bar" id="imFabBarDesktop">' +
    '<button class="inv-btn inv-btn-primary" data-action="invShowAddChallan">Add Challan</button>' +
    '<button class="inv-btn inv-btn-ghost" data-action="invScanChallan">Scan</button></div>';

  return html;
}

/* Render challan detail inline in #imDetail (Phase 8D) */
function _renderIMDetail(challanId, skipMasterRefresh) {
  var im = (S.incomingMaterial || []).find(function(m) { return m.id === challanId; });
  if (!im) {
    _imActiveChallanId = null;
    var detail = document.getElementById('imDetail');
    if (detail) detail.innerHTML = _renderDetailEmpty();
    if (!skipMasterRefresh) {
      var master = document.getElementById('imMaster');
      if (master) master.innerHTML = _buildIMTableHtml();
    }
    return;
  }

  _imActiveChallanId = challanId;
  var status = getIMStatus(im);
  var challanTotal = im.items.reduce(function(s, it) { return s + (it.amount || 0); }, 0);
  var invoicedItemCount = im.items.filter(function(it) { return it.invoiced; }).length;

  var html = '';

  // Header: challan number + date
  html += '<div class="inv-detail-section">' +
    '<div class="inv-form-row">' +
    '<div><div class="inv-detail-label">Challan No</div><div class="inv-detail-value-mono">' +
    (im.challanNo ? escHtml(im.challanNo) : '\u2014') + '</div></div>' +
    '<div><div class="inv-detail-label">Date</div><div class="inv-detail-value-mono">' + formatDate(im.challanDate) + '</div></div></div></div>';

  // Client name
  html += '<div class="inv-detail-section">' +
    '<div class="inv-detail-label">Client</div>' +
    '<div class="inv-detail-value">' + escHtml(im.clientName) + '</div></div>';

  // Vehicle number (if present)
  if (im.vehicleNo) {
    html += '<div class="inv-detail-section">' +
      '<div class="inv-detail-label">Vehicle</div>' +
      '<div class="inv-detail-value">' + escHtml(im.vehicleNo) + '</div></div>';
  }

  // Status indicator
  html += '<div class="inv-detail-section">' +
    '<div class="inv-detail-label">Status</div>' +
    '<span class="inv-im-status inv-im-status-' + status + '">' + status + '</span></div>';

  // Line items with item-level checkboxes
  html += '<div class="inv-detail-section">' +
    '<div class="inv-detail-label">Items (' + im.items.length + ')</div>';
  im.items.forEach(function(it) {
    var itemInvoiced = it.invoiced;
    var invBadgeHtml = '';
    if (itemInvoiced) {
      var linkedInv = it.invoiceId ? S.invoices.find(function(iv) { return iv.id === it.invoiceId; }) : null;
      if (linkedInv) {
        var shortNum = linkedInv.invoiceNumber || linkedInv.displayNumber;
        invBadgeHtml = '<span class="inv-im-status inv-im-status-invoiced inv-mono" title="' + escHtml(linkedInv.displayNumber) + '">INV ' + escHtml(shortNum) + '</span>';
      } else {
        invBadgeHtml = '<span class="inv-im-status inv-im-status-orphan" title="Invoice deleted">INV (missing)</span>';
      }
    }
    html += '<div class="inv-im-item' + (itemInvoiced ? ' inv-im-item-invoiced' : '') + '">' +
      (!itemInvoiced ? '<input type="checkbox" class="inv-im-check" data-action="invCheckIMItem" data-item-id="' + escHtml(it.id) + '"' + (_imSelected[it.id] ? ' checked' : '') + '>' :
      invBadgeHtml) +
      '<div class="inv-im-item-info">' +
      '<div class="inv-im-item-desc">' + escHtml(it.desc || it.partNumber) + '</div>' +
      '<div class="inv-im-item-detail">' + escHtml(it.qty) + ' ' + escHtml(it.unit) +
      (it.nosQty && it.nosQty > 0 ? ' (' + escHtml(it.nosQty) + ' NOS)' : '') +
      ' @ ' + formatCurrency(it.rate) + '/' + escHtml(it.unit) + '</div></div>' +
      '<span class="inv-im-item-amount">' + formatCurrency(it.amount) + '</span></div>';
  });
  html += '</div>';

  // Total amount
  html += '<div class="inv-detail-section"><div class="inv-totals">' +
    '<div class="inv-total-row inv-total-row-grand"><span class="inv-total-label">Total</span>' +
    '<span class="inv-total-grand">' + formatCurrency(challanTotal) + '</span></div></div></div>';

  // Action buttons
  if (invoicedItemCount === 0) {
    // Zero items invoiced: Edit + Delete
    html += '<div class="inv-detail-actions">' +
      '<button class="inv-btn inv-btn-primary" data-action="invEditChallan" data-id="' + escHtml(im.id) + '">Edit</button>' +
      '<button class="inv-btn inv-btn-danger" data-action="invDeleteChallan" data-id="' + escHtml(im.id) + '">Delete</button></div>';
  } else if (status !== 'invoiced') {
    // Partially invoiced: disabled edit with guard
    html += '<div class="inv-detail-actions">' +
      '<button class="inv-btn inv-btn-ghost inv-btn-disabled" data-action="invEditChallanGuard" data-count="' + invoicedItemCount + '">Edit</button></div>';
  }
  // Fully invoiced: no action buttons (read-only)

  // Notes
  if (im.notes) {
    html += '<div class="inv-detail-section">' +
      '<div class="inv-detail-label">Notes</div>' +
      '<div class="inv-detail-value">' + escHtml(im.notes) + '</div></div>';
  }

  var detailEl = document.getElementById('imDetail');
  if (detailEl) detailEl.innerHTML = html;

  // Update master to show active row highlight
  if (!skipMasterRefresh) {
    var masterEl = document.getElementById('imMaster');
    if (masterEl) masterEl.innerHTML = _buildIMTableHtml();
  }
}

function renderIMTable() {
  var area = document.getElementById('imList');
  if (!area) return;

  if (!_imToolbarRendered) {
    renderIMToolbar();
    _imToolbarRendered = true;
  }

  var wrapper = document.getElementById('imMasterDetail');
  if (!wrapper) {
    // First render — build wrapper, init drag, restore width
    area.innerHTML =
      '<div class="inv-master-detail" id="imMasterDetail">' +
        '<div class="inv-master" id="imMaster"></div>' +
        '<div class="inv-drag-handle" id="imDragHandle"></div>' +
        '<div class="inv-detail" id="imDetail">' + _renderDetailEmpty() + '</div>' +
      '</div>';
    _initDragHandle('imDragHandle', 'imMaster', 'imDetail', 'pageIM');
    _restorePanelWidth('imMaster', 'pageIM');
  }

  // Re-render master content
  var master = document.getElementById('imMaster');
  if (!master) return;
  master.innerHTML = _buildIMTableHtml();

  // Detail panel validation: keep detail in sync with data changes
  if (_imActiveChallanId) {
    var stillExists = (S.incomingMaterial || []).find(function(m) { return m.id === _imActiveChallanId; });
    if (!stillExists) {
      // Deleted — clear detail
      _imActiveChallanId = null;
      var detail = document.getElementById('imDetail');
      if (detail) detail.innerHTML = _renderDetailEmpty();
    } else {
      // Check if active challan is still in filtered set
      var filtered = getFilteredIM();
      var inFiltered = filtered.find(function(m) { return m.id === _imActiveChallanId; });
      if (!inFiltered) {
        // Filtered out — clear detail
        _imActiveChallanId = null;
        var detail2 = document.getElementById('imDetail');
        if (detail2) detail2.innerHTML = _renderDetailEmpty();
      } else {
        // Still visible — refresh detail content (skip master since we just rendered it)
        _renderIMDetail(_imActiveChallanId, true);
      }
    }
  }

  renderIMSelBar();
}

/* View dispatcher (Phase 8B) */
function _renderIMView() {
  _isDesktop ? renderIMTable() : renderIMList();
}

function toggleIMExpand(imId) {
  _imExpanded[imId] = !_imExpanded[imId];
  _renderIMView();
}

/* Read the IM filters, and drop the selection they hide.
   Rows filtered off the screen stayed ticked, and Create Invoice From IM acts
   on the whole selection — so material the operator could no longer see went
   onto the invoice. Same shape as the register's, and the same fix. */
function captureIMFilters() {
  var icf = document.getElementById('imClientFilter');
  var isf = document.getElementById('imStatusFilter');
  if (icf) _imFilter.clientId = icf.value;
  if (isf) _imFilter.status = isf.value;
  _imSelected = {};
  _renderIMView();
}

function toggleIMItem(itemId) {
  _imSelected[itemId] = !_imSelected[itemId];
  if (!_imSelected[itemId]) delete _imSelected[itemId];
  _renderIMView();
}

function toggleIMChallan(imId) {
  const im = (S.incomingMaterial || []).find(m => m.id === imId);
  if (!im) return;
  const pendingItems = im.items.filter(it => !it.invoiced);
  const allChecked = pendingItems.every(it => _imSelected[it.id]);
  pendingItems.forEach(it => {
    if (allChecked) {
      delete _imSelected[it.id];
    } else {
      _imSelected[it.id] = true;
    }
  });
  _renderIMView();
}

function createInvoiceFromIM() {
  const selectedIds = Object.keys(_imSelected).filter(k => _imSelected[k]);
  if (selectedIds.length === 0) return;

  // Collect selected items and determine client
  const selectedItems = [];
  const linkedIMIds = new Set();
  const clientIds = new Set();
  let clientId = null;
  (S.incomingMaterial || []).forEach(im => {
    im.items.forEach(it => {
      if (_imSelected[it.id]) {
        selectedItems.push({ ...it, _imId: im.id, _challanNo: im.challanNo, _challanDate: im.challanDate, _vehicleNo: im.vehicleNo });
        linkedIMIds.add(im.id);
        clientIds.add(im.clientId);
        clientId = im.clientId;
      }
    });
  });

  /* An invoice is addressed to one customer. This used to take whichever
     challan happened to come last in the array — the loop above simply
     overwrote clientId — so a selection spanning two clients produced one
     invoice carrying both clients' material, billed to one of them and priced
     off that one's rate card. Reachable without any filter at all: the IM list
     defaults to All Clients, so two challans from two customers sit next to
     each other and both can be ticked. */
  if (clientIds.size > 1) {
    var names = Array.from(clientIds).map(function(cid) {
      var c = S.clients.find(function(x) { return x.id === cid; });
      return c ? c.name : ('client ' + cid);
    });
    showToast('One invoice, one customer — this selection spans ' + names.join(' and '), 'error');
    return;
  }

  if (!clientId) return;
  const client = S.clients.find(c => c.id === clientId);
  if (!client) return;

  // Build invoice form
  invoiceForm = {
    clientId: clientId,
    date: localDateStr(),
    items: selectedItems.map(it => ({
      partNumber: it.partNumber,
      desc: it.desc,
      hsn: it.hsn || '998873',
      unit: it.unit,
      qty: it.qty,
      rate: it.rate || 0,
      amount: it.amount || 0,
      nosQty: it.nosQty || null,
      _override: false,
      _label: '',
      _imItemId: it.id
    })),
    poNumber: '', poDate: localDateStr(),
    challanNo: selectedItems.map(it => it._challanNo).filter(Boolean).filter((v,i,a) => a.indexOf(v) === i).join(', '),
    challanDate: selectedItems[0]._challanDate || localDateStr(),
    despatchDate: localDateStr(), transport: selectedItems.map(it => it._vehicleNo).filter(Boolean).filter((v,i,a) => a.indexOf(v) === i).join(', '), eWayBill: '',
    remarks: '',
    editingId: null,
    _linkedIMItemIds: selectedIds,
    _linkedIMIds: [...linkedIMIds]
  };

  // Clear selection
  _imSelected = {};

  renderCreateForm();
  switchTab('pageCreate');
  showToast(selectedItems.length + ' item' + (selectedItems.length > 1 ? 's' : '') + ' loaded from incoming material');
}

/* ===== PART AUTOCOMPLETE (Phase 3) ===== */
function searchParts(query) {
  if (!query || query.length < 1) return [];
  const q = query.toLowerCase();
  const matches = [];
  for (let i = 0; i < S.items.length && matches.length < 8; i++) {
    const item = S.items[i];
    if ((item.partNumber || '').toLowerCase().includes(q) ||
        (item.desc || '').toLowerCase().includes(q) ||
        (item.gauge || '').toLowerCase().includes(q)) {
      matches.push(item);
    }
  }
  return matches;
}

/* The printed line description for a catalogue part.
   Folds the gauge back in, because the gauge is what tells two rows of the same
   part apart and the line text is the only place a reader of the document sees
   it. Four clamp families exist in two gauges at different rates — CLAMP 165X83
   (NT) at 35X6 and 40X6, and three more — so a line reading just "Clamp 165x83"
   does not say which one was plated, on the invoice or afterwards.
   Shared by the invoice and challan paths: the challan path used to assign
   part.desc raw and drop the gauge, and since IM is the billing spine that
   omission flowed straight through to the invoice. */
function partLineDesc(part) {
  if (!part) return '';
  return part.desc && part.gauge ? part.desc + ' (' + part.gauge + ')'
       : (part.desc || part.gauge || '');
}

/* A part not yet in the master used to end data entry: the dropdown simply
   vanished, and the only way forward was to leave for the Items tab, add it,
   and come back to a form that no longer held what had been typed. The last
   row of the list now offers to create it in place. */
var AC_MIN_NEW = 2;

function renderAddPartOption(idx, idPrefix, query, kind) {
  return '<div class="inv-autocomplete-item inv-ac-add" role="option" id="' + idPrefix + idx + '_new"' +
    ' data-ac-new="1" data-action="invAddItemInline" data-kind="' + kind + '"' +
    ' data-idx="' + idx + '" data-q="' + escHtml(query) + '">' +
    '<svg class="inv-ac-add-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">' +
    '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
    '<span class="inv-autocomplete-part">Add &ldquo;' + escHtml(query) + '&rdquo;</span>' +
    '<span class="inv-autocomplete-desc">new item in the master</span></div>';
}

/* Render the suggestion rows for one part input. Shared by the invoice form
   and the challan form, which differ only in the action and element ids. */
function renderPartOptions(acEl, matches, action, idx, idPrefix, query, kind) {
  // The gauge is shown as its own badge: several clamp part numbers exist in
  // more than one gauge, and it is the only thing telling those rows apart.
  var html = matches.map((m, i) =>
    '<div class="inv-autocomplete-item" role="option" id="' + idPrefix + idx + '_' + i + '"' +
    ' data-action="' + action + '" data-idx="' + idx + '" data-part-id="' + m.id + '">' +
    '<span class="inv-autocomplete-part">' + escHtml(m.partNumber) + '</span>' +
    (m.gauge ? '<span class="inv-gauge-badge">' + escHtml(m.gauge) + '</span>' : '') +
    '<span class="inv-autocomplete-desc">' + escHtml(m.desc || '') + '</span></div>'
  ).join('');
  // Offered even when there are matches: a new gauge of an existing clamp
  // matches the part number but is a different part, and that is precisely the
  // case where the registry needs a row it does not have.
  if (query && query.length >= AC_MIN_NEW) html += renderAddPartOption(idx, idPrefix, query, kind);
  acEl.innerHTML = html;
}

/* The list now stays open on zero matches, because that is exactly the moment
   the operator needs to create the part. It closes only when there is neither
   a match nor enough typed to name a new one. */
function _showPartAC(acElId, inputSel, idx, query, action, idPrefix, kind) {
  const acEl = document.getElementById(acElId);
  if (!acEl) return;
  const input = document.querySelector(inputSel);
  const matches = searchParts(query);
  const q = (query || '').trim();
  acReset();
  if (matches.length === 0 && q.length < AC_MIN_NEW) {
    acEl.classList.add('inv-hidden');
    if (input) input.setAttribute('aria-expanded', 'false');
    return;
  }
  acEl.classList.remove('inv-hidden');
  renderPartOptions(acEl, matches, action, idx, idPrefix, q, kind);
  if (input) input.setAttribute('aria-expanded', 'true');
}

function showPartAutocomplete(idx, query) {
  _showPartAC('invPartAC' + idx,
    '[data-action="invEditLinePart"][data-idx="' + idx + '"]',
    idx, query, 'invSelectPart', 'invPartOpt', 'invoice');
}

/* Same, for the IM challan form. */
function showChallanPartAutocomplete(idx, query) {
  _showPartAC('imPartAC' + idx,
    '[data-action="invEditChallanPart"][data-idx="' + idx + '"]',
    idx, query, 'invSelectChallanPart', 'imPartOpt', 'challan');
}

function dismissAllAutocomplete() {
  document.querySelectorAll('.inv-autocomplete-list').forEach(el => el.classList.add('inv-hidden'));
  document.querySelectorAll('[role="combobox"]').forEach(el => el.setAttribute('aria-expanded', 'false'));
  acReset();
}

/* ===== SUGGESTION LIST KEYBOARD NAVIGATION =====
   Both suggestion surfaces — the part autocomplete and the client search —
   were pointer-only: the list rendered, and the only way into it was a click.
   Only one list can be open at a time, so a single cursor covers both. It is
   held as an index rather than an element reference because the list is
   rebuilt on every keystroke. */
var _acCursor = -1;

function acReset() { _acCursor = -1; }

/* The open suggestion list belonging to an input, or null. */
function acListFor(input) {
  if (!input || !input.closest) return null;
  const wrap = input.closest('.inv-autocomplete-wrap');
  if (wrap) {
    const list = wrap.querySelector('.inv-autocomplete-list');
    return list && !list.classList.contains('inv-hidden') ? list : null;
  }
  const searchWrap = input.closest('.inv-search-wrap');
  if (searchWrap) {
    const results = searchWrap.querySelector('.inv-search-results');
    return results && !results.classList.contains('inv-hidden') ? results : null;
  }
  return null;
}

function acOptions(list) {
  if (!list) return [];
  return Array.prototype.slice.call(list.querySelectorAll('.inv-autocomplete-item, .inv-search-item'));
}

/* Move the highlight, wrapping at both ends. */
function acMoveCursor(list, delta) {
  const opts = acOptions(list);
  if (opts.length === 0) { _acCursor = -1; return; }
  let next = _acCursor + delta;
  if (next < 0) next = opts.length - 1;
  if (next >= opts.length) next = 0;
  _acCursor = next;
  opts.forEach((opt, i) => {
    if (i === next) {
      opt.classList.add('inv-ac-active');
      opt.setAttribute('aria-selected', 'true');
    } else {
      opt.classList.remove('inv-ac-active');
      opt.removeAttribute('aria-selected');
    }
  });
  const active = opts[next];
  if (active) {
    if (active.scrollIntoView) active.scrollIntoView({ block: 'nearest' });
    const input = list.closest('.inv-autocomplete-wrap, .inv-search-wrap');
    const combo = input ? input.querySelector('[role="combobox"]') : null;
    if (combo && active.id) combo.setAttribute('aria-activedescendant', active.id);
  }
}

/* The option Enter should commit: the highlighted one, or a lone match —
   a single suggestion is unambiguous, so requiring an arrow press first
   would just be an extra keystroke. */
function acPendingOption(list) {
  const opts = acOptions(list);
  if (_acCursor >= 0 && opts[_acCursor]) return opts[_acCursor];
  // The "add new" row is present on almost every list, so counting it would
  // have quietly ended the lone-match shortcut — one real suggestion plus the
  // add row is two options, and Enter would have stopped committing. It is
  // also never what an unaimed Enter should do: typing a part and pressing
  // Enter means "on to the quantity", not "open a dialog".
  const real = opts.filter(o => !o.dataset.acNew);
  return real.length === 1 ? real[0] : null;
}

function selectPartForLine(idx, partId) {
  const part = S.items.find(p => p.id === partId);
  if (!part) return;
  const item = invoiceForm.items[idx];
  if (!item) return;
  item.partNumber = part.partNumber;
  item.desc = partLineDesc(part);
  item.hsn = part.hsn || '998873';
  item.unit = part.unit || 'KG';

  const client = invoiceForm.clientId ? S.clients.find(c => c.id === invoiceForm.clientId) : null;
  if (client) {
    const rateInfo = getLineItemRate(client, invoiceForm.date, item.partNumber);
    if (rateInfo._override) {
      item.rate = rateInfo.rate;
      item._override = true;
      item._label = rateInfo._label;
    } else {
      item.rate = rateInfo.ratePerKg || 0;
      item._override = false;
      item._label = '';
    }
    recalcLineItem(item, client);
  }

  dismissAllAutocomplete();
  captureOptionalFields();
  renderCreateForm();
}


/* Commit a catalogue part into a challan line. Lifted out of the event switch
   so the inline add can reach the same code the dropdown does — two ways to
   choose a part, one place that knows what choosing one means. */
function selectChallanPartForLine(idx, partId) {
  if (!_challanForm) return;
  const part = S.items.find(p => p.id === partId);
  if (!part) return;
  const cItem = _challanForm.items[idx];
  if (!cItem) return;

  cItem.partNumber = part.partNumber;
  // Same folding as the invoice path: the gauge is what tells two rows of the
  // same clamp apart, and dropping it here carried the ambiguity into every
  // invoice raised off the challan.
  cItem.desc = partLineDesc(part);
  cItem.hsn = part.hsn || '998873';
  cItem.unit = part.unit || 'KG';

  const cClient = _challanForm.clientId ? S.clients.find(c => c.id === _challanForm.clientId) : null;
  if (cClient) {
    const cRateInfo = getLineItemRate(cClient, _challanForm.challanDate || localDateStr(), cItem.partNumber);
    cItem.rate = cRateInfo._override ? cRateInfo.rate : (cRateInfo.ratePerKg || 0);
    recalcChallanLine(cItem, cClient);
  }

  dismissAllAutocomplete();
  captureChallanFields();
  // The part is settled; weight is what gets typed next.
  _challanFocusNext = { k: 'qty-' + idx, sel: null };
  renderAddChallanForm();
}

/* ===== INLINE ITEM CREATION ===== */
/* Where to return once the item exists. Held here rather than threaded through
   the overlay because the overlay is shared with the Items tab, which has no
   line to return to. Cleared whenever that tab opens the same form, so a
   cancelled inline add can never redirect a later ordinary one. */
var _inlineItemReturn = null;

function openInlineItemAdd(kind, idx, query) {
  dismissAllAutocomplete();
  _inlineItemReturn = { kind: kind, idx: idx };
  // Prefilled from what was typed, so the operator is confirming rather than
  // retyping. Description mirrors the part number — the common shape in this
  // registry — and stays editable.
  _showItemOverlay({
    id: 0, partNumber: query, desc: query, gauge: '',
    hsn: '998873', unit: 'KG', rate: 0, stdWeightKg: null
  }, true);
}

/* Called by saveItem once the row exists. Returns true when it handled the
   return, so the Items tab refresh is skipped. */
function finishInlineItemAdd(newItem) {
  if (!_inlineItemReturn || !newItem) return false;
  const ret = _inlineItemReturn;
  _inlineItemReturn = null;
  closeOverlay();
  if (ret.kind === 'challan') selectChallanPartForLine(ret.idx, newItem.id);
  else selectPartForLine(ret.idx, newItem.id);
  return true;
}

    challanDate: inv.challanDate ? formatDate(inv.challanDate) : '',

}

/* The certificate's own reference. Derived from the invoice line rather than
   drawn from a counter: regenerating a certificate must yield the same number
   it did the first time, and a derived reference cannot gap, cannot be voided,
   and needs no ledger of its own to explain itself. It also reads backwards —
   the number names the exact invoice line the certificate certifies. */
function qcCertNumber(inv, lineIdx) {
  return 'QC/' + (inv.displayNumber || inv.invoiceNumber || '') + '/' +
    String(lineIdx + 1).padStart(2, '0');
}

/* Net Wt. is the kilograms of this part in this dispatch — per consignment, not
   per piece (settled with the owner; the approved reference left it at 0.000 and
   never said which). It sits beside Quantity in the same table, so it is scoped
   to the same line the certificate certifies, not to the whole invoice.

   Only ever a weight the invoice itself was priced on. Three cases:  */
function qcNetWeight(inv, item) {
  // 1. A KG line's quantity IS kilograms — the same figure that was billed.
  //    Quantity and Net Wt. reading alike is correct on weight-billed work; the
  //    form carries both fields because piece-billed parts make them differ.
  if ((item.unit || 'KG') === 'KG') return formatNum(item.qty, 3);

  var client = S.clients.find(function(c) { return c.id === inv.clientId; });

  // 2. A nos_to_weight line stores NOS, but the kilograms it was priced on are
  //    qty × the operator-entered figure in S.partWeights — the very arithmetic
  //    recalcLineItem() ran to produce the amount. Same measured fact, stored
  //    differently, so it certifies on the same footing as case 1. Absent that
  //    entry there is nothing measured to state, and it falls through.
  if (client && client.billingMode === 'nos_to_weight') {
    var w = (S.partWeights || {})[(item.partNumber || '').toUpperCase()] || 0;
    if (w > 0) return formatNum((item.qty || 0) * w, 3);
  }

  // 3. Piece-billed lines carry no measured weight. The Items Master figure for
  //    them is pieceRate ÷ ratePerKg — exact for tonnage and capacity share, but
  //    it is the rate card read backwards, and the customer who set that rate is
  //    the one being handed the certificate. Left blank rather than manufactured.
  return QC_SHOP_DATA.fixed.netWt;
}

/* Quantity as the certificate states it: three decimals, with the unit, because
   40 KG and 40 NOS are different consignments and the reference prints a bare
   number. A nos_to_weight line carries both, so both are shown. */
function qcQuantity(item) {
  var qty = formatNum(item.qty, 3) + ' ' + (item.unit || 'KG');
  if (item.nosQty && item.nosQty > 0) qty += ' (' + formatNum(item.nosQty, 0) + ' NOS)';
  return qty;
}

/* One certificate descriptor per invoice line. */
function qcCertsForInvoice(inv) {
  var addr = inv.clientAddress || {};
  var addrHtml = [addr.add1, addr.add2, addr.add3]
    .filter(function(l) { return l; })
    .map(escHtml)
    .join('<br>');

  return (inv.items || []).map(function(item, idx) {
    var partNo = item.partNumber || item.desc || '';
    // The gauge is part of a part's identity — two rows can share a part number
    // at different gauges and different weights. It is folded into `desc` at
    // entry by partLineDesc(), so carrying the description through carries the
    // gauge onto the certificate without a second registry lookup.
    var partDesc = (item.desc && item.desc !== partNo) ? item.desc : '';
    return {
      certNo: qcCertNumber(inv, idx),
      issueDate: formatDateExport(inv.date),
      customerName: inv.clientName || '',
      customerAddrHtml: addrHtml,
      invoiceNo: inv.displayNumber || '',
      poRef: inv.poNumber || '',
      challanNo: inv.challanNo || '',
      challanDate: inv.challanDate ? formatDateExport(inv.challanDate) : '',
      partNo: partNo,
      partDesc: partDesc,
      quantity: qcQuantity(item),
      netWt: qcNetWeight(inv, item)
    };
  });
}

/* Resolve a selection of invoice ids into printable certificates.
   Returns what was excluded as well as what was built — a certificate that
   silently goes missing from a stack of forty is not noticed until the customer
   asks for it. */
function qcGatherCerts(invIds) {
  var result = { certs: [], invoices: [], cancelled: 0, empty: 0, missing: 0 };

  var invoices = (invIds || []).map(function(id) {
    return S.invoices.find(function(i) { return i.id === id; });
  });

  invoices.forEach(function(inv) {
    if (!inv) { result.missing++; return; }
    // A cancelled tax invoice certifies nothing: the goods it names were never
    // billed. Certifying against it would put a quality declaration behind a
    // number that appears in GSTR-1 at zero.
    if (inv.status === 'cancelled') { result.cancelled++; return; }
    if (!(inv.items || []).length) { result.empty++; return; }
    result.invoices.push(inv);
  });

  // Book order, so a printed stack collates the way the register reads. Sorted
  // numerically rather than as text: app-issued numbers are zero-padded and
  // would sort the same either way, but an imported one need not be, and 9
  // after 10 in a stack of certificates is a filing error waiting to happen.
  result.invoices.sort(function(a, b) {
    var na = invNumInt(a.invoiceNumber);
    var nb = invNumInt(b.invoiceNumber);
    if (na == null || nb == null) {
      return String(a.displayNumber || '').localeCompare(String(b.displayNumber || ''));
    }
    return na - nb;
  });

  result.invoices.forEach(function(inv) {
    result.certs = result.certs.concat(qcCertsForInvoice(inv));
  });

  return result;
}

/* Render certificates into the shared print view, so Print / Save-as-PDF and
   the toolbar come from the same place the invoice preview uses. */
function showQualityCertificates(invIds) {
  var gathered = qcGatherCerts(invIds);

  if (gathered.certs.length === 0) {
    if (gathered.cancelled > 0) {
      showToast('Cancelled invoices cannot carry a quality certificate', 'error');
    } else if (gathered.empty > 0) {
      showToast('Nothing to certify — no line items on that invoice', 'warning');
    } else {
      showToast('Select an invoice to certify', 'warning');
    }
    return;
  }

  var body = document.getElementById('invPrintBody');
  if (!body) return;

  var html = _qcRunNoticeHtml(gathered) + '<div class="inv-qc-sheets">';
  gathered.certs.forEach(function(c, i) {
    html += '<div class="inv-qc-page' + (i < gathered.certs.length - 1 ? ' inv-qc-page-break' : '') + '">' +
      buildQualityCertHtml(c) + '</div>';
  });
  body.innerHTML = html + '</div>';

  document.getElementById('invPrintView').classList.add('inv-print-view-active');
  document.body.style.overflow = 'hidden';

  // Drives the filename when the browser saves the preview as a PDF.
  document._savedTitle = document.title;
  var first = gathered.invoices[0];
  document.title = gathered.invoices.length === 1
    ? 'QC ' + (first.displayNumber || '') + ' - ' + (first.clientName || 'SEP')
    : 'Quality Certificates - ' + gathered.invoices.length + ' invoices';
}

/* What the run produced, and what it left out, stated at the top of the stack.
   Not a toast: the print view sits above the toast layer, so a toast raised
   here is painted underneath it and never seen — and a count that has to be
   read within three seconds is the wrong instrument anyway. This banner stays
   put while the stack is reviewed, and `@media print` drops it, so it cannot
   reach the customer. Same reasoning as the coverage note on the Stats cards:
   an exclusion is reported in place, never left to be inferred. */
function _qcRunNoticeHtml(gathered) {
  var msg = gathered.certs.length + ' certificate' + (gathered.certs.length !== 1 ? 's' : '') +
    ' for ' + gathered.invoices.length + ' invoice' + (gathered.invoices.length !== 1 ? 's' : '');

  var reasons = [];
  if (gathered.cancelled > 0) reasons.push(gathered.cancelled + ' cancelled');
  if (gathered.empty > 0) reasons.push(gathered.empty + ' with no line items');
  if (gathered.missing > 0) reasons.push(gathered.missing + ' no longer in the register');

  if (reasons.length === 0) {
    return '<div class="inv-qc-notice">' + escHtml(msg) + '</div>';
  }
  // A certificate missing from a stack of forty is not noticed until the
  // customer asks for it, so the shortfall is named rather than implied.
  return '<div class="inv-qc-notice inv-qc-notice-warn">' + escHtml(msg) +
    ' — skipped ' + escHtml(reasons.join(', ')) + '</div>';
}

/* How many of a selection would actually produce a certificate. Drives the
   count on the register's selection bar, so the button never promises pages it
   will not print. */
function qcEligibleCount(invIds) {
  return (invIds || []).filter(function(id) {
    var inv = S.invoices.find(function(i) { return i.id === id; });
    return inv && inv.status !== 'cancelled' && (inv.items || []).length > 0;
  }).length;
}
/* ===== CREDIT NOTES ===== */
/*
 * SSS Mehta hold a standing 2% discount on any payment batch spanning seven
 * days or more — a price paid for smoother cash flow, temporary but in force.
 * Each such batch ships as two documents: the sales register for the range, and
 * a credit note for 2% of it. So the **batch is the unit, not the invoice**,
 * which is why the 04/08/26 reference credits ₹5,902.12 against roughly ₹2.95L
 * of taxable — about a month of invoices, not the single one it names.
 *
 * That makes the register selection the natural input: tick the batch, export
 * its register, raise the credit note off the same set.
 *
 * The discount is computed on **value**, and the quantity is derived from it.
 * The reference proves the direction: 1092.98 × 5.40 = 5902.09, but it shows
 * 5902.12. Three paise of disagreement only happen if the rupees came first.
 *
 * Deviations from the reference, all deliberate — unlike the quality
 * certificate, no external approval binds this format:
 *   - "Amount Chargeable (in words)" states the Total. The reference printed
 *     the sub-total there, so the words disagreed with the figure beside them.
 *   - The tax-in-words line states total tax, not one of the two components.
 *   - Company identity comes from S.company, so the header and footer cannot
 *     disagree the way the reference's "SOMA ELECTRO PRODUCT" / "8-B, 1ST
 *     PHASE" did with its own footer.
 *   - The document names the batch it credits rather than one invoice of it.
 *     A consolidated credit note is legal, but it should say what it covers.
 */

var CN_DEFAULT_PCT = 2;
var CN_BATCH_MIN_DAYS = 7;
var CN_PARTICULARS = 'JOB WORK ( ELECTRO PLATING )';

/* Financial year tail of the credit note series, read off the invoice prefix so
   the two documents always agree on the year: 'SEP/2026-27/' → '26-27'. */
function cnFyShort() {
  var m = String(S.invPrefix || '').match(/(\d{4})\s*-\s*(\d{2,4})/);
  if (!m) return '';
  var y2 = m[2].length === 4 ? m[2].slice(2) : m[2];
  return m[1].slice(2) + '-' + y2;
}

function cnPadNum(n) { return String(n).padStart(3, '0'); }

function cnDisplayNumber(num) {
  var fy = cnFyShort();
  return 'CN/' + cnPadNum(num) + (fy ? '/' + fy : '');
}

function getCreditNotes() {
  if (!S.creditNotes) S.creditNotes = [];
  return S.creditNotes;
}

/* A credit note number is issued — the customer holds a document bearing it —
   so by the same rule that governs invoice numbers it may never be reused.
   It needs no separate void ledger, though: a credit note is cancelled, never
   deleted, which is the correct GST treatment anyway. The number stays in the
   series carrying its own explanation, and exports declare it at zero. */
function recomputeNextCnNumber() {
  var highest = 0;
  getCreditNotes().forEach(function(cn) {
    var n = parseInt(cn.cnNumber, 10);
    if (!isNaN(n) && n > highest) highest = n;
  });
  if (!S.cnNextNum || S.cnNextNum <= highest) S.cnNextNum = highest + 1;
  return S.cnNextNum;
}

/* Whole days between the earliest and latest invoice date in the batch. */
function cnBatchSpanDays(invoices) {
  var dates = invoices.map(function(i) { return i.date; }).filter(Boolean).sort();
  if (dates.length === 0) return 0;
  var a = new Date(dates[0] + 'T00:00:00');
  var b = new Date(dates[dates.length - 1] + 'T00:00:00');
  return Math.round((b - a) / 86400000) + 1;
}

/* Validate a selection as the base for one credit note, and say precisely what
   is wrong when it is not. Returning the reason rather than hiding the button
   is the difference between "you cannot" and "you cannot, because". */
function cnValidateSelection(invIds) {
  var invoices = (invIds || [])
    .map(function(id) { return S.invoices.find(function(i) { return i.id === id; }); })
    .filter(Boolean);

  var active = invoices.filter(function(i) { return i.status !== 'cancelled'; });
  var cancelled = invoices.length - active.length;

  if (active.length === 0) {
    return { ok: false, reason: 'Select the invoices this credit note covers', invoices: [] };
  }

  var clientIds = {};
  active.forEach(function(i) { clientIds[i.clientId] = true; });
  var names = Object.keys(clientIds);
  if (names.length > 1) {
    return {
      ok: false,
      reason: 'A credit note is addressed to one customer — the selection spans ' + names.length,
      invoices: []
    };
  }

  active.sort(function(a, b) { return String(a.date).localeCompare(String(b.date)); });
  return {
    ok: true,
    invoices: active,
    cancelledSkipped: cancelled,
    client: S.clients.find(function(c) { return c.id === active[0].clientId; }) || null,
    spanDays: cnBatchSpanDays(active)
  };
}

/* Compute the credit from the batch. Value first, quantity derived — the order
   the reference document was itself produced in. */
function cnCompute(invoices, client, pct, rate) {
  var batchTaxable = gstRound(invoices.reduce(function(s, i) { return s + (i.taxableValue || 0); }, 0));
  var taxable = gstRound(batchTaxable * (pct || 0) / 100);

  var gstType = (client && client.gstType) || 'intra';
  var cgstPer = gstType === 'intra' ? 9 : 0;
  var sgstPer = gstType === 'intra' ? 9 : 0;
  var igstPer = gstType === 'inter' ? 18 : 0;
  var cgstAmt = gstRound(taxable * cgstPer / 100);
  var sgstAmt = gstRound(taxable * sgstPer / 100);
  var igstAmt = gstRound(taxable * igstPer / 100);
  var grandTotal = gstRound(taxable + cgstAmt + sgstAmt + igstAmt);

  // Quantity exists to make the document readable as a job-work credit; it is
  // the kilograms the credited rupees correspond to at the contract rate, not a
  // separately measured figure. Zero rate would make it meaningless, so it is
  // left blank rather than dividing by zero.
  var qty = rate > 0 ? gstRound(taxable / rate) : 0;

  return {
    batchTaxable: batchTaxable,
    taxable: taxable,
    gstType: gstType,
    cgstPer: cgstPer, cgstAmt: cgstAmt,
    sgstPer: sgstPer, sgstAmt: sgstAmt,
    igstPer: igstPer, igstAmt: igstAmt,
    grandTotal: grandTotal,
    rate: rate, qty: qty
  };
}

/* The rate the batch was billed at, for the derived quantity. Read from the
   client ladder at the batch's own date, not today's — a rate change between
   the batch and the credit note must not silently restate the quantity. */
function cnBatchRate(client, invoices) {
  if (!client) return 0;
  var onDate = invoices.length ? invoices[invoices.length - 1].date : localDateStr();
  var info = getLineItemRate(client, onDate, '');
  return info.ratePerKg || 0;
}

/* ===== FORM ===== */
var _cnForm = null;

function openCreditNoteForm(invIds) {
  var v = cnValidateSelection(invIds);
  if (!v.ok) { showToast(v.reason, 'error'); return; }

  var rate = cnBatchRate(v.client, v.invoices);
  _cnForm = {
    invoiceIds: v.invoices.map(function(i) { return i.id; }),
    clientId: v.client ? v.client.id : null,
    pct: CN_DEFAULT_PCT,
    date: localDateStr(),
    vehicleNo: '',
    rate: rate,
    spanDays: v.spanDays,
    cancelledSkipped: v.cancelledSkipped
  };
  renderCreditNoteForm();
}

function renderCreditNoteForm() {
  if (!_cnForm) return;
  var invoices = _cnForm.invoiceIds
    .map(function(id) { return S.invoices.find(function(i) { return i.id === id; }); })
    .filter(Boolean);
  var client = S.clients.find(function(c) { return c.id === _cnForm.clientId; });
  var c = cnCompute(invoices, client, _cnForm.pct, _cnForm.rate);
  var from = invoices[0] ? invoices[0].date : '';
  var to = invoices[invoices.length - 1] ? invoices[invoices.length - 1].date : '';

  var html = '<div class="inv-overlay-card">' +
    '<div class="inv-overlay-header"><span class="inv-overlay-title">Raise Credit Note</span>' +
    '<button class="inv-overlay-close" data-action="invCloseOverlay" aria-label="Close">&times;</button></div>';

  html += '<div class="inv-detail-section">' +
    '<div class="inv-detail-label">Customer</div>' +
    '<div class="inv-detail-value">' + escHtml(client ? client.name : '') + '</div>' +
    '<div class="inv-detail-label inv-mt-8">Batch</div>' +
    '<div class="inv-detail-value">' + invoices.length + ' invoice' + (invoices.length !== 1 ? 's' : '') +
    ', ' + escHtml(formatDate(from)) + ' &ndash; ' + escHtml(formatDate(to)) +
    ' <span class="inv-text-muted">(' + _cnForm.spanDays + ' day' + (_cnForm.spanDays !== 1 ? 's' : '') + ')</span></div>' +
    '</div>';

  // The discount is for batches of a week or more. Split batches are the
  // operator's call, so this warns and does not block.
  if (_cnForm.spanDays < CN_BATCH_MIN_DAYS) {
    html += '<div class="inv-confirm-warn">This batch spans ' + _cnForm.spanDays + ' day' +
      (_cnForm.spanDays !== 1 ? 's' : '') + '. The standing discount is for batches of ' +
      CN_BATCH_MIN_DAYS + ' days or more — raise it anyway only if you mean to.</div>';
  }
  if (_cnForm.cancelledSkipped > 0) {
    html += '<div class="inv-confirm-warn">' + _cnForm.cancelledSkipped +
      ' cancelled invoice' + (_cnForm.cancelledSkipped !== 1 ? 's were' : ' was') +
      ' left out of the base — those goods were never billed.</div>';
  }

  html += '<div class="inv-form-row">' +
    '<div class="inv-form-group"><label class="inv-form-label">Discount %</label>' +
    '<input type="number" step="0.01" min="0" max="100" class="inv-form-input inv-mono" id="cnPct" value="' + escHtml(_cnForm.pct) + '" data-action="invCnInput"></div>' +
    '<div class="inv-form-group"><label class="inv-form-label">Credit note date</label>' +
    '<input type="date" class="inv-form-input inv-mono" id="cnDate" value="' + escHtml(_cnForm.date) + '" data-action="invCnInput"></div></div>';

  html += '<div class="inv-form-group"><label class="inv-form-label">Vehicle No. (optional)</label>' +
    '<input type="text" class="inv-form-input" id="cnVehicle" value="' + escHtml(_cnForm.vehicleNo) + '" data-action="invCnInput" autocomplete="off"></div>';

  html += '<div class="inv-totals">' +
    '<div class="inv-total-row"><span class="inv-total-label">Batch taxable</span><span class="inv-total-value">' + formatCurrency(c.batchTaxable) + '</span></div>' +
    '<div class="inv-total-row"><span class="inv-total-label">Credit @ ' + escHtml(_cnForm.pct) + '%</span><span class="inv-total-value">' + formatCurrency(c.taxable) + '</span></div>';
  if (c.gstType === 'intra') {
    html += '<div class="inv-total-row"><span class="inv-total-label">CGST @ ' + c.cgstPer + '%</span><span class="inv-total-value">' + formatCurrency(c.cgstAmt) + '</span></div>' +
      '<div class="inv-total-row"><span class="inv-total-label">SGST @ ' + c.sgstPer + '%</span><span class="inv-total-value">' + formatCurrency(c.sgstAmt) + '</span></div>';
  } else {
    html += '<div class="inv-total-row"><span class="inv-total-label">IGST @ ' + c.igstPer + '%</span><span class="inv-total-value">' + formatCurrency(c.igstAmt) + '</span></div>';
  }
  html += '<div class="inv-total-row inv-total-row-grand"><span class="inv-total-label">Total credit</span>' +
    '<span class="inv-total-grand">' + formatCurrency(c.grandTotal) + '</span></div></div>';

  html += '<div class="inv-form-hint">Shown on the note as ' + formatNum(c.qty, 2) + ' KG at &#8377;' +
    formatNum(c.rate, 2) + '/KG &mdash; the kilograms these rupees represent at the batch rate, derived from the value.</div>';

  html += '<div class="inv-btn-bar">' +
    '<button class="inv-btn inv-btn-ghost" data-action="invCloseOverlay">Cancel</button>' +
    '<button class="inv-btn inv-btn-primary" data-action="invCnSave">Raise ' + escHtml(cnDisplayNumber(recomputeNextCnNumber())) + '</button></div></div>';

  var existing = document.querySelector('.inv-overlay-scrim');
  if (existing) {
    existing.innerHTML = html;
  } else {
    var scrim = document.createElement('div');
    scrim.className = 'inv-overlay-scrim';
    scrim.innerHTML = html;
    pushFocus();
    document.body.appendChild(scrim);
    document.body.style.overflow = 'hidden';
    focusFirstInteractive(scrim.querySelector('.inv-overlay-card'));
  }
}

function captureCnForm() {
  if (!_cnForm) return;
  var p = document.getElementById('cnPct');
  var d = document.getElementById('cnDate');
  var v = document.getElementById('cnVehicle');
  if (p) _cnForm.pct = parseFloat(p.value) || 0;
  if (d) _cnForm.date = d.value;
  if (v) _cnForm.vehicleNo = v.value;
}

function saveCreditNote() {
  if (!_cnForm) return;
  captureCnForm();
  if (!(_cnForm.pct > 0)) { showToast('Discount must be more than zero', 'error'); return; }
  if (!_cnForm.date) { showToast('A credit note needs a date', 'error'); return; }

  var invoices = _cnForm.invoiceIds
    .map(function(id) { return S.invoices.find(function(i) { return i.id === id; }); })
    .filter(Boolean);
  if (invoices.length === 0) { showToast('Those invoices are no longer in the register', 'error'); return; }

  var client = S.clients.find(function(c) { return c.id === _cnForm.clientId; });
  var c = cnCompute(invoices, client, _cnForm.pct, _cnForm.rate);
  var num = recomputeNextCnNumber();
  var addr = invoices[0].clientAddress || {};

  var cn = {
    id: 'CN-' + Date.now(),
    cnNumber: cnPadNum(num),
    displayNumber: cnDisplayNumber(num),
    date: _cnForm.date,
    clientId: _cnForm.clientId,
    clientName: invoices[0].clientName,
    clientGSTIN: invoices[0].clientGSTIN || (client && client.gstin) || '',
    clientAddress: { add1: addr.add1 || '', add2: addr.add2 || '', add3: addr.add3 || '', state: addr.state || '', stateCode: addr.stateCode || '' },
    // The batch, recorded both by id and by number. Numbers are snapshotted so
    // the note still says what it credited after an invoice is deleted — the
    // customer's copy does not lose its reference when ours does.
    invoiceIds: invoices.map(function(i) { return i.id; }),
    invoiceNumbers: invoices.map(function(i) { return i.displayNumber; }),
    periodFrom: invoices[0].date,
    periodTo: invoices[invoices.length - 1].date,
    spanDays: cnBatchSpanDays(invoices),
    discountPct: _cnForm.pct,
    batchTaxable: c.batchTaxable,
    reason: 'Standing ' + _cnForm.pct + '% batch discount',
    particulars: CN_PARTICULARS,
    unit: 'KG', rate: c.rate, qty: c.qty,
    gstType: c.gstType,
    taxableValue: c.taxable,
    cgstPer: c.cgstPer, cgstAmt: c.cgstAmt,
    sgstPer: c.sgstPer, sgstAmt: c.sgstAmt,
    igstPer: c.igstPer, igstAmt: c.igstAmt,
    grandTotal: c.grandTotal,
    amountInWords: numberToWords(c.grandTotal),
    taxInWords: numberToWords(gstRound(c.cgstAmt + c.sgstAmt + c.igstAmt)),
    vehicleNo: _cnForm.vehicleNo,
    status: 'active',
    createdAt: Date.now(),
    updatedAt: Date.now()
  };

  getCreditNotes().push(cn);
  S.cnNextNum = num + 1;
  saveState();
  _cnForm = null;
  closeOverlay();
  _regSelected = {};
  _renderRegView();
  _renderRegSelBar();
  showToast(cn.displayNumber + ' raised — ' + formatCurrency(cn.grandTotal));
  showCreditNotePreview(cn.id);
}

/* Cancelled, never deleted: the customer holds a document bearing the number
   and a credit note is reversed by cancelling it, not by making it vanish. */
function cancelCreditNote(cnId) {
  var cn = getCreditNotes().find(function(x) { return x.id === cnId; });
  if (!cn || cn.status === 'cancelled') return;
  cn.status = 'cancelled';
  cn.cancelledAt = Date.now();
  cn.updatedAt = Date.now();
  saveState();
  closeOverlay();
  renderCreditNoteList();
  showToast(cn.displayNumber + ' cancelled — the number stays in the series');
}

    (cn.invoiceNumbers || []).length + ') &mdash; batch taxable ' + formatNum(cn.batchTaxable, 2) +
    ' at ' + escHtml(cn.discountPct) + '%</div>' +
    '<div class="inv-cn-annex-list">' + (cn.invoiceNumbers || []).map(escHtml).join(', ') + '</div></div>';

/* First–last when the batch is contiguous in the series, an explicit list when
   it is short, and a count either way. */
function cnInvoiceRangeLabel(cn) {

/* PAN sits inside the GSTIN: 2 state digits, then the 10-character PAN. */
function cnPanFromGstin(gstin) {
