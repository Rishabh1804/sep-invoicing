name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are worth cancelling; commits on main are not — each
  # one should keep its own recorded result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No job does anything but read the tree.
permissions:
  contents: read

jobs:
  build-sync:
    name: Build output in sync with split/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # AGENTS.md rule 1: never edit the built output directly, never bypass
      # build.sh. This job is what makes that rule enforceable — it runs the
      # same command a developer runs and fails if anything changes, so the
      # check can't drift from the build it is checking.
      - name: Rebuild from split/ modules
        run: bash split/build.sh

      - name: Committed HTML matches split/ sources
        run: |
          if ! git diff --exit-code -- sep-invoicing.html index.html version.json; then
            echo "::error::Built output is stale. Run 'bash split/build.sh' and commit the result. Enabling the pre-commit hook (git config core.hooksPath .githooks) does this automatically."
            exit 1
          fi

  # The suite in two halves, each on its own runner (owner, 29 Oct 2026: "Let's
  # split the tests into 2 jobs"). Whole, it had grown to 40-42 min (2,135
  # tests, 28 Oct 2026) against the job's 45, and a red run takes longer than
  # a green one, so it could be cut off before it reported. With fullyParallel
  # on, Playwright shares the tests out one by one: 1,068 and 1,067.
  e2e-shard:
    name: Playwright e2e (${{ matrix.shard }} of 2)
    # Pinned: ubuntu-latest became 26.04 on 26 Oct 2026, and Playwright 1.59.1
    # cannot install Chromium there ("does not support chromium on
    # ubuntu26.04-x64"). 24.04 keeps the browser CI has measured against.
    runs-on: ubuntu-24.04
    # A hang backstop, not a budget: without it a wedged browser would burn the
    # 6h job default. Each half has its own setup, and the apt step behind
    # Chromium's install has taken 5 min on its own, so a half keeps the 45
    # the whole suite had.
    timeout-minutes: 45
    strategy:
      # Each half runs to its end, so a red half never hides what the other
      # one found.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only Chromium — both Playwright projects (mobile-chromium via the Pixel 5
      # descriptor, desktop-chromium) run on it.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run half ${{ matrix.shard }} of the e2e suite
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/2

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The check a branch rule can name, as it named the one job before the split:
  # green only when both halves are. It runs when a half failed or timed out,
  # so a red half reads red here and never as a check that was skipped.
  e2e:
    name: Playwright e2e
    needs: e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both halves passed
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::The e2e suite's halves ended '$RESULT'. The red half's own job lists the tests that failed."
            exit 1
          fi

  feeds:
    name: Feeds Worker tests
    runs-on: ubuntu-latest
    # The Worker's own suite (server/feeds, docs/UI_PASS_3.md §9a) runs inside the
    # Workers runtime with GDELT and MET Norway faked, in about ten seconds once
    # installed. A hang backstop, not a budget.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/feeds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/feeds/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the Worker's tests
        run: npx vitest run
