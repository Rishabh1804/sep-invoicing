</head>
<body>

<!-- TOP BAR (design system §4, §6.1) -->
<header class="inv-topbar">
  <h1 class="inv-topbar-title" id="topbarTitle">Home</h1>
  <span class="inv-topbar-ctx" id="topbarCtx"></span>
  <span class="inv-topbar-spacer"></span>
  <button class="inv-topbar-btn" data-action="invOpenSettings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4"/></svg>
  </button>
</header>

<!-- PAGES -->
<div id="pageHome" class="inv-page inv-page-active">
  <div class="inv-tiles" id="homeTiles">
    <div class="inv-tile"><div class="inv-tile-label">Invoices</div><div class="inv-tile-value" id="mtdCount">0</div><div class="inv-tile-sub" id="mtdCountSub">&nbsp;</div></div>
    <div class="inv-tile"><div class="inv-tile-label">Revenue</div><div class="inv-tile-value" id="mtdRevenue">&#8377;0</div><div class="inv-tile-sub">taxable</div></div>
    <div class="inv-tile"><div class="inv-tile-label">Plated</div><div class="inv-tile-value" id="mtdKg">&mdash;</div><div class="inv-tile-sub" id="mtdKgSub">&nbsp;</div></div>
    <div class="inv-tile"><div class="inv-tile-label">Realisation</div><div class="inv-tile-value" id="mtdPerKg">&mdash;</div><div class="inv-tile-sub" id="mtdPerKgSub">&nbsp;</div></div>
  </div>
  <div class="inv-btn-grid" role="group" aria-label="Quick actions">
    <button class="inv-btn inv-btn-primary" data-action="invCreateNew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg><span>New invoice</span></button>
    <button class="inv-btn inv-btn-secondary" data-action="invHomeQuick" data-go="challan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg><span>New challan</span></button>
    <button class="inv-btn inv-btn-secondary" data-action="invHomeQuick" data-go="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v6L4.5 19a1.5 1.5 0 001.3 2h12.4a1.5 1.5 0 001.3-2L14 9V3"/><path d="M7 15h10"/></svg><span>Stock entry</span></button>
    <button class="inv-btn inv-btn-secondary" data-action="invHomeQuick" data-go="attendance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg><span>Attendance</span></button>
    <button class="inv-btn inv-btn-secondary" data-action="invHomeQuick" data-go="paste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg><span>Paste message</span></button>
    <button class="inv-btn inv-btn-secondary" data-action="invHomeQuick" data-go="task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg><span>Add task</span></button>
  </div>
  <div class="inv-panels">
    <div id="homeTodoCard"></div>
    <div id="homeAttCard"></div>
    <div id="homeUnbilledCard"></div>
    <div id="homeSyncCard"></div>
    <div id="homeZincCard"></div>
    <div class="inv-panel inv-panel-flush inv-panels-wide">
      <div class="inv-panel-head"><span class="inv-panel-title">Recent invoices</span></div>
      <div id="recentInvoices"></div>
    </div>
  </div>
</div>

<div id="pageCreate" class="inv-page">
  <div id="createFormArea"></div>
</div>

<div id="pageIM" class="inv-page">
  <div id="imToolbar"></div>
  <div id="imAddForm"></div>
  <div id="imList"></div>
  <div id="imSelBar"></div>
  <div class="inv-scan-bar" id="imFabBar">
    <button class="inv-fab-scan" data-action="invScanChallan" aria-label="Scan Challan">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
    <button class="inv-fab" id="imFab" data-action="invShowAddChallan" aria-label="Add Challan">+</button>
  </div>
  <input type="file" id="scanFileInput" accept="image/*" class="inv-hidden">
  <div id="scanProcessing"></div>
</div>

<div id="pageRegister" class="inv-page">
  <div id="regToolbar"></div>
  <div id="regList"></div>
  <div id="regSelBar"></div>
</div>

<div id="pageClients" class="inv-page">
  <div id="clientsPageContent"></div>
  <button class="inv-fab inv-hidden" id="clientsItemsFab" data-action="invAddClient" aria-label="Add Client">+</button>
</div>

<div id="pageStaff" class="inv-page">
  <div id="attToolbar"></div>
  <div id="attContent"></div>
  <input type="file" id="rosterFileInput" accept="application/json,.json" class="inv-hidden">
</div>

<div id="pageStats" class="inv-page">
  <div id="statsToolbar"></div>
  <div id="statsContent" class="inv-stats-grid"></div>
</div>

<div id="pageStock" class="inv-page">
  <div id="stockContent"></div>
</div>

<div id="pageTodo" class="inv-page">
  <div id="todoContent"></div>
</div>

<div id="pageHistory" class="inv-page">
  <div id="historyToolbar"></div>
  <div id="historyList"></div>
</div>

<!-- BOTTOM BAR (phone and tablet) -->
<nav class="inv-navbar" aria-label="Main">
  <button class="inv-navbar-item inv-navbar-item-on" data-action="invSwitchTab" data-tab="pageHome">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    Home
  </button>
  <button class="inv-navbar-item" data-action="invSwitchTab" data-tab="pageCreate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
    Create
  </button>
  <button class="inv-navbar-item" data-action="invSwitchTab" data-tab="pageIM">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
    IM
  </button>
  <button class="inv-navbar-item" data-action="invSwitchTab" data-tab="pageRegister">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    Register
  </button>
  <button class="inv-navbar-item" data-action="invSwitchTab" data-tab="pageClients">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
    Clients
  </button>
  <button class="inv-navbar-item inv-navbar-more" data-action="invOpenMore" aria-label="More: Stock, Staff, Stats, History">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    More
    <span id="moreBadge" class="inv-navbar-count inv-hidden"></span>
  </button>
</nav>

<!-- SETTINGS OVERLAY (hidden) -->
<div id="settingsOverlay" class="inv-hidden"></div>

<!-- PRINT VIEW (hidden, full-page) -->
<div id="invPrintView" class="inv-print-view">
  <div class="inv-print-toolbar">
    <button class="inv-print-toolbar-btn" data-action="invClosePrint">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </button>
    <button class="inv-print-toolbar-btn" data-action="invPrint">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Print
    </button>
  </div>
  <div class="inv-print-body" id="invPrintBody"></div>
</div>
