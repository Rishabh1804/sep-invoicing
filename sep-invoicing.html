.dark .inv-header-btn:focus-visible,
.dark .inv-line-remove:focus-visible,
.dark .inv-overlay-close:focus-visible,
.dark .inv-form-select:focus-visible,
.dark .inv-search-input:focus-visible,
.dark .inv-search-item:focus-visible,
.dark .inv-autocomplete-item:focus-visible {
  outline-color: var(--cost-text);
}
/* The header sits on --accent, so an accent-coloured ring would vanish into it.
   #fff matches the header's own foreground, as used above. */
.inv-header-btn:focus-visible,
.dark .inv-header-btn:focus-visible { outline-color: #fff; }

/* ===== ITEMS MASTER (Phase 6) ===== */
.inv-subview-toggle {
  display: flex; gap: var(--sp-4); margin-bottom: var(--sp-12);
  background: var(--surface-2); border-radius: var(--r-md);
  padding: var(--sp-4);
}
.inv-subview-btn {
  flex: 1; padding: var(--sp-8) var(--sp-12); border: none;
  border-radius: var(--r-sm); font-size: var(--fs-sm);
  font-weight: 600; cursor: pointer; min-height: 44px;
  background: transparent; color: var(--text-3);
  transition: all var(--anim-fast);
}
.inv-subview-active {
  background: var(--surface); color: var(--text-1);
  box-shadow: var(--shadow-sm);
}
.dark .inv-subview-toggle { background: var(--surface-2); }
.dark .inv-subview-active { background: var(--surface); color: var(--text-1); }

.inv-items-toolbar { margin-bottom: var(--sp-12); }
.inv-items-toolbar-row {
  display: flex; align-items: center; gap: var(--sp-8);
  margin-top: var(--sp-8); flex-wrap: wrap;
}
.inv-items-count {
  font-size: var(--fs-sm); font-weight: 600; color: var(--text-3);
  font-family: var(--ff-mono);
}
.inv-items-sort {
  min-width: 80px; max-width: 100px;
  padding: var(--sp-6) var(--sp-8);
  font-size: var(--fs-sm); min-height: 36px;
}
.inv-toolbar-add { margin-left: auto; flex-shrink: 0; }
.inv-item-card {
  padding: var(--sp-12) var(--sp-16);
  border-bottom: 1px solid var(--border);
  cursor: pointer; min-height: 52px;
  transition: background var(--anim-fast);
}
.inv-item-card:active { background: var(--surface-2); }
.inv-item-card:last-child { border-bottom: none; }
.inv-item-card-top {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: var(--sp-4);
}
.inv-item-card-bottom {
  display: flex; justify-content: space-between; align-items: center;
}
.inv-item-pn {
  font-size: var(--fs-sm); font-weight: 600; color: var(--text-1);
  word-break: break-all;
}
.inv-item-desc {
  font-size: var(--fs-xs); color: var(--text-2);
  word-break: break-word; flex: 1; min-width: 0;
}
.inv-item-rate {
  font-size: var(--fs-sm); white-space: nowrap; margin-left: var(--sp-8);
}
.inv-item-unit { flex-shrink: 0; }
.inv-item-weight-row {
  margin-top: var(--sp-4);
}
.inv-gauge-badge {
  display: inline-block; padding: var(--sp-2) var(--sp-6);
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm); font-size: var(--fs-2xs); font-weight: 600;
  font-family: var(--ff-mono);
}

/* ===== ZINC RATE CARD ===== */
.inv-zinc-breakdown { font-size: var(--fs-sm); color: var(--text-2); }
.inv-zinc-meta { font-size: var(--fs-xs); color: var(--text-3); }
.inv-zinc-stale { color: var(--warning-text); font-weight: 600; }
.dark .inv-zinc-stale { color: var(--warning-text); }

/* ===== GITHUB SYNC ===== */
.inv-sync-card { padding: var(--card-padding-sm) var(--card-padding); }
.inv-sync-meta { display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }
.inv-sync-label {
  display: flex; align-items: center; gap: var(--sp-6);
  font-size: var(--fs-sm); font-weight: 600; color: var(--text-1);
}
.inv-sync-stale {
  padding: var(--sp-2) var(--sp-6); border-radius: var(--r-sm);
  background: var(--warning-bg); color: var(--warning-text);
  font-size: var(--fs-2xs); font-weight: 600; text-transform: uppercase;
}
.inv-sync-repo {
  font-size: var(--fs-xs); color: var(--text-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.inv-sync-time { font-size: var(--fs-xs); color: var(--text-3); }
.inv-sync-status {
  margin-top: var(--sp-8); padding: var(--sp-8) var(--sp-10);
  background: var(--surface-2); border-radius: var(--r-sm);
  font-size: var(--fs-xs); color: var(--text-2); line-height: 1.5;
}
.dark .inv-sync-status { background: var(--surface-3); }

/* ===== CHECKBOX ROW ===== */
.inv-check-row {
  display: flex; align-items: center; gap: var(--sp-8);
  min-height: 44px; cursor: pointer;
  font-size: var(--fs-base); color: var(--text-1);
}
.inv-check { width: var(--sp-16); height: var(--sp-16); accent-color: var(--accent); flex-shrink: 0; }
.dark .inv-check { accent-color: var(--accent-dark); }

/* ===== BULK WEIGHT ENTRY ===== */
.inv-weight-list { margin-bottom: var(--sp-16); }
.inv-weight-row {
  padding: var(--sp-12) 0;
  border-bottom: 1px solid var(--border);
}
.inv-weight-row:last-child { border-bottom: none; }
.inv-weight-row-head {
  display: flex; align-items: center; gap: var(--sp-6);
  flex-wrap: wrap; margin-bottom: var(--sp-4);
}
.inv-weight-row-meta {
  display: flex; align-items: center; gap: var(--sp-8);
  flex-wrap: wrap; margin-bottom: var(--sp-8);
  font-size: var(--fs-xs);
}
.inv-weight-breakeven {
  font-family: var(--ff-mono); font-weight: 600;
  color: var(--text-2);
}
.inv-weight-row-entry {
  display: flex; align-items: center; gap: var(--sp-8);
}
.inv-weight-input { flex: 1; min-width: 0; }
.inv-weight-verdict {
  font-family: var(--ff-mono); font-size: var(--fs-sm); font-weight: 700;
  min-width: 88px; text-align: right; flex-shrink: 0;
}
.inv-weight-ok { color: var(--attend-text); }
.inv-weight-bad { color: var(--cost-text); }
.dark .inv-weight-ok { color: var(--attend-text); }
.dark .inv-weight-bad { color: var(--cost-text); }
.inv-weight-badge {
  display: inline-block; padding: var(--sp-2) var(--sp-6);
  background: var(--prod-bg); color: var(--prod-text);
  border-radius: var(--r-sm); font-size: var(--fs-2xs); font-weight: 600;
  font-family: var(--ff-mono);
}

/* Merge tool */
.inv-merge-group {
  background: var(--surface); border-radius: var(--r-xl);
  padding: var(--card-padding); box-shadow: var(--shadow-sm);
  margin-bottom: var(--sp-12);
}
.inv-merge-group-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: var(--sp-8);
}
.inv-merge-radio-row {
  display: flex; align-items: flex-start; gap: var(--sp-8);
  padding: var(--sp-8) 0; border-bottom: 1px solid var(--border);
  min-height: 44px; cursor: pointer;
}
.inv-merge-radio-row:last-of-type { border-bottom: none; }
.inv-merge-radio {
  margin-top: var(--sp-4); flex-shrink: 0;
  accent-color: var(--accent);
}
.inv-merge-item-info { font-size: var(--fs-sm); }
.inv-merge-item-desc { font-size: var(--fs-xs); margin-top: var(--sp-2); }
.inv-merge-warn {
  font-size: var(--fs-xs); color: var(--warning-text);
  background: var(--warning-bg); padding: var(--sp-6) var(--sp-10);
  border-radius: var(--r-sm); margin-top: var(--sp-8);
}
.inv-merge-preview {
  padding: var(--sp-8) 0;
}
.inv-merge-btn { flex-shrink: 0; }

.dark .inv-merge-group { background: var(--surface); }
.dark .inv-merge-warn { background: var(--warning-bg); color: var(--warning-text); }
.dark .inv-weight-badge { background: var(--prod-bg); color: var(--prod-text); }
.dark .inv-gauge-badge { background: var(--surface-2); color: var(--text-2); }

/* ===== ITEMS MASTER — Phase 6b (Usage + Batch) ===== */
.inv-item-badges-row {
  display: flex; gap: var(--sp-4); margin-top: var(--sp-4); flex-wrap: wrap;
}
.inv-usage-badge {
  display: inline-block; padding: var(--sp-2) var(--sp-6);
  background: var(--attend-bg); color: var(--attend-text);
  border-radius: var(--r-sm); font-size: var(--fs-2xs); font-weight: 600;
  font-family: var(--ff-mono);
}
.inv-usage-zero {
  background: var(--danger-bg); color: var(--danger-text);
}
.inv-item-selected {
  background: var(--prod-bg);
}
.inv-item-check-wrap {
  display: flex; align-items: center; justify-content: center;
  min-width: 28px; flex-shrink: 0; cursor: pointer;
}
.inv-items-sel-actions {
  display: flex; gap: var(--sp-6);
}
.dark .inv-usage-badge { background: var(--attend-bg); color: var(--attend-text); }
.dark .inv-usage-zero { background: var(--danger-bg); color: var(--danger-text); }
.dark .inv-item-selected { background: var(--prod-bg); }

/* ===== REGISTER — Phase 6b (Bulk Select + Sort) ===== */
.inv-reg-actions-row {
  display: flex; gap: var(--sp-8); margin-top: var(--sp-8);
  /* Wraps rather than squeezing: with select-all present this row carries four
     buttons, and at 393px they were compressing their labels onto two lines. */
  flex-wrap: wrap;
}
.inv-reg-check-wrap {
  display: flex; align-items: center; justify-content: center;
  min-width: 44px; flex-shrink: 0; cursor: pointer;
  border-bottom: 1px solid var(--border);
}
.inv-reg-row-content {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  gap: var(--sp-4); padding: var(--sp-12) var(--sp-16);
  border-bottom: 1px solid var(--border);
  cursor: pointer; min-height: 52px;
  transition: background var(--anim-fast);
}
.inv-reg-row-content:active { background: var(--surface-2); }
.inv-reg-row-selected { background: var(--prod-bg); }
.dark .inv-reg-row-selected { background: var(--prod-bg); }
.inv-sel-clear-btn {
  background: transparent; color: #fff;
  border-color: rgba(255,255,255,0.4);
}
.inv-sel-clear-btn:active { background: rgba(255,255,255,0.15); }

/* ===== PHASE 8A: DESKTOP LAYOUT FOUNDATION ===== */

/* --- Sidebar (hidden by default) --- */
.inv-sidebar { display: none; }

body.inv-desktop .inv-sidebar {
  display: flex; flex-direction: column;
  position: fixed; left: 0; top: 0; bottom: 0;
  width: 64px; background: var(--surface);
  border-right: 1px solid var(--border);
  z-index: 100; transition: width 200ms ease;
  overflow: hidden;
}
body.inv-desktop .inv-sidebar:hover { width: 240px; }
.inv-sidebar.inv-sidebar-expanded { width: 240px; }
.inv-sidebar.inv-sidebar-expanded .inv-sidebar-label { opacity: 1; }

.inv-sidebar-inner {
  display: flex; flex-direction: column;
  height: 100%; padding: var(--sp-8) 0;
}

.inv-sidebar-item {
  display: flex; align-items: center; gap: var(--sp-12);
  padding: var(--sp-12) var(--sp-20);
  min-height: 48px; color: var(--text-2); cursor: pointer;
  border: none; background: none; white-space: nowrap;
  font-family: var(--ff-base); font-size: var(--fs-base); font-weight: 500;
  text-align: left; width: 100%;
}
.inv-sidebar-item svg { flex-shrink: 0; width: 24px; height: 24px; }
.inv-sidebar-label { opacity: 0; transition: opacity 150ms ease; }
body.inv-desktop .inv-sidebar:hover .inv-sidebar-label { opacity: 1; }
.inv-sidebar-active { color: var(--accent); background: var(--surface-2); }
.inv-sidebar-spacer { flex: 1; }

/* Dark mode sidebar */
.dark .inv-sidebar { background: var(--surface); border-right-color: var(--border); }
.dark .inv-sidebar-active { background: var(--surface-2); color: var(--accent); }

/* --- Desktop: Body offset --- */
body.inv-desktop {
  max-width: none; padding-bottom: 0; margin-left: 64px;
  transition: margin-left var(--anim-normal) ease;
}
/* Body follows sidenav width so header + content shift instead of being covered */
body.inv-desktop:has(.inv-sidebar:hover),
body.inv-desktop:has(.inv-sidebar.inv-sidebar-expanded) {
  margin-left: 240px;
}

/* --- Desktop: Hide bottom tabs --- */
body.inv-desktop .inv-tabs { display: none; }

/* --- Desktop: FAB repositioned (no tab-h offset) --- */
body.inv-desktop .inv-fab { bottom: var(--sp-16); }
body.inv-desktop .inv-scan-bar { bottom: var(--sp-16); }

/* --- Desktop: IM selection bar (no tab-h offset) --- */
body.inv-desktop .inv-im-sel-bar { bottom: var(--sp-8); }

/* --- Desktop: Toast max-width fix --- */
body.inv-desktop .inv-toast { max-width: 480px; }

/* --- Desktop: Overlay as centered modal --- */
body.inv-desktop .inv-overlay-scrim {
  align-items: center;
  padding: var(--sp-16);
}
body.inv-desktop .inv-overlay-card {
  border-radius: var(--r-xl);
  width: min(90vw, 560px);
  max-height: 85vh;
  animation: inv-scaleIn var(--anim-normal) ease;
}
@keyframes inv-scaleIn {
  0% { transform: scale(0.95); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* ===== MASTER-DETAIL LAYOUT (Phase 8B) ===== */
body.inv-desktop .inv-master-detail {
  display: flex;
  flex-direction: row;
  height: calc(100vh - var(--header-h));
  overflow: hidden;
}
body.inv-desktop .inv-master {
  flex-shrink: 0;
  width: 40%;
  overflow-y: auto;
  border-right: 1px solid var(--border);
}
body.inv-desktop .inv-detail {
  flex: 1;
  overflow-y: auto;
  padding: var(--sp-16);
}
body.inv-desktop .inv-drag-handle {
  width: 4px;
  cursor: col-resize;
  background: var(--border);
  flex-shrink: 0;
  transition: background var(--anim-fast);
}
body.inv-desktop .inv-drag-handle:hover {
  background: var(--accent);
}
body.inv-desktop .inv-detail-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-3);
}
body.inv-desktop .inv-detail-empty-icon {
  margin-bottom: var(--sp-12);
  color: var(--text-3);
}
body.inv-desktop .inv-detail-empty-text {
  font-size: var(--fs-base);
  color: var(--text-3);
}

/* --- Dark mode: master-detail (Phase 8B) --- */
.dark .inv-master { border-right-color: var(--border); }
.dark .inv-drag-handle { background: var(--border); }
.dark .inv-drag-handle:hover { background: var(--accent); }
.dark .inv-detail-empty { color: var(--text-3); }
.dark .inv-detail-empty-icon { color: var(--text-3); }
.dark .inv-detail-empty-text { color: var(--text-3); }

/* ===== DESKTOP TABLE (Phase 8C) ===== */
body.inv-desktop .inv-desktop-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-sm);
}
body.inv-desktop .inv-desktop-table thead {
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 2;
}
.inv-th {
  padding: var(--sp-8) var(--sp-12);
  text-align: left;
  font-weight: 600;
  font-size: var(--fs-xs);
  color: var(--text-2);
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
  user-select: none;
}
.inv-th-sortable { cursor: pointer; }
.inv-th-sortable:hover { color: var(--accent); }
.inv-th-amount { text-align: right; }
.inv-sort-arrow {
  margin-left: var(--sp-4);
  font-size: var(--fs-2xs);
}
.inv-tr {
  border-bottom: 1px solid var(--border);
  transition: background var(--anim-fast);
}
body.inv-desktop .inv-tr:hover { background: var(--surface-2); }
.inv-tr-active { background: var(--neutral-bg); }
.inv-tr-cancelled { opacity: 0.6; }
.inv-td {
  padding: var(--sp-8) var(--sp-12);
  vertical-align: middle;
  cursor: pointer;
}
.inv-td-check {
  width: 40px;
  text-align: center;
  cursor: default;
}
.inv-td-num {
  width: 60px;
  font-family: var(--ff-mono);
}
.inv-td-date {
  width: 100px;
  font-family: var(--ff-mono);
}
.inv-td-amount {
  width: 110px;
  font-family: var(--ff-mono);
  text-align: right;
}
.inv-td-state { width: 90px; }

/* Desktop-only toolbar overrides (Phase 8C) */
body.inv-desktop [data-action="invRegToggleSort"],
body.inv-desktop [data-action="invRegToggleSelect"] { display: none; }

/* Selection bar desktop positioning (Phase 8C) */
body.inv-desktop #regSelBar {
  position: sticky;
  bottom: 0;
  border-top: 1px solid var(--border);
  background: var(--surface);
  z-index: 10;
}

/* --- Dark mode: desktop table (Phase 8C) --- */
.dark .inv-desktop-table thead { background: var(--surface); }
.dark .inv-th { color: var(--text-2); border-bottom-color: var(--border); }
.dark .inv-th-sortable:hover { color: var(--accent); }
.dark .inv-tr { border-bottom-color: var(--border); }
.dark .inv-tr:hover { background: var(--surface-2); }
.dark .inv-tr-active { background: var(--neutral-bg); }
.dark .inv-td { color: var(--text-1); }
.dark #regSelBar { background: var(--surface); border-top-color: var(--border); }

/* ===== IM DESKTOP TABLE (Phase 8D) ===== */
.inv-td-challan {
  width: 100px;
  font-family: var(--ff-mono);
}
.inv-td-items {
  width: 60px;
  text-align: center;
}
.inv-td-status {
  width: 80px;
}

/* IM selection bar desktop positioning (Phase 8D) */
body.inv-desktop #imSelBar {
  position: sticky;
  bottom: 0;
  border-top: 1px solid var(--border);
  background: var(--surface);
  z-index: 10;
}

/* --- Dark mode: IM desktop (Phase 8D) --- */
.dark #imSelBar { background: var(--surface); border-top-color: var(--border); }

/* ===== CLIENTS/ITEMS DESKTOP (Phase 8E) ===== */

/* Desktop toggle above wrapper */
#clientsDesktopToggle {
  margin-bottom: var(--sp-8);
}

/* Clients master panel narrower (0.35 ratio) */
body.inv-desktop .inv-master-clients {
  width: 35%;
}

/* Active state: client cards */
.inv-client-item-active {
  background: var(--neutral-bg);
}
.inv-client-item-active:active {
  background: var(--neutral-bg);
}

/* Active state: item cards */
.inv-item-card-active {
  background: var(--neutral-bg);
}
.inv-item-card-active:active {
  background: var(--neutral-bg);
}

/* FAB hidden on desktop */
body.inv-desktop #clientsItemsFab {
  display: none;
}

/* Client detail header */
.inv-detail-client-header {
  display: flex;
  align-items: center;
  gap: var(--sp-8);
  flex-wrap: wrap;
}
.inv-detail-client-name {
  font-family: var(--ff-display);
  font-size: var(--fs-xl);
  color: var(--text-1);
}
.inv-badge-active {
  color: var(--attend-text);
  background: var(--attend-bg);
  font-size: var(--fs-xs);
  padding: var(--sp-2) var(--sp-8);
  border-radius: var(--r-full);
}

/* Rate history rows */
.inv-detail-rate-row {
  display: flex;
  align-items: center;
  gap: var(--sp-12);
  padding: var(--sp-4) 0;
}
.inv-detail-rate-current {
  background: var(--attend-bg);
  padding: var(--sp-4) var(--sp-8);
  border-radius: var(--r-sm);
  margin: var(--sp-2) 0;
}

/* Invoice rows in client detail */
.inv-detail-invoice-row {
  display: flex;
  align-items: center;
  gap: var(--sp-12);
  padding: var(--sp-6) var(--sp-4);
  cursor: pointer;
  border-radius: var(--r-sm);
  transition: background var(--anim-fast) ease;
}
.inv-detail-invoice-row:hover {
  background: var(--surface-2);
}

/* Items selection bar desktop positioning (Phase 8E) */
body.inv-desktop #itemsSelBar {
  position: sticky;
  bottom: 0;
  border-top: 1px solid var(--border);
  background: var(--surface);
  z-index: 10;
}

/* --- Dark mode: Clients/Items desktop (Phase 8E) --- */
.dark .inv-client-item-active { background: var(--neutral-bg); }
.dark .inv-item-card-active { background: var(--neutral-bg); }
.dark .inv-detail-client-name { color: var(--text-1); }
.dark .inv-badge-active { color: var(--attend-text); background: var(--attend-bg); }
.dark .inv-detail-rate-current { background: var(--attend-bg); }
.dark .inv-detail-invoice-row:hover { background: var(--surface-2); }
.dark #itemsSelBar { background: var(--surface); border-top-color: var(--border); }

/* --- Tablet: Wider cards, no max-width cap --- */
@media (min-width: 768px) {
  body { max-width: none; }
  .inv-tabs { max-width: none; }
  .inv-card { padding: var(--sp-20); }
  .inv-page { padding: var(--sp-20) var(--sp-32); }
  .inv-toast { max-width: 480px; }
}

/* ===== STAFF & ATTENDANCE ===== */
.inv-empty-state-sm { padding: var(--sp-20) var(--sp-8); font-size: var(--fs-sm); }

.inv-att-nav {
  display: flex; align-items: center; gap: var(--sp-8);
  margin-bottom: var(--sp-16);
}
.inv-att-nav-btn {
  min-width: 44px; min-height: 44px; display: flex; align-items: center;
  justify-content: center; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); color: var(--text-2); cursor: pointer;
  transition: background var(--anim-fast);
}
.inv-att-nav-btn:active { background: var(--surface-2); }
.inv-att-nav-label {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  align-items: center; gap: var(--sp-2);
}
.inv-att-date { text-align: center; padding: var(--sp-6) var(--sp-8); }
.inv-att-nav-day { font-size: var(--fs-xs); color: var(--text-3); }
.inv-att-week-num {
  font-family: var(--ff-display); font-size: var(--fs-lg); color: var(--text-1);
}

.inv-att-count { display: flex; align-items: baseline; gap: var(--sp-6); }
.inv-att-count-value { font-size: var(--fs-3xl); color: var(--attend); }
.inv-att-count-of { font-family: var(--ff-mono); font-size: var(--fs-md); color: var(--text-3); }
.inv-att-summary {
  display: flex; flex-wrap: wrap; gap: var(--sp-6); margin-top: var(--sp-8);
}
.inv-att-pill {
  font-size: var(--fs-xs); font-weight: 600; padding: var(--sp-2) var(--sp-8);
  border-radius: var(--r-full); white-space: nowrap;
}
.inv-att-pill-p { background: var(--attend-bg); color: var(--attend-text); }
.inv-att-pill-h { background: var(--warning-bg); color: var(--warning-text); }
.inv-att-pill-a { background: var(--danger-bg); color: var(--danger-text); }
.inv-att-pill-u { background: var(--surface-2); color: var(--text-3); }
.inv-att-pill-ot { background: var(--prod-bg); color: var(--prod-text); }
.inv-att-pill-hr { background: var(--attend-bg); color: var(--attend-text); }
.inv-att-pill-x { background: var(--neutral-bg); color: var(--neutral-text); }

.inv-att-row {
  display: flex; flex-direction: column; gap: var(--sp-6);
  padding: var(--sp-10) 0; border-bottom: 1px solid var(--border);
}
.inv-att-row:last-child { border-bottom: none; }
.inv-att-who { display: flex; align-items: center; gap: var(--sp-8); min-width: 0; }
.inv-att-name {
  font-size: var(--fs-base); font-weight: 600; color: var(--text-1);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.inv-att-badge {
  font-size: var(--fs-2xs); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.04em; padding: var(--sp-2) var(--sp-6);
  border-radius: var(--r-sm); flex-shrink: 0;
}
.inv-att-badge-perm { background: var(--prod-bg); color: var(--prod-text); }
.inv-att-badge-cw { background: var(--attend-bg); color: var(--attend-text); }
.inv-att-controls { display: flex; align-items: center; gap: var(--sp-6); }
.inv-att-seg { display: flex; gap: var(--sp-2); flex-shrink: 0; }
.inv-att-seg-btn {
  min-width: 44px; min-height: 44px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-3); font-weight: 700;
  border-radius: var(--r-md); cursor: pointer;
  transition: background var(--anim-fast), color var(--anim-fast);
}
.inv-att-seg-btn:active { background: var(--surface-2); }
.inv-att-seg-p.inv-att-seg-on { background: var(--attend); border-color: var(--attend); color: #fff; }
.inv-att-seg-h.inv-att-seg-on { background: var(--warning); border-color: var(--warning); color: #fff; }
.inv-att-seg-a.inv-att-seg-on { background: var(--danger); border-color: var(--danger); color: #fff; }
.inv-att-area { flex: 1; min-width: 0; padding: var(--sp-6) var(--sp-8); }
.inv-att-ot { width: calc(var(--sp-32) + var(--sp-24)); flex-shrink: 0; text-align: center; padding: var(--sp-6) var(--sp-4); }
.inv-att-area:disabled, .inv-att-ot:disabled { opacity: 0.45; }

.inv-att-extra-row {
  display: flex; align-items: center; gap: var(--sp-8);
  padding: var(--sp-6) 0; border-bottom: 1px solid var(--border);
}
.inv-att-extra-row:last-child { border-bottom: none; }
.inv-att-extra-row select { flex: 1; min-width: 0; }
.inv-att-extra-row input { width: calc(var(--sp-32) + var(--sp-24)); flex-shrink: 0; text-align: center; }
.inv-att-extra-del {
  min-width: 44px; min-height: 44px; background: none; border: none;
  color: var(--danger); font-size: var(--fs-lg); cursor: pointer; flex-shrink: 0;
}

/* Week grid. Scrolls sideways rather than reflowing: six days and a name column
   do not fit a 393px phone, and a grid that wraps stops being a grid. */
.inv-att-grid-wrap { overflow-x: auto; margin: 0 calc(-1 * var(--sp-4)); }
.inv-att-grid { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
.inv-att-grid th, .inv-att-grid td { padding: var(--sp-2); }
.inv-att-grid-name {
  text-align: left; font-weight: 600; color: var(--text-1);
  position: sticky; left: 0; background: var(--surface); z-index: 1;
  white-space: nowrap; padding-right: var(--sp-8);
}
.inv-att-grid-worker {
  display: inline-block; max-width: calc(var(--sp-32) * 2.5); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; vertical-align: middle;
}
@media (min-width: 380px) { .inv-att-grid-worker { max-width: none; } }
.inv-att-grid-comp {
  display: inline-block; margin-left: var(--sp-4); font-size: var(--fs-2xs);
  font-weight: 700; padding: 0 var(--sp-4); border-radius: var(--r-sm);
  vertical-align: middle;
}
.inv-att-grid-day {
  font-size: var(--fs-2xs); font-weight: 600; text-transform: uppercase;
  color: var(--text-3); text-align: center; letter-spacing: 0.04em;
}
.inv-att-grid-today { color: var(--accent); }
.inv-att-grid-date { display: block; font-family: var(--ff-mono); font-size: var(--fs-xs); }
.inv-att-grid-cell { text-align: center; }
.inv-att-cell {
  position: relative; min-width: 44px; min-height: 44px; width: 100%;
  border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--surface); color: var(--text-3); font-weight: 700;
  cursor: pointer; transition: background var(--anim-fast);
}
.inv-att-cell-p { background: var(--attend-bg); color: var(--attend-text); border-color: var(--attend-bg); }
.inv-att-cell-h { background: var(--warning-bg); color: var(--warning-text); border-color: var(--warning-bg); }
.inv-att-cell-a { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger-bg); }
.inv-att-cell-u { background: var(--surface-3); }
.inv-att-cell-ot {
  position: absolute; top: var(--sp-2); right: var(--sp-2);
  font-size: var(--fs-2xs); font-weight: 700; color: var(--prod-text);
}
.inv-att-grid-foot {
  font-family: var(--ff-mono); font-weight: 700; color: var(--text-1);
  padding-top: var(--sp-8);
}
.inv-att-grid-of { font-weight: 400; color: var(--text-3); }

/* ===== LABOUR BREAKDOWN ===== */
.inv-lab-total { font-family: var(--ff-mono); font-weight: 700; color: var(--cost-text); }
.inv-lab-split {
  display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-8);
  margin-bottom: var(--sp-12);
}
.inv-lab-half { padding: var(--sp-10); border-radius: var(--r-md); }
.inv-lab-fixed { background: var(--prod-bg); }
.inv-lab-variable { background: var(--attend-bg); }
.inv-lab-half-label {
  font-size: var(--fs-2xs); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--text-2);
}
.inv-lab-half-value {
  font-family: var(--ff-display); font-size: var(--fs-lg); color: var(--text-1);
}
.inv-lab-half-sub { font-size: var(--fs-2xs); color: var(--text-2); }
.inv-lab-row {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: var(--sp-8); padding: var(--sp-6) 0; border-bottom: 1px solid var(--border);
  font-size: var(--fs-sm);
}
.inv-lab-row:last-of-type { border-bottom: none; }
.inv-lab-label { color: var(--text-1); min-width: 0; }
.inv-lab-sub { display: block; font-size: var(--fs-2xs); color: var(--text-3); }
.inv-lab-value { font-weight: 600; color: var(--cost-text); white-space: nowrap; }
.inv-lab-perkg {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-2);
  padding: var(--sp-12); margin-top: var(--sp-12);
  background: var(--cost-bg); border-radius: var(--r-md); text-align: center;
}
.inv-lab-perkg-value { font-family: var(--ff-display); font-size: var(--fs-2xl); color: var(--cost); }
.inv-lab-perkg-label {
  font-size: var(--fs-2xs); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--text-2);
}
.inv-lab-perkg-model { font-size: var(--fs-xs); color: var(--text-2); }
.inv-lab-perkg-none { background: var(--surface-2); }
.inv-lab-perkg-none .inv-lab-perkg-value { color: var(--text-3); }

/* Dark mode. Every surface above that is not already a token pair. */
.dark .inv-att-nav-btn { background: var(--surface); border-color: var(--border); }
.dark .inv-att-seg-btn { background: var(--surface); border-color: var(--border); }
.dark .inv-att-count-value { color: var(--attend-text); }
.dark .inv-att-grid-name { background: var(--surface); }
.dark .inv-att-cell { background: var(--surface); border-color: var(--border); }
.dark .inv-att-cell-u { background: var(--surface-3); }
.dark .inv-att-cell-p { background: var(--attend-bg); color: var(--attend-text); border-color: var(--attend-bg); }
.dark .inv-att-cell-h { background: var(--warning-bg); color: var(--warning-text); border-color: var(--warning-bg); }
.dark .inv-att-cell-a { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger-bg); }
.dark .inv-lab-total, .dark .inv-lab-value { color: var(--cost-text); }
.dark .inv-lab-perkg-value { color: var(--cost-text); }
.dark .inv-lab-half-value { color: var(--text-1); }

/* Focus rings, matching the ones the tabs and chips already carry. */
.inv-att-seg-btn:focus-visible,
.inv-att-cell:focus-visible,
.inv-att-nav-btn:focus-visible,
.inv-att-extra-del:focus-visible {
  outline: var(--sp-2) solid var(--accent);
  outline-offset: var(--sp-2);
}

.inv-att-roster-actions { display: flex; gap: var(--sp-6); }

.inv-lab-area-title {
  margin-top: var(--sp-16); margin-bottom: var(--sp-8);
  font-size: var(--fs-2xs); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--text-3);
}

/* Desktop: the controls are sized for a thumb, not for a 1280px row. Left to
   stretch they put a hand's width of empty select between the name and the
   hours. */
body.inv-desktop .inv-att-controls { max-width: calc(var(--sp-32) * 15); }
body.inv-desktop .inv-att-extra-row { max-width: calc(var(--sp-32) * 15); }
</style>

function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function formatCurrency(n) {
  if (n == null || isNaN(n)) return '\u20B90';
  const neg = n < 0; n = Math.abs(n);
  const parts = n.toFixed(2).split('.');
  let int = parts[0], dec = parts[1];
  // Indian grouping
  if (int.length > 3) {
    const last3 = int.slice(-3);
    const rest = int.slice(0, -3);
    int = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3;
  }
  return (neg ? '-' : '') + '\u20B9' + int + '.' + dec;
}

function numberToWords(n) {
  if (n === 0) return 'Rupees Zero Only';
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function convert(num) {
    if (num < 20) return ones[num];
    if (num < 100) return tens[Math.floor(num/10)] + (num%10 ? ' ' + ones[num%10] : '');
    if (num < 1000) return ones[Math.floor(num/100)] + ' Hundred' + (num%100 ? ' ' + convert(num%100) : '');
    if (num < 100000) return convert(Math.floor(num/1000)) + ' Thousand' + (num%1000 ? ' ' + convert(num%1000) : '');
    if (num < 10000000) return convert(Math.floor(num/100000)) + ' Lakh' + (num%100000 ? ' ' + convert(num%100000) : '');
    return convert(Math.floor(num/10000000)) + ' Crore' + (num%10000000 ? ' ' + convert(num%10000000) : '');
  }
  const rupees = Math.floor(n);
  const paise = Math.round((n - rupees) * 100);
  let result = '';
  if (rupees > 0) {
    result = 'Rupees ' + convert(rupees);
  } else if (paise > 0) {
    result = 'Rupees Zero';
  } else {
    return 'Rupees Zero Only';
  }
  if (paise > 0) result += ' and ' + convert(paise) + ' Paise';
  return result + ' Only';
}

function getLineItemRate(client, invoiceDate, partNumber) {
  if (client.itemRates && client.itemRates.length > 0 && partNumber) {
    const override = client.itemRates.find(ir => partNumber.includes(ir.partPattern));
    if (override) return {rate: override.rate, unit: override.unit, _override: true, _label: override.label};
  }
  const applicable = (client.rates || [])
    .filter(r => r.effectiveFrom <= invoiceDate)
    .sort((a,b) => b.effectiveFrom.localeCompare(a.effectiveFrom));
  if (applicable.length > 0) return applicable[0];
  const earliest = [...(client.rates || [])].sort((a,b) => a.effectiveFrom.localeCompare(b.effectiveFrom))[0];
  if (earliest) return {...earliest, _fallback: true};
  return {ratePerKg: 0, ratePerPiece: null, effectiveFrom: '2026-04-01'};
}

/* ===== ZINC MARKET RATE =====

   Zinc is the largest bought-in input on the floor — ~26% of cost at ~425 kg
   a month. It is bought at the MCX rate plus a fixed supplier premium, so a
   stale or wrong figure quietly distorts every cost-per-kg number downstream.

   metals.dev does not publish MCX base metals. Its MCX coverage is precious
   metals only (mcx_gold, mcx_silver); `zinc` and `lme_zinc` are the same LME
   figure. LME runs below MCX by basic customs duty plus freight and local
   premium — about 10.5% when this was calibrated (LME 355.11 against an MCX
   quote near 392).

   So the fetched figure is LME, and MCX is DERIVED from it by an uplift the
   operator can recalibrate whenever they see a real MCX quote. LME tracks the
   world price daily; the wedge over it is structural and moves slowly. A rate
   entered by hand is treated as the MCX rate itself and takes no uplift.

   Nothing here is ever labelled MCX without saying it was estimated.

   The rate lives on S so it travels with export/import. The API key does not —
   it goes to localStorage under its own key, the same as the Gemini key the
   challan scanner uses, so a backup JSON never carries a credential. */

var ZINC_STALE_DAYS = 7;
var ZINC_DEFAULT_UPLIFT = 10.5;

function getZinc() {
  if (!S.zinc) {
    S.zinc = { ratePerKg: null, premiumPerKg: 15, upliftPct: ZINC_DEFAULT_UPLIFT,
               basis: 'manual', updatedAt: null, source: '' };
  }
  if (S.zinc.premiumPerKg == null) S.zinc.premiumPerKg = 15;
  if (S.zinc.upliftPct == null) S.zinc.upliftPct = ZINC_DEFAULT_UPLIFT;
  if (!S.zinc.basis) S.zinc.basis = 'manual';
  return S.zinc;
}

/* The MCX rate: taken as given when entered by hand, uplifted from LME when
   fetched. Returns null until a rate exists. */
function zincMcxRate() {
  var z = getZinc();
  if (z.ratePerKg == null) return null;
  if (z.basis !== 'lme') return gstRound(z.ratePerKg);
  return gstRound(z.ratePerKg * (1 + (z.upliftPct || 0) / 100));
}

/* What a kilo actually costs landed: MCX plus the supplier premium. */
function zincLandedRate() {
  var mcx = zincMcxRate();
  if (mcx == null) return null;
  return gstRound(mcx + (getZinc().premiumPerKg || 0));
}

function zincAgeDays() {
  var z = getZinc();
  if (!z.updatedAt) return null;
  return Math.floor((Date.now() - z.updatedAt) / 86400000);
}

function renderZincCard() {
  var el = document.getElementById('homeZincCard');
  if (!el) return;
  var z = getZinc();
  var landed = zincLandedRate();

  if (landed == null) {
    // Adding the key does not fetch anything by itself, so the empty state has
    // to carry the Refresh button too. Without it, setting a key left the card
    // still asking for a key and no way to act on it.
    var hasKey = !!getMetalsKey();
    el.innerHTML = '<div class="inv-card"><div class="inv-card-header">' +
      '<span class="inv-card-title">Zinc</span>' +
      (hasKey ? '<button class="inv-btn inv-btn-primary inv-btn-sm" data-action="invRefreshZinc">Refresh</button>' : '') +
      '</div>' +
      '<div class="inv-text-muted inv-storage-text">' +
      (hasKey
        ? 'No rate recorded yet. Tap Refresh to pull the current market rate, or enter it by hand in Settings.'
        : 'No rate recorded. Set it in Settings, or add a metals.dev API key there to pull it from the market.') +
      '</div></div>';
    return;
  }

  var age = zincAgeDays();
  var stale = age == null || age > ZINC_STALE_DAYS;
  var ageText = age == null ? 'never updated'
    : age === 0 ? 'updated today'
    : 'updated ' + age + ' day' + (age !== 1 ? 's' : '') + ' ago';

  el.innerHTML = '<div class="inv-card"><div class="inv-card-header">' +
    '<span class="inv-card-title">Zinc</span>' +
    '<button class="inv-btn inv-btn-ghost inv-btn-sm" data-action="invRefreshZinc">Refresh</button>' +
    '</div>' +
    '<div class="inv-flex-between inv-mb-8">' +
    '<div><div class="inv-text-muted inv-stat-label">Landed per kg</div>' +
    '<div class="inv-display inv-stat-value">' + formatCurrency(landed) + '</div></div>' +
    '<div class="inv-text-right"><div class="inv-text-muted inv-stat-label">' +
    (z.basis === 'lme' ? 'MCX est. + premium' : 'MCX + premium') + '</div>' +
    '<div class="inv-mono inv-zinc-breakdown">' + formatCurrency(zincMcxRate()) +
    ' + ' + formatCurrency(z.premiumPerKg || 0) + '</div></div></div>' +
    // Show the whole derivation when the figure was uplifted from LME, so an
    // estimate never reads as a quoted MCX price.
    (z.basis === 'lme'
      ? '<div class="inv-zinc-meta">LME ' + formatCurrency(z.ratePerKg) +
        ' + ' + formatNum(z.upliftPct, 1) + '% duty/freight = MCX est. ' +
        formatCurrency(zincMcxRate()) + '</div>'
      : '') +
    '<div class="inv-zinc-meta' + (stale ? ' inv-zinc-stale' : '') + '">' +
    escHtml(ageText) + (z.source ? ' · ' + escHtml(z.source) : '') +
    (stale ? ' · may be out of date' : '') + '</div></div>';
}

/* Pull the live rate. Deliberately forgiving about the response shape: the
   payload is read for a zinc figure in several plausible places, and if none
   of them hold one the actual keys returned are surfaced rather than a bare
   failure, so the path can be corrected without guesswork. */
function refreshZincRate() {
  var key = getMetalsKey();
  if (!key) {
    showToast('Add a metals.dev API key in Settings first', 'error');
    return;
  }

  showToast('Fetching zinc rate…');
  fetch('https://api.metals.dev/v1/latest?api_key=' + encodeURIComponent(key) +
        '&currency=INR&unit=kg')
    .then(function(res) { return res.json(); })
    .then(function(json) {
      if (!json || json.status === 'failure') {
        showToast('metals.dev: ' + ((json && json.error_message) || 'request failed'), 'error');
        return;
      }
      var hit = _extractZincRate(json);
      if (!hit) {
        showToast('No zinc rate in response. Returned: ' + _describeShape(json), 'error');
        return;
      }
      var z = getZinc();
      z.ratePerKg = gstRound(hit.rate);
      z.updatedAt = Date.now();
      // metals.dev publishes no MCX base metal today, so in practice this is
      // LME and gets the uplift. Only an explicitly MCX-named field is taken as
      // the Indian price, which keeps this correct if that ever appears.
      z.basis = /mcx/i.test(hit.field) ? 'mcx' : 'lme';
      z.source = 'metals.dev · ' + hit.field;
      saveState();
      renderZincCard();
      showToast(z.basis === 'lme'
        ? 'LME ' + formatCurrency(z.ratePerKg) + ' → MCX est. ' + formatCurrency(zincMcxRate()) +
          ' → ' + formatCurrency(zincLandedRate()) + '/kg landed'
        : 'MCX ' + formatCurrency(zincMcxRate()) + ' → ' +
          formatCurrency(zincLandedRate()) + '/kg landed');
    })
    .catch(function(err) {
      showToast('Could not reach metals.dev: ' + (err && err.message ? err.message : 'network error'), 'error');
    });
}

/* Returns {rate, field} or null. The matched field name comes back with the
   rate because it decides how the figure is treated: an MCX-named field is the
   Indian price and stands as-is, anything else is LME and gets the duty/freight
   uplift. It is shown in the UI too, so the provenance of the number on screen
   is never a guess. */
function _extractZincRate(json) {
  var buckets = [
    { obj: json.metals, path: 'metals' },
    { obj: json.rates, path: 'rates' },
    { obj: json.data, path: 'data' },
    { obj: json, path: '' }
  ];
  // MCX first in case the API ever carries it; then the explicitly-named LME
  // field, which is clearer provenance than the bare `zinc` alias for the same
  // number; bare aliases last.
  var names = ['mcx_zinc', 'zinc_mcx', 'lme_zinc', 'zinc_lme', 'zinc', 'Zinc', 'ZINC'];

  for (var n = 0; n < names.length; n++) {
    for (var b = 0; b < buckets.length; b++) {
      var bucket = buckets[b].obj;
      if (!bucket || typeof bucket !== 'object') continue;
      var v = bucket[names[n]];
      var rate = null;
      if (typeof v === 'number' && isFinite(v) && v > 0) rate = v;
      else if (v && typeof v === 'object' && typeof v.price === 'number' && v.price > 0) rate = v.price;
      if (rate != null) {
        return { rate: rate, field: (buckets[b].path ? buckets[b].path + '.' : '') + names[n] };
      }
    }
  }
  return null;
}

function _describeShape(json) {
  try {
    var top = Object.keys(json).join(', ');
    if (json.metals && typeof json.metals === 'object') {
      return top + ' | metals: ' + Object.keys(json.metals).slice(0, 12).join(', ');
    }
    return top;
  } catch (e) { return 'unreadable response'; }
}
/* ===== TAB SWITCHING (DP v0.2 9-step) ===== */
function switchTab(tabId) {
  // Step 1: Dismiss toasts and close overlays
  document.querySelectorAll('.inv-toast').forEach(t => t.remove());
  closeOverlay();
  closePrintPreview();

  // Step 1b: Drain focus stack without focusing (DP v0.2 Section 8)
  drainFocusStack();

  // Step 2: Capture scroll position of departing tab
  const currentPage = document.querySelector('.inv-page-active');
  if (currentPage) {
    _tabScroll[currentPage.id] = currentPage.scrollTop || window.scrollY;
  }

  // Step 3: Deactivate all tabs and pages
  document.querySelectorAll('.inv-page').forEach(p => p.classList.remove('inv-page-active'));
  document.querySelectorAll('.inv-tab').forEach(t => t.classList.remove('inv-tab-active'));
  // Phase 8A: Deactivate sidebar items
  document.querySelectorAll('.inv-sidebar-item').forEach(s => s.classList.remove('inv-sidebar-active'));

  // Step 4: Read and clear _navReturnTab
  const returnTab = _navReturnTab;
  _navReturnTab = null;

  // Step 5: Activate target page and tab
  const page = document.getElementById(tabId);
  if (page) page.classList.add('inv-page-active');
  document.querySelectorAll('.inv-tab').forEach(t => {
    if (t.dataset.tab === tabId) t.classList.add('inv-tab-active');
  });
  // Phase 8A: Activate sidebar item
  document.querySelectorAll('.inv-sidebar-item').forEach(s => {
    if (s.dataset.tab === tabId) s.classList.add('inv-sidebar-active');
  });

  // Step 5b: Persist active tab for refresh recovery (Phase 6b)
  regFilter.activeTab = tabId;
  saveRegFilter();

  // Step 6: Check dirty flag and re-render if needed
  const tabKey = tabId === 'pageHome' ? 'home' : tabId === 'pageRegister' ? 'register' : null;
  const isDirty = tabKey ? _tabDirty[tabKey] : true;

  if (tabId === 'pageHome') {
    if (isDirty) { renderHome(); _tabDirty.home = false; }
  } else if (tabId === 'pageRegister') {
    if (_isDesktop) {
      renderRegisterTable();
      _tabDirty.register = false;
    } else {
      if (!_regToolbarRendered) {
        renderRegisterToolbar();
        _regToolbarRendered = true;
      }
      if (isDirty) { renderRegisterList(); _tabDirty.register = false; }
    }
  } else if (tabId === 'pageClients') {
    renderClientsPage();
  } else if (tabId === 'pageIM') {
    // Cancel any in-progress challan form
    if (_challanForm) cancelAddChallan();
    if (_isDesktop) {
      renderIMTable();
    } else {
      if (!_imToolbarRendered) {
        renderIMToolbar();
        _imToolbarRendered = true;
      }
      renderIMList();
    }
  } else if (tabId === 'pageCreate') {
    if (!document.getElementById('createFormArea').innerHTML) initCreateForm();
  } else if (tabId === 'pageStaff') {
    renderAttendance();
  } else if (tabId === 'pageStats') {
    renderStats();
  } else if (tabId === 'pageHistory') {
    renderHistory();
  }

  // Step 7: Scroll restoration
  if (returnTab) {
    // Edit-return: restore scroll position
    const saved = _tabScroll[tabId];
    if (saved != null) {
      window.scrollTo(0, saved);
    }
  } else if (isDirty) {
    // New data: scroll to top
    window.scrollTo(0, 0);
  } else {
    // Clean reveal: restore saved position
    const saved = _tabScroll[tabId];
    if (saved != null) {
      window.scrollTo(0, saved);
    }
  }

  // Step 8: Focus first interactive element in target tab
  var targetPage = document.getElementById(tabId);
  if (targetPage) focusFirstInteractive(targetPage);
}

/* ===== HOME ===== */
function renderHome() {
  const now = new Date();
  const ym = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  const active = S.invoices.filter(i => i.status === 'active' && i.date && i.date.startsWith(ym));
  document.getElementById('mtdCount').textContent = active.length;
  document.getElementById('mtdRevenue').innerHTML = formatCurrency(active.reduce((s,i) => s + (i.taxableValue || 0), 0));

  renderZincCard();
  ghRenderCard();

  // Phase 5: Unbilled IM summary card
  var unbilledEl = document.getElementById('homeUnbilledCard');
  if (unbilledEl) {
    var pendingChallans = 0;
    var pendingAmount = 0;
    var pendingItemCount = 0;
    var latestChallan = null;
    (S.incomingMaterial || []).forEach(function(im) {
      var hasPending = false;
      im.items.forEach(function(it) {
        if (!it.invoiced) {
          hasPending = true;
          pendingAmount += (it.amount || 0);
          pendingItemCount++;
        }
      });
      if (hasPending) pendingChallans++;
      if (!latestChallan || (im.createdAt || 0) > (latestChallan.createdAt || 0)) {
        latestChallan = im;
      }
    });

    if (pendingChallans > 0 || latestChallan) {
      var ubHtml = '<div class="inv-card inv-card-unbilled">' +
        '<div class="inv-card-header"><span class="inv-card-title">Unbilled Material</span></div>';
      if (pendingChallans > 0) {
        ubHtml += '<div class="inv-unbilled-row"><span class="inv-unbilled-label">Pending challans</span>' +
          '<span class="inv-unbilled-value">' + pendingChallans + '</span></div>' +
          '<div class="inv-unbilled-row"><span class="inv-unbilled-label">Items awaiting invoicing</span>' +
          '<span class="inv-unbilled-value">' + pendingItemCount + '</span></div>' +
          '<div class="inv-unbilled-row"><span class="inv-unbilled-label">Pending amount</span>' +
          '<span class="inv-unbilled-value">' + formatCurrency(pendingAmount) + '</span></div>';
      } else {
        ubHtml += '<div class="inv-unbilled-row"><span class="inv-unbilled-label">All items invoiced</span>' +
          '<span class="inv-unbilled-value inv-text-cost">0 pending</span></div>';
      }
      if (latestChallan) {
        ubHtml += '<div class="inv-latest-challan">Latest: ' +
          '<span class="inv-latest-challan-num">' + (latestChallan.challanNo ? 'Ch. ' + escHtml(latestChallan.challanNo) : 'No number') + '</span> ' +
          escHtml(latestChallan.clientName) + ' &middot; ' + formatDate(latestChallan.challanDate) + '</div>';
      }
      ubHtml += '<button class="inv-quick-action" data-action="invSwitchTab" data-tab="pageIM">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>' +
        'View Incoming</button></div>';
      unbilledEl.innerHTML = ubHtml;
    } else {
      unbilledEl.innerHTML = '';
    }
  }

  const recent = [...S.invoices].sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 10);
  const el = document.getElementById('recentInvoices');
  if (recent.length === 0) {
    el.innerHTML = '<div class="inv-empty-state">' +
      '<svg class="inv-empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>' +
      '<div class="inv-mt-16">No invoices yet</div>' +
      '<div class="inv-mt-16"><button class="inv-btn inv-btn-primary" data-action="invCreateNew">Create your first invoice</button></div>' +
      '</div>';
    return;
  }
  el.innerHTML = recent.map(inv => {
    const cancelled = inv.status === 'cancelled';
    return '<div class="inv-client-item' + (cancelled ? ' inv-client-inactive' : '') + '" data-action="invViewInvoiceDetail" data-id="' + escHtml(inv.id) + '">' +
      '<div><div class="inv-client-name inv-mono inv-recent-num">' + escHtml(inv.displayNumber) + '</div>' +
      '<div class="inv-client-meta">' + escHtml(inv.clientName) + ' &middot; ' + formatDate(inv.date) + '</div></div>' +
      '<div class="inv-text-right inv-recent-right"><div class="inv-mono inv-text-cost inv-recent-total">' + formatCurrency(inv.grandTotal) + '</div>' +
      getStateBadgeHtml(inv) +
      '</div>' +
      '<button class="inv-recent-print" data-action="invPreviewInvoice" data-id="' + escHtml(inv.id) + '" aria-label="Print">' +
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>' +
      '</button></div>';
  }).join('');
}

/* ===== CLIENT MASTER ===== */
var _clientsActiveId = null;

function renderClientList(filter='') {
  const q = filter.toLowerCase();
  const sorted = [...S.clients].sort((a,b) => {
    if (a.isActive !== b.isActive) return a.isActive ? -1 : 1;
    return a.name.localeCompare(b.name);
  });
  const filtered = q ? sorted.filter(c => c.name.toLowerCase().includes(q) || (c.gstin||'').toLowerCase().includes(q)) : sorted;
  const el = document.getElementById('clientList');
  const countEl = document.getElementById('clientsCount');
  if (countEl) countEl.textContent = filtered.length + (filtered.length === 1 ? ' client' : ' clients');
  if (filtered.length === 0) { el.innerHTML = '<div class="inv-empty-state">No clients found</div>'; return; }
  el.innerHTML = filtered.map(c => {
    const sortedRates = (c.rates || []).slice().sort((a,b) => b.effectiveFrom.localeCompare(a.effectiveFrom));
    const rateInfo = sortedRates.length > 0 ? sortedRates[0] : null;
    const rateStr = rateInfo ? '\u20B9' + rateInfo.ratePerKg + '/kg' : 'No rate';
    var cardAction = _isDesktop ? 'invSelectClientRow' : 'invEditClient';
    var activeClass = (_isDesktop && _clientsActiveId === c.id) ? ' inv-client-item-active' : '';
    return '<div class="inv-client-item' + (c.isActive ? '' : ' inv-client-inactive') + activeClass + '" data-action="' + cardAction + '" data-id="' + c.id + '">' +
      '<div class="inv-client-content"><div class="inv-client-name">' + escHtml(c.name) + '</div>' +
      '<div class="inv-client-meta">' + escHtml(c.gstin || 'No GSTIN') + '</div>' +
      '<div class="inv-client-badges">' +
      '<span class="inv-client-badge inv-badge-mode">' + escHtml(c.billingMode) + '</span>' +
      '<span class="inv-client-badge inv-badge-rate">' + escHtml(rateStr) + '</span>' +
      (c.itemRates && c.itemRates.length ? '<span class="inv-override-badge">' + c.itemRates.length + ' override' + (c.itemRates.length>1?'s':'') + '</span>' : '') +
      (!c.isActive ? '<span class="inv-client-badge inv-badge-inactive">Inactive</span>' : '') +
      '</div></div>' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>';
  }).join('');

  // Desktop detail validation: active client filtered out → clear detail
  if (_isDesktop && _clientsActiveId) {
    var stillVisible = filtered.find(function(c) { return c.id === _clientsActiveId; });
    if (!stillVisible) {
      _clientsActiveId = null;
      var detail = document.getElementById('clientsDetail');
      if (detail) detail.innerHTML = _renderDetailEmpty();
    }
  }
}

    '<div class="inv-form-row inv-mb-8"><div class="inv-form-group"><label class="inv-form-label">' + (isAdd ? 'Rate/KG' : 'New Rate/KG') + '</label><input class="inv-form-input inv-mono" id="ceditNewRate" type="number" step="0.01" placeholder="14.25"></div>' +
    '<div class="inv-form-group"><label class="inv-form-label">Effective From</label><input class="inv-form-input inv-mono" id="ceditNewRateDate" type="date" value="' + localDateStr() + '"></div></div>' +
    (isAdd ? '' : '<button class="inv-btn inv-btn-ghost inv-btn-sm inv-mb-16" data-action="invAddRate" data-client="' + c.id + '">Add Rate</button>') +
    '<div class="inv-flex-between inv-mb-16"><label class="inv-checkbox-label">' +
    '<input type="checkbox" id="ceditActive"' + (c.isActive?' checked':'') + '> Active</label></div>' +
    '<div class="inv-btn-bar"><button class="inv-btn inv-btn-ghost" data-action="invCloseOverlay">Cancel</button>' +
    '<button class="inv-btn inv-btn-primary" data-action="invSaveClient" data-client="' + c.id + '" data-mode="' + (isAdd ? 'add' : 'edit') + '">' + (isAdd ? 'Add Client' : 'Save') + '</button></div></div>';
  scrim.addEventListener('click', e => { if (e.target === scrim) { scrim.remove(); document.body.style.overflow = ''; popFocus(); } });
  pushFocus();
  document.body.appendChild(scrim);
  document.body.style.overflow = 'hidden';
  focusFirstInteractive(scrim.querySelector('.inv-overlay-card'));
}

/* Reads the overlay form into a plain object. Returns null on validation failure
   (toast already shown). excludeId skips the client being edited in dup checks. */
function _readClientForm(excludeId) {
  const name = document.getElementById('ceditName').value.trim();
  if (!name) { showToast('Client name is required', 'error'); return null; }
  const dup = S.clients.find(x => x.id !== excludeId && (x.name || '').trim().toLowerCase() === name.toLowerCase());
  if (dup) { showToast('Client already exists: ' + dup.name, 'error'); return null; }

  const gstin = document.getElementById('ceditGstin').value.trim().toUpperCase();
  if (gstin && gstin.length !== 15) { showToast('GSTIN must be 15 characters', 'error'); return null; }

  return {
    name: name,
    gstin: gstin,
    state: document.getElementById('ceditState').value.trim(),
    stateCode: document.getElementById('ceditStateCode').value.trim(),
    add1: document.getElementById('ceditAdd1').value.trim(),
    add2: document.getElementById('ceditAdd2').value.trim(),
    add3: document.getElementById('ceditAdd3').value.trim(),
    mobile: document.getElementById('ceditMobile').value.trim(),
    phone: document.getElementById('ceditPhone').value.trim(),
    email: document.getElementById('ceditEmail').value.trim(),
    billingMode: document.getElementById('ceditMode').value,
    gstType: document.getElementById('ceditGstType').value,
    notes: document.getElementById('ceditNotes').value.trim(),
    isActive: document.getElementById('ceditActive').checked
  };
}

function saveClientEdit(clientId, mode) {
  if (mode === 'add') { addClient(); return; }
  const c = S.clients.find(x => x.id === clientId);
  if (!c) return;
  const form = _readClientForm(clientId);
  if (!form) return;
  Object.keys(form).forEach(k => { c[k] = form[k]; });
  saveState();
  closeOverlay();
  const searchEl = document.getElementById('clientSearch');
  renderClientList(searchEl ? searchEl.value : '');
  // Phase 8E: Refresh detail panel if active client was edited
  if (_isDesktop && _clientsActiveId === clientId) {
    _renderClientDetail(clientId, true);
  }
  showToast('Client saved');
}

function addClient() {
  const form = _readClientForm(0);
  if (!form) return;

  const c = _blankClient();
  Object.keys(form).forEach(k => { c[k] = form[k]; });
  c.id = S.clients.reduce((mx, x) => Math.max(mx, x.id), 0) + 1;

  // Opening rate is optional — a client can be created before rates are negotiated
  const rateVal = document.getElementById('ceditNewRate').value.trim();
  const rateDate = document.getElementById('ceditNewRateDate').value;
  if (rateVal !== '') {
    const rate = parseFloat(rateVal);
    if (isNaN(rate) || rate < 0) { showToast('Enter a valid rate', 'error'); return; }
    if (!rateDate) { showToast('Enter the rate effective date', 'error'); return; }
    c.rates.push({ratePerKg: gstRound(rate), ratePerPiece: null, effectiveFrom: rateDate});
  }

  S.clients.push(c);
  saveState();
  closeOverlay();
  // Clear the filter so the new client is never rendered out of view
  const searchEl = document.getElementById('clientSearch');
  if (searchEl) searchEl.value = '';
  // Desktop: let the detail render refresh the master so the new row gets its
  // active highlight — _clientsActiveId is only set inside _renderClientDetail
  if (_isDesktop) _renderClientDetail(c.id, false);
  else renderClientList('');
  showToast('Client added: ' + c.name);
}

function addClientRate(clientId) {
  const c = S.clients.find(x => x.id === clientId);
  if (!c) return;
  const rate = parseFloat(document.getElementById('ceditNewRate').value);
  const date = document.getElementById('ceditNewRateDate').value;
  if (isNaN(rate) || !date) { showToast('Enter rate and date','error'); return; }
  if (!c.rates) c.rates = [];
  c.rates.push({ratePerKg: rate, ratePerPiece: null, effectiveFrom: date});
  saveState();
  showToast('Rate added');
  closeOverlay();
  // Phase 8E: On desktop, refresh detail panel instead of reopening overlay
  if (_isDesktop && _clientsActiveId === clientId) {
    _renderClientDetail(clientId, false);
  } else {
    openClientEdit(clientId);
  }
}

function closeOverlay() {
  var count = document.querySelectorAll('.inv-overlay-scrim').length;
  document.querySelectorAll('.inv-overlay-scrim').forEach(s => s.remove());
  document.body.style.overflow = '';
  // Pop focus stack for each closed overlay
  for (var i = 0; i < count; i++) popFocus();
  // Phase 8A: Drain deferred mode switch
  if (_pendingModeSwitch) {
    _pendingModeSwitch = false;
    updateLayoutMode();
  }
}

function closeTopOverlay() {
  const all = document.querySelectorAll('.inv-overlay-scrim');
  if (all.length > 0) {
    all[all.length - 1].remove();
    if (document.querySelectorAll('.inv-overlay-scrim').length === 0) {
      document.body.style.overflow = '';
    }
    popFocus();
  }
}

/* ===== CLIENT DETAIL PANEL (Phase 8E) ===== */
function _renderClientDetail(clientId, skipMasterRefresh) {
  var c = S.clients.find(function(x) { return x.id === clientId; });
  if (!c) {
    _clientsActiveId = null;
    var detail = document.getElementById('clientsDetail');
    if (detail) detail.innerHTML = _renderDetailEmpty();
    if (!skipMasterRefresh) {
      var searchEl = document.getElementById('clientSearch');
      renderClientList(searchEl ? searchEl.value : '');
    }
    return;
  }

  _clientsActiveId = clientId;

  var html = '';

  // Header
  html += '<div class="inv-detail-section">' +
    '<div class="inv-detail-client-header">' +
    '<span class="inv-detail-client-name">' + escHtml(c.name) + '</span>' +
    '<span class="inv-client-badge ' + (c.isActive ? 'inv-badge-active' : 'inv-badge-inactive') + '">' +
    (c.isActive ? 'Active' : 'Inactive') + '</span></div></div>';

  // Info section
  html += '<div class="inv-detail-section">';
  if (c.gstin) {
    html += '<div class="inv-detail-label">GSTIN</div>' +
      '<div class="inv-detail-value-mono">' + escHtml(c.gstin) + '</div>';
  }
  if (c.state || c.stateCode) {
    html += '<div class="inv-detail-label">State</div>' +
      '<div class="inv-detail-value">' + escHtml(c.state || '') +
      (c.stateCode ? ' <span class="inv-detail-value-mono">(' + escHtml(c.stateCode) + ')</span>' : '') + '</div>';
  }
  var address = [c.add1, c.add2, c.add3].filter(function(a) { return a; });
  if (address.length > 0) {
    html += '<div class="inv-detail-label">Address</div>' +
      '<div class="inv-detail-value">' + address.map(function(a) { return escHtml(a); }).join('<br>') + '</div>';
  }
  html += '<div class="inv-detail-label">Billing Mode</div>' +
    '<div class="inv-detail-value">' + escHtml(c.billingMode) + '</div>';
  html += '<div class="inv-detail-label">GST Type</div>' +
    '<div class="inv-detail-value">' + escHtml(c.gstType === 'inter' ? 'Inter-state (IGST)' : 'Intra-state (CGST+SGST)') + '</div>';
  if (c.notes) {
    html += '<div class="inv-detail-label">Notes</div>' +
      '<div class="inv-detail-value">' + escHtml(c.notes) + '</div>';
  }
  html += '</div>';

  // Rate History
  var sortedRates = (c.rates || []).slice().sort(function(a, b) {
    return b.effectiveFrom.localeCompare(a.effectiveFrom);
  });
  if (sortedRates.length > 0) {
    var today = localDateStr();
    var currentRate = sortedRates.find(function(r) { return r.effectiveFrom <= today; });
    html += '<div class="inv-detail-section">' +
      '<div class="inv-detail-label">Rate History</div>';
    sortedRates.forEach(function(r) {
      var isCurrent = currentRate && r.effectiveFrom === currentRate.effectiveFrom;
      html += '<div class="inv-detail-rate-row' + (isCurrent ? ' inv-detail-rate-current' : '') + '">' +
        '<span class="inv-detail-value-mono">' + formatCurrency(r.ratePerKg) + '/kg</span>' +
        '<span class="inv-detail-value-mono inv-text-muted">' + escHtml(r.effectiveFrom) + '</span>' +
        (isCurrent ? '<span class="inv-client-badge inv-badge-active">Current</span>' : '') +
        '</div>';
    });
    html += '</div>';
  }

  // Item Rate Overrides
  if (c.itemRates && c.itemRates.length > 0) {
    html += '<div class="inv-detail-section">' +
      '<div class="inv-detail-label">Item Rate Overrides</div>';
    c.itemRates.forEach(function(ir) {
      html += '<div class="inv-detail-rate-row">' +
        '<span class="inv-detail-value-mono">' + escHtml(ir.partPattern) + '</span>' +
        '<span class="inv-detail-value-mono">' + formatCurrency(ir.rate) + '/' + escHtml(ir.unit || 'kg') + '</span>' +
        (ir.label ? '<span class="inv-text-muted">' + escHtml(ir.label) + '</span>' : '') +
        '</div>';
    });
    html += '</div>';
  }

  // Recent Invoices
  var clientInvoices = (S.invoices || []).filter(function(i) { return i.clientId === c.id; })
    .sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); })
    .slice(0, 5);
  if (clientInvoices.length > 0) {
    html += '<div class="inv-detail-section">' +
      '<div class="inv-detail-label">Recent Invoices</div>';
    clientInvoices.forEach(function(inv) {
      html += '<div class="inv-detail-invoice-row" data-action="invViewInvoiceDetail" data-id="' + escHtml(inv.id) + '">' +
        '<span class="inv-detail-value-mono">' + escHtml(inv.displayNumber) + '</span>' +
        '<span class="inv-detail-value-mono inv-text-muted">' + formatDate(inv.date) + '</span>' +
        '<span class="inv-detail-value-mono inv-text-cost">' + formatCurrency(inv.grandTotal) + '</span>' +
        '</div>';
    });
    html += '</div>';
  }

  // Action buttons
  html += '<div class="inv-detail-actions">' +
    '<button class="inv-btn inv-btn-primary" data-action="invEditClient" data-id="' + c.id + '">Edit</button>' +
    '<button class="inv-btn inv-btn-ghost" data-action="invStatsJumpRegister" data-client-id="' + c.id + '">View in Register</button>' +
    '</div>';

  var detailEl = document.getElementById('clientsDetail');
  if (detailEl) detailEl.innerHTML = html;

  // Update master to show active card highlight
  if (!skipMasterRefresh) {
    var searchEl = document.getElementById('clientSearch');
    renderClientList(searchEl ? searchEl.value : '');
  }
}

/* --- Clients page dispatcher --- */
function renderClientsPage() {
  var container = document.getElementById('clientsPageContent');
  if (!container) return;
  var subView = getItemsSubView();

  // Performance is one client's analysis, not a list with a detail panel, so it
  // renders full width in both layouts and skips the master-detail wrapper.
  if (subView === 'performance') {
    _updateClientsFab(subView, false);
    container.innerHTML = '<div id="clientsDesktopToggle">' + _buildSubViewToggle('performance') + '</div>' +
      '<div id="clientPerfArea"></div>';
    renderClientPerformance(document.getElementById('clientPerfArea'));
    return;
  }

  // Phase 8E: Desktop master-detail — toolbar buttons carry Add, FAB stays hidden
  if (_isDesktop) {
    _updateClientsFab(subView, false);
    _renderClientsDesktop(subView);
    return;
  }

  _updateClientsFab(subView, true);

  if (subView === 'items') {
    container.innerHTML = _buildItemsSubViewHtml();
    _bindItemsSearch();
    _itemsRendered = 0;
    _renderItemsList();
  } else {
    container.innerHTML = _buildClientsSubViewHtml();
    renderClientList('');
  }
}

  fab.dataset.action = isItems ? 'invAddItem' : 'invAddClient';
  fab.setAttribute('aria-label', isItems ? 'Add Item' : 'Add Client');

/* ===== CLIENTS/ITEMS DESKTOP MASTER-DETAIL (Phase 8E) ===== */
function _renderClientsDesktop(subView) {
  var container = document.getElementById('clientsPageContent');
  if (!container) return;

  var wrapper = document.getElementById('clientsMasterDetail');
  var toggleEl = document.getElementById('clientsDesktopToggle');

  if (!wrapper) {
    // First render — build full wrapper with toggle above
    container.innerHTML =
      '<div id="clientsDesktopToggle">' + _buildSubViewToggle(subView) + '</div>' +
      '<div class="inv-master-detail" id="clientsMasterDetail">' +
        '<div class="inv-master inv-master-clients" id="clientsMaster"></div>' +
        '<div class="inv-drag-handle" id="clientsDragHandle"></div>' +
        '<div class="inv-detail" id="clientsDetail">' + _renderDetailEmpty() + '</div>' +
      '</div>';
    _initDragHandle('clientsDragHandle', 'clientsMaster', 'clientsDetail', 'pageClients');
    _restorePanelWidth('clientsMaster', 'pageClients');
  } else {
    // Re-render — update toggle and master content only
    if (toggleEl) toggleEl.innerHTML = _buildSubViewToggle(subView);
  }

  var master = document.getElementById('clientsMaster');
  if (!master) return;

  // Detect sub-view switch: clear detail and both active IDs
  var prevSubView = master.dataset.subView;
  if (prevSubView && prevSubView !== subView) {
    _clientsActiveId = null;
    _itemsActiveId = null;
    var detail = document.getElementById('clientsDetail');
    if (detail) detail.innerHTML = _renderDetailEmpty();
  }
  master.dataset.subView = subView;

  if (subView === 'clients') {
    master.innerHTML = _buildClientsSubViewHtml(false);
    renderClientList('');
    _itemsActiveId = null;
  } else {
    master.innerHTML = _buildItemsSubViewHtml(false);
    _bindItemsSearch();
    _itemsRendered = 0;
    _renderItemsList();
    _clientsActiveId = null;
  }

  // Detail validation
  if (subView === 'clients' && _clientsActiveId) {
    var cStill = S.clients.find(function(c) { return c.id === _clientsActiveId; });
    if (!cStill) {
      _clientsActiveId = null;
      var d1 = document.getElementById('clientsDetail');
      if (d1) d1.innerHTML = _renderDetailEmpty();
    } else {
      _renderClientDetail(_clientsActiveId, true);
    }
  } else if (subView === 'items' && _itemsActiveId) {
    var iStill = S.items.find(function(it) { return it.id === _itemsActiveId; });
    if (!iStill) {
      _itemsActiveId = null;
      var d2 = document.getElementById('clientsDetail');
      if (d2) d2.innerHTML = _renderDetailEmpty();
    } else {
      _renderItemDetail(_itemsActiveId, true);
    }
  }
}

/* Item detail panel (Phase 8E) */
function _renderItemDetail(itemId, skipMasterRefresh) {
  var item = S.items.find(function(it) { return it.id === itemId; });
  if (!item) {
    _itemsActiveId = null;
    var detail = document.getElementById('clientsDetail');
    if (detail) detail.innerHTML = _renderDetailEmpty();
    if (!skipMasterRefresh) {
      _itemsRendered = 0;
      _renderItemsList();
    }
    return;
  }

  _itemsActiveId = itemId;

  var html = '';

  // Header
  html += '<div class="inv-detail-section">' +
    '<div class="inv-detail-client-name inv-detail-value-mono">' + escHtml(item.partNumber) + '</div></div>';

  // Info section
  html += '<div class="inv-detail-section">';
  if (item.desc) {
    html += '<div class="inv-detail-label">Description</div>' +
      '<div class="inv-detail-value">' + escHtml(item.desc) + '</div>';
  }
  if (item.gauge) {
    html += '<div class="inv-detail-label">Gauge / Spec</div>' +
      '<div class="inv-detail-value-mono">' + escHtml(item.gauge) + '</div>';
  }
  html += '<div class="inv-detail-label">HSN Code</div>' +
    '<div class="inv-detail-value-mono">' + escHtml(item.hsn || '998873') + '</div>';
  html += '<div class="inv-detail-label">Unit</div>' +
    '<div class="inv-detail-value">' + escHtml(item.unit || 'KG') + '</div>';
  html += '<div class="inv-detail-label">Default Rate</div>' +
    '<div class="inv-detail-value-mono">' + (item.rate ? formatCurrency(item.rate) : 'No rate') + '</div>';
  if (item.stdWeightKg != null) {
    html += '<div class="inv-detail-label">Standard Weight</div>' +
      '<div class="inv-detail-value-mono">' + formatNum(item.stdWeightKg, 3) + ' kg</div>';
  }
  html += '</div>';

  // Usage stats
  var cache = _buildUsageCache();
  var usage = cache[item.partNumber];
  html += '<div class="inv-detail-section">' +
    '<div class="inv-detail-label">Usage</div>';
  if (usage) {
    var invLines = 0;
    var imLines = 0;
    (S.invoices || []).forEach(function(inv) {
      inv.items.forEach(function(li) {
        if (li.partNumber === item.partNumber) invLines++;
      });
    });
    (S.incomingMaterial || []).forEach(function(im) {
      im.items.forEach(function(li) {
        if (li.partNumber === item.partNumber) imLines++;
      });
    });
    html += '<div class="inv-detail-value">' + usage.total + ' total references (' + usage.recent + ' in last 30 days)</div>' +
      '<div class="inv-detail-value inv-text-muted">' + invLines + ' invoice line' + (invLines !== 1 ? 's' : '') +
      ', ' + imLines + ' challan line' + (imLines !== 1 ? 's' : '') + '</div>';
  } else {
    html += '<div class="inv-detail-value inv-text-muted">Unused</div>';
  }
  html += '</div>';

  // Action buttons
  html += '<div class="inv-detail-actions">' +
    '<button class="inv-btn inv-btn-primary" data-action="invEditItem" data-id="' + item.id + '">Edit</button>' +
    '<button class="inv-btn inv-btn-danger" data-action="invDeleteItem" data-id="' + item.id + '">Delete</button>' +
    '</div>';

  var detailEl = document.getElementById('clientsDetail');
  if (detailEl) detailEl.innerHTML = html;

  // Update master to show active card highlight
  if (!skipMasterRefresh) {
    _itemsRendered = 0;
    _renderItemsList();
  }
}

function _bindItemsSearch() {
  var el = document.getElementById('itemsSearch');

  el.addEventListener('input', function() {
    regFilter.itemsSearch = el.value;
    saveRegFilter();

    _itemsSearchTimer = setTimeout(function() {
      _itemsRendered = 0;
      _renderItemsList();
    }, 300);
  });
}

/* --- Sort & filter items --- */
function _getSortedFilteredItems() {
  var search = getItemsSearch().toLowerCase();
  var sort = getItemsSort();
  var filter = getItemsFilter();

  var list = S.items.slice();

  // Filter
  if (filter === 'no-weight') {
    list = list.filter(function(it) { return it.stdWeightKg == null; });
  } else if (filter === 'unused') {
    var cache = _buildUsageCache();
    list = list.filter(function(it) { return !cache[it.partNumber]; });
  }

  // Search
  if (search.length > 0) {
    list = list.filter(function(it) {
      return (it.partNumber || '').toLowerCase().indexOf(search) >= 0 ||
             (it.desc || '').toLowerCase().indexOf(search) >= 0;
    });
  }

  // Sort
  if (sort === 'alpha') {
    list.sort(function(a, b) { return (a.partNumber || '').localeCompare(b.partNumber || ''); });
  } else if (sort === 'unit') {
    list.sort(function(a, b) {
      if (a.unit !== b.unit) return (a.unit || '').localeCompare(b.unit || '');
      return (a.partNumber || '').localeCompare(b.partNumber || '');
    });
  } else if (sort === 'rate') {
    list.sort(function(a, b) { return (b.rate || 0) - (a.rate || 0); });
  } else if (sort === 'usage') {
    list.sort(function(a, b) { return _getUsageScore(b.partNumber) - _getUsageScore(a.partNumber); });
  }

  return list;
}

function _renderItemsList() {
  var listEl = document.getElementById('itemsList');
  var moreEl = document.getElementById('itemsLoadMore');
  var countEl = document.getElementById('itemsCount');
  if (!listEl) return;

  _itemsSorted = _getSortedFilteredItems();
  var total = _itemsSorted.length;
  var search = getItemsSearch();

  if (countEl) countEl.textContent = total + ' item' + (total !== 1 ? 's' : '');

  if (total === 0) {
    listEl.innerHTML = '<div class="inv-empty-state">No items found</div>';
    if (moreEl) moreEl.innerHTML = '';
    return;
  }

  // For search results, render up to 100; otherwise batch
  var limit = search.length > 0 ? Math.min(total, 100) : Math.min(total, _itemsRendered + ITEMS_BATCH);
  if (_itemsRendered === 0) limit = Math.min(total, ITEMS_BATCH);

  var html = '<div class="inv-card-list">';
  for (var i = 0; i < limit; i++) {
    var it = _itemsSorted[i];
    var rateStr = (it.rate != null && it.rate > 0) ? formatCurrency(it.rate) : '';
    var noRate = !it.rate || it.rate === 0;
    var weightStr = it.stdWeightKg != null ? formatNum(it.stdWeightKg, 3) + ' kg' : '';
    var usageCount = _getUsageCount(it.partNumber);
    var isSelected = !!_itemsSelected[it.id];
    var itemAction = _isDesktop ? 'invSelectItemRow' : 'invEditItem';
    var itemActiveClass = (_isDesktop && _itemsActiveId === it.id) ? ' inv-item-card-active' : '';

    html += '<div class="inv-item-card' + (isSelected ? ' inv-item-selected' : '') + itemActiveClass + '" data-action="' + itemAction + '" data-id="' + it.id + '">' +
      '<div class="inv-item-card-top">' +
      '<label class="inv-item-check-wrap" data-action="invToggleItemSelect" data-id="' + it.id + '">' +
      '<input type="checkbox"' + (isSelected ? ' checked' : '') + ' class="inv-im-check"></label>' +
      '<span class="inv-item-pn inv-mono">' + escHtml(it.partNumber) + '</span>' +
      '<span class="inv-item-unit inv-client-badge inv-badge-mode">' + escHtml(it.unit) + '</span>' +
      '</div>' +
      '<div class="inv-item-card-bottom">' +
      '<span class="inv-item-desc">' + escHtml(it.desc || '') + '</span>' +
      '<span class="inv-item-rate inv-mono' + (noRate ? ' inv-text-muted' : ' inv-text-cost') + '">' +
      (noRate ? 'No rate' : rateStr) + '</span>' +
      '</div>' +
      '<div class="inv-item-badges-row">' +
      (it.gauge ? '<span class="inv-gauge-badge">' + escHtml(it.gauge) + '</span>' : '') +
      (weightStr ? '<span class="inv-weight-badge">' + escHtml(weightStr) + '</span>' : '') +
      (usageCount > 0 ? '<span class="inv-usage-badge">' + usageCount + ' ref' + (usageCount !== 1 ? 's' : '') + '</span>' :
        '<span class="inv-usage-badge inv-usage-zero">Unused</span>') +
      '</div>' +
      '</div>';
  }
  html += '</div>';

  listEl.innerHTML = html;
  _itemsRendered = limit;

  // Selection bar
  _renderItemsSelectionBar();

  // Load more button
  if (moreEl) {
    if (limit < total && search.length === 0) {
      moreEl.innerHTML = '<div class="inv-btn-bar inv-btn-bar-center">' +
        '<button class="inv-btn inv-btn-ghost" data-action="invLoadMoreItems">Load more (' + (total - limit) + ' remaining)</button></div>';
    } else {
      moreEl.innerHTML = '';
    }
  }

  // Phase 8E: Desktop detail validation — active item filtered out → clear detail
  if (_isDesktop && _itemsActiveId) {
    var stillVisible = _itemsSorted.find(function(it) { return it.id === _itemsActiveId; });
    if (!stillVisible) {
      _itemsActiveId = null;
      var detail = document.getElementById('clientsDetail');
      if (detail) detail.innerHTML = _renderDetailEmpty();
    }
  }
}

function saveItem(itemId, mode) {
  var pn = document.getElementById('itemEditPN').value.trim();
  if (!pn) { showToast('Part number is required', 'error'); return; }

  var desc = document.getElementById('itemEditDesc').value.trim();
  var gauge = document.getElementById('itemEditGauge').value.trim().toUpperCase();
  var hsn = document.getElementById('itemEditHSN').value.trim() || '998873';
  var unit = document.getElementById('itemEditUnit').value;
  var rate = parseFloat(document.getElementById('itemEditRate').value) || 0;
  var wVal = document.getElementById('itemEditWeight').value.trim();
  var stdW = wVal !== '' ? parseFloat(wVal) : null;
  if (stdW !== null && (isNaN(stdW) || stdW < 0)) stdW = null;

  if (mode === 'add') {
    // A part number may legitimately repeat across gauges — the clamp lines
    // carry the same number in 30X6, 35X6 and 40X6. Identity is part + gauge.
    var dup = S.items.find(function(it) {
      return (it.partNumber || '').trim().toLowerCase() === pn.toLowerCase() &&
             (it.gauge || '').trim().toUpperCase() === gauge;
    });
    if (dup) {
      showToast('Already exists: ' + dup.partNumber + (dup.gauge ? ' (' + dup.gauge + ')' : ''), 'error');
      return;
    }
    var maxId = S.items.reduce(function(mx, it) { return Math.max(mx, it.id); }, 0);
    var added = {
      id: maxId + 1,
      partNumber: pn,
      desc: desc,
      gauge: gauge,
      hsn: hsn,
      unit: unit,
      rate: rate,
      stdWeightKg: stdW
    };
    S.items.push(added);
    showToast('Item added: ' + pn);
    // Raised from a line being typed rather than from the Items tab: save, then
    // put the new part straight into that line. Returning the operator to the
    // Items list here is what made the round trip necessary in the first place.
    // Only this branch saves early — the shared tail below covers every other
    // path, and saving in both fired the sync debounce twice for one edit.
    if (_inlineItemReturn) {
      saveState();
      if (finishInlineItemAdd(added)) return;
    }
  } else {
    var item = S.items.find(function(it) { return it.id === itemId; });
    if (!item) return;
    item.partNumber = pn;
    item.desc = desc;
    item.gauge = gauge;
    item.hsn = hsn;
    item.unit = unit;
    item.rate = rate;
    item.stdWeightKg = stdW;
    showToast('Item updated');
  }

  saveState();
  closeOverlay();
  _itemsRendered = 0;
  _renderItemsList();
  // Phase 8E: Refresh detail panel if active item was edited
  if (_isDesktop && _itemsActiveId === itemId) {
    _renderItemDetail(itemId, true);
  }
}

function deleteItem(itemId) {
  var item = S.items.find(function(it) { return it.id === itemId; });
  if (!item) return;

  var invRefs = 0;
  var imRefs = 0;
  (S.invoices || []).forEach(function(inv) {
    inv.items.forEach(function(li) {
      if (li.partNumber === item.partNumber) invRefs++;
    });
  });
  (S.incomingMaterial || []).forEach(function(im) {
    im.items.forEach(function(li) {
      if (li.partNumber === item.partNumber) imRefs++;
    });
  });

  var msg = 'Delete ' + item.partNumber + '?';
  if (invRefs + imRefs > 0) {
    msg += '\n\nReferenced in ' + invRefs + ' invoice line' + (invRefs !== 1 ? 's' : '') +
      ' and ' + imRefs + ' challan line' + (imRefs !== 1 ? 's' : '') +
      '. Historical references will be kept as-is.';
  }
  if (!confirm(msg)) return;

  var idx = S.items.indexOf(item);
  if (idx > -1) S.items.splice(idx, 1);
  saveState();
  closeOverlay();
  // Phase 8E: Clear detail panel if active item was deleted
  if (_isDesktop && _itemsActiveId === itemId) {
    _itemsActiveId = null;
    var detail = document.getElementById('clientsDetail');
    if (detail) detail.innerHTML = _renderDetailEmpty();
  }
  _itemsRendered = 0;
  _renderItemsList();
  showToast('Item deleted');
}

/* --- Merge Duplicates Tool --- */

  }
